.vp-core{ display:block; width:100%; height:100%; border-radius:50%; background:radial-gradient(circle at 32% 28%,#fff 0,#c6e3ff 13%,#5aa2ff 42%,#5b3df0 78%,#2b1b8c 100%); box-shadow:0 0 64px rgba(90,160,255,.6),inset 0 -14px 32px rgba(20,10,80,.5); transform:scale(calc(1 + var(--lvl) * .26)); will-change:transform; transition:filter .5s; }
.vp-status{ font-size:1.55rem; font-weight:600; letter-spacing:-.01em; }
.vp-cap{ min-height:4.8em; max-width:520px; font-size:1.05rem; line-height:1.45; color:rgba(255,255,255,.72); text-align:center; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; }
.vp-cap.sw{ animation:vpSwap .4s ease both; }
@keyframes vpSwap{ from{opacity:0;transform:translateY(6px);filter:blur(4px)} to{opacity:1;transform:none;filter:none} }
.vp[data-s="think"] .vp-ring,.vp[data-s="mute"] .vp-ring{ animation:none; opacity:0; }
.vp[data-s="think"] .vp-glow{ animation-duration:2.2s; opacity:.8; }
.vp[data-s="think"] .vp-breath{ animation:vpThink 1.5s ease-in-out infinite; }
@keyframes vpThink{ 0%,100%{transform:scale(.9) rotate(0)} 50%{transform:scale(1.06) rotate(180deg)} }
.vp[data-s="speak"] .vp-glow{ opacity:.8; animation-duration:5s; }
.vp[data-s="mute"] .vp-core,.vp.muted .vp-core{ filter:grayscale(.9) brightness(.65); }

.vp-ctrl{ display:flex; align-items:center; gap:26px; }
.vp-btn{ width:68px; height:68px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.1); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); color:#fff; transition:transform .15s,background .25s,color .25s; }
.vp-btn svg{ width:28px; height:28px; }
.vp-btn:active{ transform:scale(.92); }
.vp.muted .vp-mute{ background:#fff; color:#0a0d14; }

/* ===== ONBOARDING (consent / name / plan) ===== */
.auth{ background:radial-gradient(120% 70% at 50% 110%,rgba(34,197,94,.14),transparent 62%),radial-gradient(90% 50% at 50% -12%,rgba(34,211,238,.10),transparent 62%),var(--bg); }
.auth-card.landing > .ob-screen{ flex:1; width:100%; display:flex; flex-direction:column; justify-content:space-between; gap:22px; padding:18px 0 6px; min-height:100%; animation:none; }
.ob-screen.leave,.auth-card > .leave{ opacity:0; transform:translateY(-10px) scale(.985); filter:blur(5px); transition:opacity .2s ease,transform .2s ease,filter .2s ease; }
.ob-screen > *{ opacity:0; transform:translateY(16px); filter:blur(8px); animation:obIn .65s var(--ease) forwards; }
.ob-screen > :nth-child(2){ animation-delay:.07s; } .ob-screen > :nth-child(3){ animation-delay:.14s; }
@keyframes obIn{ to{ opacity:1; transform:none; filter:none; } }
.ob-brand{ display:flex; align-items:center; justify-content:center; gap:10px; font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-weight:500; font-size:1.6rem; letter-spacing:-.01em; padding-top:6px; }

.ob-mid{ display:flex; flex-direction:column; gap:14px; flex:1; justify-content:center; min-height:0; }
.ob-h{ font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-weight:700; font-size:clamp(2rem,9vw,2.6rem); line-height:1.1; letter-spacing:-.02em; text-align:center; }
.ob-sub{ text-align:center; color:var(--text-muted); font-family:Georgia,"Iowan Old Style",serif; font-weight:600; font-size:1.12rem; margin-bottom:10px; }
.ob-box{ display:flex; flex-direction:column; gap:22px; padding:24px 20px; border-radius:26px; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
html[data-theme="light"] .ob-box{ background:rgba(20,30,70,.05); border-color:rgba(20,30,70,.1); }
.ob-check{ display:flex; gap:16px; align-items:flex-start; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.ob-check input{ position:absolute; opacity:0; width:0; height:0; }
.ob-check .cb{ width:26px; height:26px; flex-shrink:0; margin-top:3px; border-radius:9px; border:1.6px solid rgba(255,255,255,.3); display:grid; place-items:center; color:var(--bg); transition:background .25s var(--ease),border-color .25s,transform .15s; }

.ob-check input:checked + .cb{ background:var(--text); border-color:var(--text); }
.ob-check input:checked + .cb svg{ opacity:1; transform:none; }
.ob-check:active .cb{ transform:scale(.9); }
.ob-check .tx{ font-family:Georgia,"Iowan Old Style",serif; font-weight:600; font-size:1.12rem; line-height:1.5; color:var(--text-secondary); }

.ob-bot{ display:flex; flex-direction:column; gap:10px; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px)); }
.ob-btn{ height:62px; border-radius:999px; border:0; background:var(--text); color:var(--bg); font:inherit; font-size:1.18rem; font-weight:700; transition:background .3s var(--ease),color .3s,transform .15s,opacity .3s; display:flex; align-items:center; justify-content:center; }
.ob-btn[disabled]{ background:rgba(140,140,140,.38); color:rgba(255,255,255,.55); }

.ob-btn:not([disabled]):active,.ob-pbtn:not([disabled]):active{ transform:scale(.97); }
.ob-fields{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
.ob-in{ width:100%; height:64px; padding:0 22px; border-radius:22px; border:1.6px solid rgba(255,255,255,.14); background:rgba(255,255,255,.04); color:var(--text); font:inherit; font-size:1.2rem; font-weight:500; outline:none !important; box-shadow:none !important; transition:border-color .25s,background .25s; }

.ob-planscr .ob-mid{ justify-content:flex-start; padding-top:8px; }
.ob-seg{ position:relative; align-self:center; display:grid; grid-template-columns:repeat(3,1fr); width:min(100%,330px); padding:4px; border-radius:18px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); margin:6px 0 10px; }
html[data-theme="light"] .ob-seg{ background:rgba(20,30,70,.06); border-color:rgba(20,30,70,.1); }
.ob-seg .pill{ position:absolute; top:4px; bottom:4px; left:4px; width:calc((100% - 8px) / 3); border-radius:14px; background:var(--bg); box-shadow:0 2px 10px rgba(0,0,0,.35); transform:translateX(calc(var(--i) * 100%)); transition:transform .42s cubic-bezier(.3,1.1,.4,1); }
.ob-seg button{ position:relative; z-index:1; height:44px; border:0; background:none; color:var(--text-muted); font:inherit; font-size:1.08rem; font-weight:700; transition:color .25s; }
.ob-seg button.on{ color:var(--text); }
.ob-track{ display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; margin:0 -24px; padding:4px 24px 10px; -webkit-overflow-scrolling:touch; }

.ob-plan .ps{ font-size:1.12rem; font-weight:600; line-height:1.35; margin-bottom:12px; }
.ob-pbtn{ height:58px; border-radius:999px; border:0; background:var(--text); color:var(--bg); font:inherit; font-size:1.15rem; font-weight:700; transition:transform .15s,background .25s; }
.ob-pbtn[disabled]{ background:rgba(140,140,140,.3); color:var(--text-muted); }
.ob-plan ul{ list-style:none; margin:14px 0 0; padding:18px 0 0; border-top:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; gap:12px; }

.ob-foot{ text-align:center; color:var(--text-muted); font-size:.95rem; font-weight:600; }
@media (prefers-reduced-motion:reduce){ .ob-screen > *{ animation:none; opacity:1; transform:none; filter:none; } .ob-seg .pill{ transition:none; } }

(function(){
"use strict";
var CFG=window.DEEPSINKY_CONFIG||{};
var API=String(CFG.api||"").replace(/\/+$/,""), GID=CFG.googleClientId||"";
var TK="deepsinky_token_v1", SESS="deepsinky_session_v1", SKB="deepsinky_state_v1";
var el=document.getElementById("auth"), card=document.getElementById("authCard");
var token=null, sess=null;
try{ token=localStorage.getItem(TK); sess=localStorage.getItem(SESS); }catch(e){}
function clearSession(){ try{ localStorage.removeItem(TK); localStorage.removeItem(SESS); }catch(e){} }
var valid=!!(token&&sess&&sess!=="guest");
window.__auth={
    email: valid?sess:null,
    token: valid?token:null,
    logout:function(){
        clearSession();
        try{ if(window.google&&google.accounts&&google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}
        location.reload();
    }
};
if(valid){
    var nm=""; try{ nm=localStorage.getItem("deepsinky_name")||""; }catch(e){}
    window.DS_USER={name:nm||sess.split("@")[0],email:sess};
    window.DS_LOGOUT=window.__auth.logout;
    if(el) el.remove();
    /* confirm the session with the server in the background; expired/invalid -> back to login */
    fetch(API+"/auth/me",{headers:{Authorization:"Bearer "+token}}).then(function(r){ if(r.status===401) window.__auth.logout(); }).catch(function(){});
    return;
}
clearSession();

function esc(t){ var d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYEX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4M6.6 6.7A17 17 0 002 12s3.5 7 10 7c1.9 0 3.6-.5 5-1.2M9.9 9.9a3 3 0 004.2 4.2"/></svg>';
var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var LOGO='<img class="auth-logo dslogo" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">';

function head(t,s){ return LOGO+'<h1>'+t+'</h1>'+(s?'<p class="sub">'+s+'</p>':''); }
function pwField(id,ph,auto){ return '<label class="afield"><input id="'+id+'" type="password" placeholder="'+ph+'" autocomplete="'+auto+'"><button type="button" class="eye" data-eye aria-label="Show password">'+EYE+'</button></label>'; }
function show(html,back,focus,landing){
    stopAnim();
    card.className="auth-card"+(landing?" landing":"");
    card.innerHTML=html;
    var st=card.querySelector(".auth-step"); if(st&&back) st.classList.add("back");
    card.querySelectorAll("[data-eye]").forEach(function(b){
        b.onclick=function(){ var i=b.parentNode.querySelector("input"), v=i.type==="password"; i.type=v?"text":"password"; b.innerHTML=v?EYEX:EYE; };
    });
    if(window.__applyLogos) window.__applyLogos();
    if(focus){ var f=card.querySelector("input"); if(f) f.focus(); }
}
function err(msg){ var e=card.querySelector(".aerr"); if(!e) return; e.textContent=msg; e.classList.remove("shake"); void e.offsetWidth; e.classList.add("shake"); }
function hint(msg){ var h=card.querySelector(".ahint"); if(h) h.textContent=msg; }
function busy(btn,on,label){ btn.disabled=on; btn.innerHTML=on?'<span class="aspin"></span>':label; }
function enter(btn,fn){ card.querySelectorAll("input").forEach(function(i){ i.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); fn(); } }); }); btn.onclick=fn; }

/* ---- talk to the server ---- */
function call(path,body){
    var slow=setTimeout(function(){ hint("Waking the server up… this can take up to a minute"); },4000);
    return fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
        .catch(function(){ throw new Error("Couldn't reach the server. Check your connection and try again."); })
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if(r.status===404&&!d.error) throw new Error("Login server isn't set up yet: the /auth routes are missing on "+API.replace(/^https?:\/\//,"")+". Deploy auth.js there first.");
            if(!r.ok) throw new Error(d.error||"Something went wrong ("+r.status+")"); return d; }); })
        .then(function(d){ clearTimeout(slow); hint(""); return d; }, function(e){ clearTimeout(slow); hint(""); throw e; });
}
function finish(d){
    try{
        localStorage.setItem(TK,d.token); localStorage.setItem(SESS,d.user.email);
        var k=SKB+":"+d.user.email, st={}; try{ st=JSON.parse(localStorage.getItem(k)||"{}"); }catch(e){}
        if(!st.name||st.name==="G") st.name=d.user.name; localStorage.setItem(k,JSON.stringify(st)); localStorage.setItem("deepsinky_name",d.user.name);
    }catch(e){}
    el.classList.add("out");
    setTimeout(function(){ stopAnim(); location.reload(); },320);
}

/* ---- Google sign-in (Google Identity Services; the server verifies the ID token) ---- */

var GBTN='<button type="button" class="gbtn" id="gBtn">'+GSVG+'<span>Continue with Google</span></button>';
var gClient=null, gLoading=false;
function initG(){
    try{
        gClient=google.accounts.oauth2.initTokenClient({
            client_id:GID, scope:"openid email profile",
            callback:function(r){
                if(r&&r.access_token){ call("/auth/google",{access_token:r.access_token}).then(googleDone).catch(function(e){ err(e.message); }); }
                else err("Google sign-in was cancelled.");
            },
            error_callback:function(e){
                if(e&&e.type==="popup_closed") return;
                err(e&&e.type==="popup_failed_to_open"?"Allow pop-ups for this site, then try again.":"Google sign-in failed. Please try again.");
            }
        });
    }catch(e){ gClient=null; }
}
function loadGsi(){
    if(window.google&&google.accounts&&google.accounts.oauth2){ initG(); return; }
    if(gLoading) return; gLoading=true;
    var sc=document.createElement("script"); sc.src="https://accounts.google.com/gsi/client"; sc.async=true;
    sc.onload=function(){ gLoading=false; initG(); }; sc.onerror=function(){ gLoading=false; };
    document.head.appendChild(sc);
}
function wireGoogle(btn){
    if(!btn) return;
    if(GID) loadGsi();
    btn.onclick=function(){
        err("");
        if(!GID) return err("Google sign-in isn't set up yet. Add your Google Client ID in index.html.");
        if(!gClient){ loadGsi(); return err("Google sign-in can't load here. Open DeepSINKY in your browser (deepsinky.github.io) and try again."); }
        gClient.requestAccessToken({prompt:"select_account"});
    };
}

/* ==========================================================

var PLANS=[
    {k:"free",t:"Free",s:"For getting started with DeepSINKY",b:"Stay on Free",f:["Chat with DeepSINKY, a helpful AI assistant","Upload files and images for analysis","Basic usage limits"]},

    wireDocs();
    var track=card.querySelector(".ob-track"), seg=card.querySelector(".ob-seg");
    function setTab(i){ seg.style.setProperty("--i",i); seg.querySelectorAll("button").forEach(function(b,n){ b.classList.toggle("on",n===i); }); }
    seg.addEventListener("click",function(e){
        var b=e.target.closest("button"); if(!b) return; var i=+b.getAttribute("data-i"), c=track.children[i];
        var tr=track.getBoundingClientRect(), cr=c.getBoundingClientRect();
        track.scrollTo({left:track.scrollLeft+(cr.left+cr.width/2)-(tr.left+tr.width/2),behavior:"smooth"}); setTab(i);
    });
    var st; track.addEventListener("scroll",function(){
        clearTimeout(st); st=setTimeout(function(){
            var tr=track.getBoundingClientRect(), mid=tr.left+tr.width/2, best=0, bd=1e9;
            for(var n=0;n<track.children.length;n++){ var r=track.children[n].getBoundingClientRect(), d=Math.abs(r.left+r.width/2-mid); if(d<bd){ bd=d; best=n; } }
            setTab(best);
        },50);
    });
    var free=card.querySelector('.ob-pbtn[data-k="free"]');
    free.onclick=function(){ complete(ctx,free); };
    });
}

function complete(ctx,btn){
    var first=ctx.first||"", last=ctx.last||"", name=(first+" "+last).trim();
    function done(d){
        d.user=d.user||{}; if(name) d.user.name=name; var email=d.user.email||ctx.email||"";

            localStorage.setItem("deepsinky_first",first); localStorage.setItem("deepsinky_last",last);
        }catch(e){}

    busy(btn,true);
    if(ctx.mode==="google") return done(ctx.d);
    call("/auth/signup",{email:ctx.email,name:name,firstName:first,lastName:last,password:ctx.password})
        .then(done).catch(function(e){ busy(btn,false,"Stay on Free"); err(e.message); });
}

stepEmail();
})();

/* Markdown -> sanitized DOM, with highlighted code + copy-code buttons */
function renderMarkdown(text){
    const box = document.createElement("div");
    if (!window.DOMPurify){ box.textContent = text; box.style.whiteSpace = "pre-wrap"; return box; }
    box.innerHTML = DOMPurify.sanitize(marked.parse(text));
    box.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
    box.querySelectorAll("pre").forEach(pre => {
        const code = pre.querySelector("code");
        if (!code) return;
        const lang = ((code.className.match(/language-([\w+-]+)/) || [])[1]) || "";
        const raw = code.textContent;
        if (window.hljs && lang && hljs.getLanguage(lang)){ try{ hljs.highlightElement(code); }catch(e){} }
        const wrap = document.createElement("div");
        wrap.className = "codeblock";
        const head = document.createElement("div");
        head.className = "code-head";
        const label = document.createElement("span");
        label.textContent = lang || "code";
        const acts = document.createElement("div"); acts.className = "code-acts";
        const cb = document.createElement("button"); cb.type = "button"; cb.setAttribute("aria-label", "Copy code"); cb.innerHTML = ICON.copy;
        cb.addEventListener("click", () => copyCode(cb, raw));
        const xb = document.createElement("button"); xb.type = "button"; xb.setAttribute("aria-label", "Expand code"); xb.innerHTML = ICON.expand;
        xb.addEventListener("click", () => expandCode(lang, raw));
        acts.append(cb, xb);
        head.append(label, acts);
        pre.replaceWith(wrap);
        const body = document.createElement("div"); body.className = "code-body";
        const gut = document.createElement("div"); gut.className = "code-gutter";
        gut.textContent = Array.from({length: raw.replace(/\n$/, "").split("\n").length}, (_, i) => i + 1).join("\n");
        body.append(gut, pre);
        wrap.append(head, body);

    return box;
}

/* Conversation context: send the recent history (bounded by size), oldest dropped first. */
function buildHistory(chat){
    const MAX_CHARS = 80000;
    const out = [];
    let used = 0;
    for (let i = chat.messages.length - 1; i >= 0; i--){
        const m = chat.messages[i];
        if (m.error) continue;
        const cc = m.role === "user" ? compose(m) : m.text;
        used += cc.length;
        if (used > MAX_CHARS && out.length) break;
        out.unshift({ role:m.role, content:cc });
    }
    while (out.length && out[0].role !== "user") out.shift();
    return out;
}

async function sendToAPI(){
    stopSpeaking();
    const chat = getActiveChat();
    if (!chat) return;
    const msgs = buildHistory(chat);
    const last = msgs[msgs.length - 1];
    if (!last || last.role !== "user"){ setGenerating(false); return; }

    setGenerating(true);
    controller = new AbortController();
    showThinking();

    const push = (m) => {
        m.ts = Date.now();
        chat.messages.push(m);
        saveChats();
        if (getActiveChat() === chat){
            appendMessageEl(m, chat.messages.length - 1);
            scrollToBottom();
        }
    };

    try{
        // "message" keeps the current server working; "history"/"messages" carry the context.
        const fullBody = { message:sendMsg(last.content), history:msgs.slice(0,-1), messages:msgs.slice(0,-1).concat([{ role:"user", content:sendMsg(last.content) }]), system:sysPrefix(), web_search:S.web, images:lastImgs };
        const leanBody = { message:fullBody.message, history:fullBody.history };
        let res = null, detail = "", usedLean = false;
        for (let attempt = 0; attempt < 3; attempt++){
            usedLean = attempt === 2;                                    // 3rd try: plain message + history only
            res = await fetch(API_URL, {
                method:"POST",
                headers:{ "Content-Type":"application/json" },
                body: JSON.stringify(usedLean ? leanBody : fullBody),
                signal: controller.signal
            });
            if (res.ok || ![500,502,503,504].includes(res.status)) break;
            detail = await res.clone().text().then(t => { try{ const j = JSON.parse(t); return j.error || j.message || j.detail || ""; }catch(e){ return /<html/i.test(t) ? "" : t.slice(0,160); } }).catch(() => "");
            await new Promise(r => setTimeout(r, attempt === 0 ? 1800 : 900));   // Render may still be waking up
            if (controller.signal.aborted){ const ab = new Error("aborted"); ab.name = "AbortError"; throw ab; }
        }
        if (!res.ok){
            const e = new Error(res.status === 413 ? "Message too large for the server - raise its JSON limit: express.json({limit:'30mb'})" : "Server error (" + res.status + ")" + (detail ? ": " + String(detail).slice(0,160) : ""));
            e.srv = true; throw e;
        }
        if (usedLean) showToast("Server was busy - answered in simple mode");
        const data = await res.json();
        if (!data.reply) throw new Error("Empty response from server");

        hideThinking();
        push({ role:"assistant", text:data.reply });
        if (getActiveChat() === chat) revealLast(chat);
        if (voice) speakThenListen(data.reply);
        setStatus("online");

    }catch(err){
        hideThinking();
        if (err.name === "AbortError"){
            push({ role:"assistant", text:"Generation stopped.", error:true });
        } else {
            const msgText = (!err.srv && /fetch|network|failed/i.test(err.message))
                ? "Couldn't reach DeepSINKY's server. Check your connection and try again."
                : err.message;
            push({ role:"assistant", text:msgText, error:true });
            setStatus("offline");
            if (voice) stopVoice();
        }
    }finally{
        setGenerating(false);
        controller = null;
    }
}

function shrink(file,max,q){
    return new Promise((res,rej)=>{
        const u=URL.createObjectURL(file), im=new Image();
        im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas");
            c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
            c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",q)); };
        im.onerror=()=>{ URL.revokeObjectURL(u); rej(); };
        im.src=u;
    });
}
const words=t=>t.trim()?t.trim().split(/\s+/).length:0;
async function readFile(a){
    const f=a.file, n=f.name.toLowerCase();
    if(f.type.startsWith("image/")){
        a.kind="image"; a.data=await shrink(f,1280,.82); a.thumb=await shrink(f,480,.6); a.url=a.thumb;
        a.ocr=(async()=>{ try{
            await load("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
            const r=await Tesseract.recognize(a.data,"eng"), t=(r.data.text||"").trim();
            if(t.length>15) a.text="Text detected in this image (OCR):\n"+t.slice(0,20000);
        }catch(e){} })();
        return;
    }
    if(n.endsWith(".pdf")){
        await load(CDN+"pdf.js/3.11.174/pdf.min.js");
        pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+"pdf.js/3.11.174/pdf.worker.min.js";
        const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; let t="";
        for(let i=1;i<=d.numPages&&t.length<CAP;i++){ const c=await (await d.getPage(i)).getTextContent(); t+="\n"+c.items.map(x=>x.str).join(" "); }
        a.text=t.trim();
    } else if(n.endsWith(".docx")){
        await load(CDN+"mammoth/1.6.0/mammoth.browser.min.js");
        a.text=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value.trim();
    } else {
        const t=await f.text();
        if(/\u0000/.test(t.slice(0,2000))) throw 0;
        a.text=t;
    }
    if(!a.text) throw 0;
    if(a.text.length>CAP){ a.text=a.text.slice(0,CAP)+"\n…[truncated]"; showToast(a.name+" is very long — first part used"); }
    a.words=words(a.text);
}
const sub=a=>a.kind==="image"?"Image":isDoc(a)?"PDF · "+docPages(a)+(docPages(a)>1?" pages":" page")+" · "+a.words+" words":a.kind==="paste"?a.words+" words":a.kind==="web"?"Web page · "+a.words+" words":(a.name.split(".").pop()||"file").toUpperCase()+(a.words?" · "+a.words+" words":"");

function renderAttach(){
    attachRow.innerHTML=""; attachRow.hidden=false; attachRow.dataset.open=attachments.length?"true":"false";
    attachments.forEach((a,i)=>{
        const c=document.createElement("div");
        c.className="chip"+(a.busy?" busy":"")+(a.url?" imgc":"")+(a.shown?"":" pop"); a.shown=true;
        c.innerHTML=(a.url?'<img alt="">':fileIcon(a))+'<div class="ct"><b></b><small></small></div><button type="button" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
        if(a.url) c.querySelector("img").src=a.url;
        c.querySelector("b").textContent=a.name;
        c.querySelector("small").textContent=a.busy?"Reading…":sub(a);
        c.querySelector(".ct").onclick=()=>{ if(!a.busy) attPreview(a); };
        c.querySelector("button").onclick=()=>{ attachments.splice(i,1); renderAttach(); updateSendBtn(); };
        attachRow.appendChild(c);
    });
}
function addFiles(list){
    for(const f of list){
        if(attachments.length>=MAX_FILES){ showToast("You can attach up to "+MAX_FILES+" files"); break; }
        if(f.size>MAX_BYTES){ showToast(f.name+" is too large (25 MB max)"); continue; }
        const a={file:f,name:f.name||"file",kind:"file",busy:true};
        attachments.push(a);
        readFile(a).catch(()=>{ showToast("Couldn't read "+a.name); attachments=attachments.filter(x=>x!==a); })
            .finally(()=>{ a.busy=false; renderAttach(); updateSendBtn(); });
    }
    renderAttach(); updateSendBtn();
}
function addPaste(t,name,kind){
    if(t.length>CAP) t=t.slice(0,CAP)+"\n…[truncated]";
    attachments.push({name:name||pasteTitle(t),kind:kind||"paste",text:t,words:words(t)});
    renderAttach(); updateSendBtn();
}
promptInput.addEventListener("paste",e=>{
    const cd=e.clipboardData; if(!cd) return;
    const fs=[...cd.files]; if(fs.length){ e.preventDefault(); addFiles(fs); return; }
    const t=cd.getData("text");
    if(t.length>1500||t.split("\n").length>25){ e.preventDefault(); addPaste(t); }
});
["dragover","drop"].forEach(t=>document.addEventListener(t,e=>{
    if(!e.dataTransfer||![...e.dataTransfer.types].includes("Files")) return;
    e.preventDefault(); if(t==="drop") addFiles(e.dataTransfer.files);
}));

function showLB(node,btns){
    lb.innerHTML=""; const box=document.createElement("div"); box.className="lb-box"; box.appendChild(node);

    (btns||[]).concat([["Close",()=>{}]]).forEach(([t,f])=>{ const b=document.createElement("button"); b.type="button"; b.textContent=t; b.onclick=()=>{ lb.hidden=true; f(); }; r.appendChild(b); });

function attPreview(a){
    const n=document.createElement("div");
    if(a.thumb){ const i=new Image(); i.src=a.thumb; i.className="lb-img"; n.appendChild(i); }
    if(isDoc(a)){ const h=document.createElement("div"); h.className="lb-doc"; h.innerHTML=fileIcon(a)+"<div><b></b><small></small></div>"; h.querySelector("b").textContent=a.name; h.querySelector("small").textContent=sub(a); n.appendChild(h); }
    if(a.text){ const p=document.createElement("pre"); p.textContent=a.text.slice(0,8000)+(a.text.length>8000?"\n…":""); n.appendChild(p); }
    showLB(n,(isDoc(a)?[["Download PDF",()=>makePdf(a)]]:[]).concat([["Attach again",()=>reattach(a)]]));
}
function reattach(a){
    attachments.push({name:a.name,kind:a.kind,thumb:a.thumb,url:a.thumb,data:a.kind==="image"?a.thumb:null,text:a.text,words:a.words});
    renderAttach(); updateSendBtn(); closePanel(); showToast("Attached");

function attCard(a){

    if(a.thumb){ d.className="att-img"; d.innerHTML='<img alt="">'; d.firstChild.src=a.thumb; }
    else { d.className="att-file"; d.innerHTML=fileIcon(a)+'<div class="ct"><b></b><small></small></div>'; d.querySelector("b").textContent=a.name; d.querySelector("small").textContent=sub(a); }
    d.addEventListener("click",()=>attPreview(a));
    return d;
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBase = "";
function toggleMic(){
    if (!SpeechRec){ showToast("Voice input isn't supported in this browser"); return; }
    if (listening){ rec.stop(); return; }
    rec = new SpeechRec();
    rec.lang = navigator.language || "en-US";
    rec.interimResults = true;
    rec.continuous = false;
    micBase = promptInput.value ? promptInput.value.replace(/\s*$/, " ") : "";
    rec.onstart = () => { listening = true; updateSendBtn(); };
    rec.onresult = (e) => {
        let t = "";
        for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        promptInput.value = micBase + t;
        promptInput.dispatchEvent(new Event("input"));
    };
    rec.onerror = (e) => {
        showToast(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Microphone permission denied"
            : e.error === "no-speech" ? "Didn't catch anything — try again" : "Voice input error: " + e.error);
    };
    rec.onend = () => { listening = false; updateSendBtn(); };
    try{ rec.start(); }catch(err){ showToast("Couldn't start the microphone"); }
}

/* live plugins: real public APIs, called from the browser */
async function pluginContext(t){
    const out=[], f=u=>Promise.race([fetch(u).then(r=>r.ok?r.json():null),new Promise(r=>setTimeout(()=>r(null),6000))]).catch(()=>null);
    if(S.plug.includes("github")){
        const m=t.match(/github\.com\/([\w.-]+)\/([\w.-]+)/i);
        if(m){ const r=m[2].replace(/\.git$/,""), b="https://api.github.com/repos/"+m[1]+"/"+r;
            const [d,i]=await Promise.all([f(b),f(b+"/issues?state=open&per_page=8")]);
            if(d&&d.full_name) out.push("GitHub repo "+d.full_name+": "+(d.description||"no description")+" | stars "+d.stargazers_count+", forks "+d.forks_count+", open issues "+d.open_issues_count+", language "+d.language+", last push "+d.pushed_at+(Array.isArray(i)&&i.length?"\nOpen issues/PRs:\n"+i.map(x=>"#"+x.number+" "+x.title).join("\n"):"")); }
    }
    if(S.plug.includes("binance")&&/price|rate|value|kitna|chart|market|trade|bhav/i.test(t)){
        const seen=new Set();
        for(const m of t.matchAll(/\b(BTC|ETH|BNB|SOL|XRP|DOGE|ADA|DOT|LTC|TRX|SHIB|AVAX|LINK)\b/gi)){
            const s=m[1].toUpperCase(); if(seen.has(s)) continue; seen.add(s);
            const d=await f("https://data-api.binance.vision/api/v3/ticker/24hr?symbol="+s+"USDT");
            if(d&&d.lastPrice) out.push("Binance "+s+"/USDT: last "+d.lastPrice+", 24h change "+d.priceChangePercent+"%, high "+d.highPrice+", low "+d.lowPrice);
        }
    }
    return out.join("\n\n");
}

    const bubble=msg&&msg.querySelector(".bubble"); if(!bubble) return;
    const full=m.text;
    bubble.replaceChildren(...renderMarkdown(full).childNodes);
    const units=[];
    const walk=node=>{
        for(const ch of Array.from(node.childNodes)){
            if(ch.nodeType===3){
                if(!/\S/.test(ch.nodeValue)) continue;
                const f=document.createDocumentFragment();
                ch.nodeValue.split(/(\s+)/).forEach(tok=>{
                    if(!tok) return;
                    if(/^\s+$/.test(tok)){ f.appendChild(document.createTextNode(tok)); return; }
                    const s=document.createElement("span"); s.className="w"; s.textContent=tok; f.appendChild(s); units.push(s);
                });
                node.replaceChild(f,ch);
            }else if(ch.nodeType===1){
                const t=ch.tagName;
                if(t==="PRE"||t==="IMG"||t==="svg"||t==="SVG"){ ch.classList.add("w","blk"); units.push(ch); }
                else if(t!=="SCRIPT"&&t!=="STYLE") walk(ch);
            }
        }
    };
    walk(bubble);
    if(!units.length) return;
    void bubble.offsetHeight;                       /* flush styles so the first words transition too */
    const N=units.length, total=Math.min(6500,Math.max(1100,N*34)), t0=performance.now();
    let shown=0, follow=chatScroll.scrollHeight-chatScroll.scrollTop-chatScroll.clientHeight<260, lastTop=chatScroll.scrollTop;
    const tick=now=>{
        if(!bubble.isConnected) return;
        const k=Math.min(N,Math.ceil((now-t0)/total*N));
        while(shown<k) units[shown++].classList.add("on");
        if(follow){
            if(chatScroll.scrollTop<lastTop-60) follow=false;         /* user scrolled up: stop following */
            else{
                const r=units[Math.max(0,shown-1)].getBoundingClientRect(), v=chatScroll.getBoundingClientRect(), over=r.bottom-(v.bottom-110);
                if(over>0) chatScroll.scrollTop+=over;
                lastTop=chatScroll.scrollTop;
            }
        }
        if(shown<N) requestAnimationFrame(tick);
        else setTimeout(()=>{ if(bubble.isConnected) bubble.replaceChildren(...renderMarkdown(full).childNodes); },700);
    };
    requestAnimationFrame(tick);
}

/* Hands-free voice mode with a Copilot-style popup: listen -> send -> read reply aloud -> listen again */
let voice=false, silent=0;
let vp=null, vpMuted=false, vpLvl=0, vpTgt=0, vpRaf=0;
const VPI={
    mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
    off:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M9 9v2a3 3 0 005.1 2.1M15 9.3V6a3 3 0 00-5.7-1.3M5 11a7 7 0 0011.2 5.6M19 11a7 7 0 01-.7 3M12 18v3"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const VPS={ listen:"Listening…", think:"Thinking…", speak:"Speaking…", mute:"Mic is off" };
function vpOpen(){
    if(vp) return;
    vpMuted=false; vpLvl=0; vpTgt=0;
    vp=document.createElement("div"); vp.className="vp"; vp.dataset.s="listen";
    vp.setAttribute("role","dialog"); vp.setAttribute("aria-label","Voice conversation");
    vp.innerHTML='<div class="vp-top"><span class="vp-dot"></span><span class="vp-title">DeepSINKY Voice</span></div>'+
        '<div class="vp-mid"><button type="button" class="vp-orb" aria-label="Interrupt"><i class="vp-glow"></i><i class="vp-ring"></i><i class="vp-ring"></i><i class="vp-ring"></i><span class="vp-breath"><span class="vp-core"></span></span></button>'+
        '<div class="vp-status">Listening…</div><div class="vp-cap">Go ahead, I\'m listening</div></div>'+
        '<div class="vp-ctrl"><button type="button" class="vp-btn vp-mute" aria-label="Mute microphone">'+VPI.mic+'</button><button type="button" class="vp-btn vp-end" aria-label="End voice conversation">'+VPI.x+'</button></div>';
    document.body.appendChild(vp);
    vp.querySelector(".vp-end").onclick=()=>stopVoice();
    vp.querySelector(".vp-mute").onclick=vpToggleMute;
    vp.querySelector(".vp-orb").onclick=()=>{ if(window.speechSynthesis&&speechSynthesis.speaking) speechSynthesis.cancel(); };
    document.addEventListener("keydown",vpKey);
    const tick=()=>{ if(!vp) return; vpTgt*=.9; vpLvl+=(vpTgt-vpLvl)*.35; vp.style.setProperty("--lvl",vpLvl.toFixed(3)); vpRaf=requestAnimationFrame(tick); };
    vpRaf=requestAnimationFrame(tick);
}
function vpKey(e){ if(e.key==="Escape") stopVoice(); }
function vpClose(){
    document.removeEventListener("keydown",vpKey);
    if(!vp) return;
    const el=vp; vp=null; cancelAnimationFrame(vpRaf);
    el.classList.add("out"); setTimeout(()=>el.remove(),340);
}
function vpState(s,cap){
    if(!vp) return;
    vp.dataset.s=s;
    const st=vp.querySelector(".vp-status"); if(st.textContent!==VPS[s]) st.textContent=VPS[s];
    if(cap!==undefined) vpCap(cap,true);
}
function vpCap(t,anim){
    if(!vp) return;
    const c=vp.querySelector(".vp-cap"); if(c.textContent===t) return;
    c.textContent=t;
    if(anim){ c.classList.remove("sw"); void c.offsetWidth; c.classList.add("sw"); }
}
function vpBump(v){ vpTgt=Math.max(vpTgt,v); }
function vpToggleMute(){
    if(!vp) return;
    vpMuted=!vpMuted;
    vp.classList.toggle("muted",vpMuted);
    vp.querySelector(".vp-mute").innerHTML=vpMuted?VPI.off:VPI.mic;
    if(vpMuted){
        try{ if(rec&&listening) rec.stop(); }catch(e){}
        if(vp.dataset.s==="listen") vpState("mute","Tap the mic to talk again");
    }else{
        silent=0;
        if(!generating&&!(window.speechSynthesis&&speechSynthesis.speaking)){ vpState("listen","Go ahead, I'm listening"); listenOnce(); }
    }
}
function startVoice(){
    if(!SpeechRec){ showToast("Voice isn't supported in this browser"); return; }
    voice=true; silent=0; updateSendBtn(); vpOpen(); listenOnce();
}
function stopVoice(){
    voice=false;
    try{ if(rec&&listening) rec.stop(); }catch(e){}
    if(window.speechSynthesis) speechSynthesis.cancel();
    vpClose(); updateSendBtn();
}
function listenOnce(){
    if(!voice||listening||generating||vpMuted) return;
    promptInput.value=""; promptInput.dispatchEvent(new Event("input"));
    vpState("listen","Go ahead, I'm listening");
    toggleMic();
    const r=rec; if(!r) return;
    const prevRes=r.onresult, prevErr=r.onerror, prev=r.onend;
    r.onresult=(e)=>{ prevRes&&prevRes(e); vpBump(.8); if(promptInput.value) vpCap(promptInput.value,false); };
    r.onspeechstart=()=>vpBump(.95);
    r.onerror=(e)=>{ prevErr&&prevErr(e); if(e&&(e.error==="not-allowed"||e.error==="service-not-allowed")) stopVoice(); };
    r.onend=()=>{
        prev&&prev();
        if(!voice||vpMuted) return;
        const t=promptInput.value.trim();
        if(t){ silent=0; vpState("think",t); handleSend(); }
        else if(++silent>=3){ silent=0; vpMuted=true; if(vp){ vp.classList.add("muted"); vp.querySelector(".vp-mute").innerHTML=VPI.off; } vpState("mute","Didn't hear anything. Tap the mic to talk again."); }
        else if(!generating) setTimeout(listenOnce,500);
    };
}
function speakThenListen(text){
    const t=(renderMarkdown(text).textContent||"").slice(0,1800);
    vpState("speak",t.length>200?t.slice(0,200)+"…":t);
    if(!window.speechSynthesis){ setTimeout(listenOnce,Math.min(7000,1500+t.length*35)); return; }
    const u=new SpeechSynthesisUtterance(t);
    u.lang=/[\u0900-\u097F]/.test(t)?"hi-IN":(navigator.language||"en-US");
    u.onboundary=(e)=>{ vpBump(.55+Math.random()*.4); if(vp&&e&&e.charIndex!=null){ const i=e.charIndex; vpCap((i>40?"…":"")+t.slice(Math.max(0,i-40),i+150)+(i+150<t.length?"…":""),false); } };
    u.onend=u.onerror=()=>{
        if(!voice) return;
        if(vpMuted){ vpState("mute","Tap the mic to talk again"); return; }
        vpState("listen","Go ahead, I'm listening"); setTimeout(listenOnce,300);
    };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ===== LONG TEXT / FILES AS PDF DOCUMENT CARDS (Claude style) ===== */
/* Function declarations only: they are hoisted, so earlier code can call them. */
function isDoc(a){ return a.kind!=="image" && !!a.text && (a.kind==="paste" || a.kind==="web" || a.text.length>1500); }
function docPages(a){ return Math.max(1,Math.ceil((a.words||0)/450)); }
function fileIcon(a){ return isDoc(a) ? '<i class="pdf-ic">PDF</i>' : FILE_SVG; }
function pasteTitle(t){ const l=(String(t).trim().split("\n")[0]||"").replace(/\s+/g," ").slice(0,38); return l||"Pasted text"; }
function docTitle(a){ return String(a.name||"Document").replace(/\.[a-z0-9]{2,5}$/i,"").replace(/[^\p{L}\p{N}\-_ ]+/gu,"").trim().slice(0,40)||"Document"; }

/* Real PDF download. Text is drawn on a canvas page by page, so Hindi and every other script renders correctly. */
async function makePdf(a){
    try{
        showToast("Creating PDF…");
        await load(CDN+"jspdf/2.5.1/jspdf.umd.min.js");
        const S=2, PW=595, PH=842, cvW=PW*S, cvH=PH*S, margin=48*S, cw=cvW-2*margin, lh=16*S, MAXP=150;
        const FF='system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari",sans-serif';
        const cv=document.createElement("canvas"); cv.width=cvW; cv.height=cvH;
        const x=cv.getContext("2d"); x.textBaseline="top"; x.font=(11*S)+"px "+FF;
        const wide=w=>x.measureText(w).width, lines=[];
        const chop=w=>{ const o=[]; let cur=""; for(const ch of w){ if(cur&&wide(cur+ch)>cw){ o.push(cur); cur=ch; } else cur+=ch; } if(cur) o.push(cur); return o; };
        for(const para of String(a.text).replace(/\r/g,"").replace(/\t/g,"    ").split("\n")){
            if(!para.trim()){ lines.push(""); continue; }
            let cur="";
            for(const w of (para.match(/\S+\s*|\s+/g)||[])){
                if(wide(cur+w)<=cw){ cur+=w; continue; }
                if(cur){ lines.push(cur.trimEnd()); cur=""; }
                if(wide(w)<=cw) cur=w; else { const p=chop(w); cur=p.pop()||""; lines.push(...p); }
            }
            lines.push(cur.trimEnd());
        }
        const { jsPDF }=window.jspdf, doc=new jsPDF({unit:"pt",format:"a4",compress:true}), title=docTitle(a);
        let i=0, page=0;
        while(i<lines.length && page<MAXP){
            x.fillStyle="#fff"; x.fillRect(0,0,cvW,cvH); x.fillStyle="#111"; let y=margin;
            if(page===0){ x.font="bold "+(16*S)+"px "+FF; x.fillText(title,margin,y,cw); y+=lh*2; }
            x.font=(11*S)+"px "+FF;
            while(i<lines.length && y+lh<=cvH-margin){ x.fillText(lines[i],margin,y); y+=lh; i++; }
            x.fillStyle="#888"; x.font=(9*S)+"px "+FF; x.fillText("DeepSINKY  ·  page "+(page+1),margin,cvH-margin+14*S);
            if(page>0) doc.addPage();
            doc.addImage(cv.toDataURL("image/jpeg",.82),"JPEG",0,0,PW,PH);
            page++; await new Promise(r=>setTimeout(r,0));
        }
        if(i<lines.length) showToast("Very long text: first "+MAXP+" pages saved");
        doc.save(title+".pdf");
    }catch(e){ showToast("Couldn't create the PDF. Check your internet and try again."); }
}

    }
    render();
    tabsEl.addEventListener("click", (e) => { const b = e.target.closest("[data-t]"); if (b) { tab = b.dataset.t; render(); L.body.scrollTo({ top: 0 }); } });
    grid.addEventListener("click", (e) => {
      const b = e.target.closest("[data-k]"); if (!b) return; const i = +b.dataset.i;
      if (b.dataset.k === "m") return showResult(list[i], false);
      const x = (b.dataset.k === "s" ? STYLES : TEMPLATES)[i];
      style = x.style || x.id; selS.value = style; ta.value = x.p; sync(); ta.focus();
      D.showToast(x.name + " selected — edit the prompt or tap send");
    });
    const sync = () => { go.disabled = !ta.value.trim(); ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 130) + "px"; };
    ta.addEventListener("input", sync);
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go.click(); } });
    selS.onchange = () => { style = selS.value; };
    selR.onchange = () => { ratio = selR.value; };
    go.onclick = () => { const p = ta.value.trim(); if (p) generate(p, style, ratio); };

    function generate(prompt, st, rt) {
      const it = { id: Date.now().toString(36), prompt, style: st, ratio: rt, seed: Math.floor(Math.random() * 1e9) };
      it.url = mkUrl(it); showResult(it, true);
    }
    function showResult(it, isNew) {
      res && res.remove();
      res = document.createElement("div"); res.className = "is-res";
      res.innerHTML = '<button class="is-x" type="button" aria-label="Close">✕</button><div class="is-stage"><div class="is-spin"></div><img alt=""></div>' +
        '<p class="is-cap"></p><div class="is-btns"><button type="button" data-a="dl">Download</button><button type="button" data-a="re">Regenerate</button><button type="button" data-a="del">Delete</button></div>';
      L.pg.appendChild(res);
      const img = res.querySelector("img"), spin = res.querySelector(".is-spin"), cap = res.querySelector(".is-cap");
      cap.textContent = it.prompt;
      img.onload = () => {
        spin.remove(); img.classList.add("ok");
        if (isNew && !list.some(x => x.id === it.id)) { list.unshift(it); list = list.slice(0, 40); save(list); if (tab === "mine") render(); }
      };
      img.onerror = () => { spin.remove(); cap.textContent = "Couldn't create the image. Check your connection and try Regenerate."; cap.classList.add("bad"); };
      img.src = it.url;
      res.onclick = async (e) => {
        if (e.target.closest(".is-x")) { res.remove(); res = null; return; }
        const a = e.target.closest("[data-a]"); if (!a) return;
        if (a.dataset.a === "re") { generate(it.prompt, it.style, it.ratio); }
        if (a.dataset.a === "del") { list = list.filter(x => x.id !== it.id); save(list); res.remove(); res = null; render(); }
        if (a.dataset.a === "dl") {
          try {
            const b = await (await fetch(it.url)).blob(), u = URL.createObjectURL(b), l = document.createElement("a");
            l.href = u; l.download = "deepsinky-" + it.id + ".jpg"; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000);
          } catch (x) { window.open(it.url, "_blank", "noopener"); }
        }
      };
    }
  }
  window.DSImages = { open };
})();
</script>


<script>
/* ===== INSTALL AS APP ===== */
(function(){
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
  var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  var KEY = "deepsinky_install_dismissed", dismissed = false;
  try { dismissed = Date.now() - (+localStorage.getItem(KEY) || 0) < 7 * 864e5; } catch(e){}
  var deferred = null, pill = null;
  function hide(){ if (pill){ pill.remove(); pill = null; } }
  addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred = e;
    if (standalone || dismissed || pill) return;
    pill = document.createElement("div"); pill.className = "install-pill";
    pill.innerHTML = '<span>Install DeepSINKY app</span><button type="button" data-i>Install</button><button type="button" class="x" data-x aria-label="Close">✕</button>';
    pill.addEventListener("click", function(ev){
      if (ev.target.closest("[data-x]")){ try { localStorage.setItem(KEY, Date.now()); } catch(e){} hide(); }
      if (ev.target.closest("[data-i]") && deferred){ deferred.prompt(); deferred.userChoice.finally(function(){ deferred = null; hide(); }); }
    });
    document.body.appendChild(pill);
  });
  addEventListener("appinstalled", function(){ hide(); });
})();
</script>
<script>
/* ===== COPILOT-STYLE EXTRAS: your name, time greeting, Auto/Quick/Deeper, bottom nav, Learn sheet ===== */
(function(){
  "use strict";
  var $=function(s){return document.querySelector(s);};
  var LS={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
  var MODES={auto:["Auto","Decides how long to think"],quick:["Quick response","Answers right away"],deep:["Think deeper","Think longer for better answers"]};
  var mode=LS.get("deepsinky_mode"); if(!MODES[mode]) mode="auto";
  window.DS_MODE=mode;
  window.DS_MODE_PROMPT=function(){
    return mode==="quick" ? "Mode: QUICK RESPONSE. Answer right away: short, direct, no long preamble."
         : mode==="deep"  ? "Mode: THINK DEEPER. Reason step by step, double-check your work and give a thorough, well-structured answer."
         : "";
  };
  window.DS_THINK0=function(){ return mode==="quick"?"Answering":mode==="deep"?"Thinking deeper":"Thinking"; };

  /* ---- name ---- */
  function first(s){ return String(s||"").trim().split(/\s+/)[0].slice(0,24); }
  function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1).toLowerCase() : ""; }
  function getName(){ return cap(first((window.DS_USER&&window.DS_USER.name)||LS.get("deepsinky_name")||"")); }
  function part(d){ var h=(d||new Date()).getHours(); return h>=5&&h<12?"Good morning":h>=12&&h<17?"Good afternoon":h>=17&&h<21?"Good evening":"Good night"; }
  var SUBS=["How's it going?","What's on your mind?","How can I help today?","What shall we create today?"], SUB=SUBS[new Date().getDate()%SUBS.length];

  function refresh(){
    var n=getName(); window.DS_NAME=n;
    var h1=$("#greetH1"); if(h1) h1.textContent=part()+(n?", "+n:"");
    if(h1){ var s=$(".greet-sub"); if(!s){ s=document.createElement("p"); s.className="greet-sub"; h1.after(s); } s.textContent=SUB; }
    var av=$("#accountBtn span"); if(av&&n) av.textContent=n.charAt(0).toUpperCase();
    var ml=$("#modeLabel"); if(ml) ml.textContent=MODES[mode][0];
  }

  /* ---- popup that says your name ---- */
  var popT;
  function pop(text){
    var n=getName(), el=$(".name-pop");
    if(!el){ el=document.createElement("div"); el.className="name-pop"; document.body.appendChild(el); }
    el.innerHTML="<i>"+(n?esc(n.charAt(0).toUpperCase()):"✦")+"</i><span>"+esc(text)+(n?", <b>"+esc(n)+"</b>":"")+"</span>";
    el.classList.remove("in","out"); void el.offsetWidth; el.classList.add("in");
    clearTimeout(popT); popT=setTimeout(function(){ el.classList.add("out"); setTimeout(function(){ el.remove(); },340); },2600);
  }

  /* ---- ask the name once (when there is no login yet) ---- */
  function askName(){
    if($(".nm-back")) return;
    var b=document.createElement("div"); b.className="nm-back";
    b.innerHTML='<div class="nm-card" role="dialog" aria-modal="true"><h2>Welcome to DeepSINKY</h2><p>What should we call you?</p><input type="text" maxlength="30" placeholder="Your name" autocomplete="given-name"><button class="nm-go" type="button">Continue</button><button class="nm-skip" type="button">Skip for now</button></div>';
    document.body.appendChild(b);
    var inp=b.querySelector("input"); setTimeout(function(){ inp.focus(); },250);
    function done(save){
      var v=inp.value.trim();
      if(save&&v.length<1){ inp.focus(); return; }
      if(save) LS.set("deepsinky_name",v); else LS.set("deepsinky_name_skip","1");
      b.remove(); refresh(); if(save) pop("Nice to meet you");
    }
    b.querySelector(".nm-go").onclick=function(){ done(true); };
    b.querySelector(".nm-skip").onclick=function(){ done(false); };
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") done(true); });
  }

  /* ---- Auto / Quick / Think deeper menu ---- */
  function closeMenu(){ var m=$(".mode-menu"); if(m) m.remove(); var b=$("#modeBtn"); if(b) b.setAttribute("aria-expanded","false"); }
  function openMenu(){
    if($(".mode-menu")){ closeMenu(); return; }
    var btn=$("#modeBtn"), m=document.createElement("div"); m.className="mode-menu"; m.setAttribute("role","menu");
    var foot = window.DS_USER ? '<div class="mm-foot"><span>Signed in as <b>'+esc(getName())+'</b></span>'+(window.DS_LOGOUT?'<button type="button" data-out>Log out</button>':'')+'</div>'
             : '<div class="mm-foot"><span>'+(getName()?"Hi "+esc(getName()):"No name set")+'</span><button type="button" data-name>'+(getName()?"Change name":"Add name")+'</button></div>';
    m.innerHTML=Object.keys(MODES).map(function(k){ return '<button type="button" role="menuitemradio" data-m="'+k+'"><span class="ck">'+(k===mode?"✓":"")+'</span><span><b>'+MODES[k][0]+'</b><small>'+MODES[k][1]+'</small></span></button>'; }).join("")+foot;
    document.body.appendChild(m);
    var r=btn.getBoundingClientRect(), w=Math.min(300,innerWidth-24); m.style.width=w+"px";
    m.style.top=(r.bottom+8)+"px"; m.style.left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2))+"px";
    btn.setAttribute("aria-expanded","true");
    m.addEventListener("click",function(e){
      var o=e.target.closest("[data-m]");
      if(o){ mode=o.dataset.m; window.DS_MODE=mode; LS.set("deepsinky_mode",mode); refresh(); closeMenu(); pop(MODES[mode][0]+" is on"); return; }
      if(e.target.closest("[data-name]")){ closeMenu(); LS.set("deepsinky_name_skip",""); askName(); }
      if(e.target.closest("[data-out]")){ closeMenu(); window.DS_LOGOUT&&window.DS_LOGOUT(); }
    });
    setTimeout(function(){ document.addEventListener("pointerdown",function off(ev){ if(!ev.target.closest(".mode-menu,#modeBtn")){ closeMenu(); document.removeEventListener("pointerdown",off); } }); },0);
  }
  $("#modeBtn").addEventListener("click",openMenu);

  /* ---- Learn sheet ---- */
  var LEARN=[["Explain simply","Explain this to me like I'm new to it: "],["Quiz me","Quiz me with 5 questions on: "],["Make a study plan","Make me a 7-day study plan for: "],["Summarize my notes","Summarize these notes into key points: "],["Practice problems","Give me practice problems with solutions on: "],["Learn a language","Teach me a few useful phrases in: "]];
  function openLearn(){
    if($(".ls-back")) return;
    var b=document.createElement("div"); b.className="ls-back";
    b.innerHTML='<div class="ls-sheet" role="dialog" aria-label="Learn"><h3>Learn</h3>'+LEARN.map(function(x,i){ return '<button type="button" data-i="'+i+'">'+x[0]+'</button>'; }).join("")+'</div>';
    document.body.appendChild(b);
    b.addEventListener("click",function(e){
      var o=e.target.closest("[data-i]");
      if(o){ var t=$("#promptInput"); t.value=LEARN[+o.dataset.i][1]; t.dispatchEvent(new Event("input")); b.remove(); t.focus(); }
      else if(e.target===b) b.remove();
    });
  }

  /* ---- bottom nav ---- */
  var click=function(sel){ var el=$(sel); if(el) el.click(); };
  $("#bnNew").addEventListener("click",function(){ click("#newChatBtn"); });
  $("#bnLib").addEventListener("click",function(){ click('.nav-item[data-panel="library"]'); });
  $("#bnLearn").addEventListener("click",openLearn);
  $("#bnSearch").addEventListener("click",function(){
    click("#openSidebarBtn");
    setTimeout(function(){ var b=$("#searchBox"); if(b&&b.hidden) click("#searchToggle"); var i=$("#searchInput"); if(i) i.focus(); },330);
  });
  $("#bnChat").addEventListener("click",function(){ var s=$("#chatScroll"); if(s) s.scrollTo({top:s.scrollHeight,behavior:"smooth"}); });

  /* ---- every movement says your name ---- */
  ["#newChatBtn","#headerNewBtn","#bnNew"].forEach(function(s){ var el=$(s); el&&el.addEventListener("click",function(){ setTimeout(function(){ pop("New chat ready"); refresh(); },60); }); });
  var tt=$("#themeToggle"); tt&&tt.addEventListener("click",function(){ setTimeout(function(){ pop("Theme changed"); },60); });
  var send=$("#sendBtn"); send&&send.addEventListener("click",function(){ if(!send.disabled && $("#promptInput").value.trim()) pop("Sent"); });

  /* ---- start ---- */
  refresh();
  setInterval(refresh,60000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) refresh(); });
  function welcomeOnce(){
    var seen=false; try{ seen=sessionStorage.getItem("ds_welcomed"); sessionStorage.setItem("ds_welcomed","1"); }catch(e){}
    if(!seen) setTimeout(function(){ pop(getName()?"Welcome back":part()); },700);
  }
  if(!getName() && !LS.get("deepsinky_name_skip")) setTimeout(askName,500); else welcomeOnce();
  /* when a real login exists on the same server, use that name automatically */
  if(/^https?:$/.test(location.protocol)){
    var ac=new AbortController(); setTimeout(function(){ ac.abort(); },2500);
    fetch("/api/me",{credentials:"same-origin",signal:ac.signal}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
      if(d&&d.user&&d.user.name){
        window.DS_USER=d.user;
        window.DS_LOGOUT=window.DS_LOGOUT||function(){ return fetch("/api/auth/logout",{method:"POST",credentials:"same-origin"}).then(function(){ location.replace("/login.html"); }); };
        var had=!!LS.get("deepsinky_name"); refresh(); if(!had){ var nb=$(".nm-back"); if(nb) nb.remove(); welcomeOnce(); }
      }
    }).catch(function(){});
  }
})();
</script>
