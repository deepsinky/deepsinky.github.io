 }

}

/* 🔥 GPT STYLE OPEN */
.plus-menu.active{
  display: block;
  opacity: 1;

  transform: translateX(-50%) translateY(0) scale(1);

  animation: popupBounce 0.35s ease;
}

/* 🔥 BOUNCE KEYFRAMES */
@keyframes popupBounce{
  0%{
    transform: translateX(-50%) translateY(40px) scale(0.9);
    opacity:0;
  }
  60%{
    transform: translateX(-50%) translateY(-5px) scale(1.03);
  }
  100%{
    transform: translateX(-50%) translateY(0) scale(1);
    opacity:1;
  }
}

}

}

/* LOADING */

  /* ===== DIVIDER LINE ===== */
.section-divider {

<script>

/* CORE */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const plusBtn = document.querySelector(".icon-btn:first-child");
const menu = document.getElementById("plusMenu");
const overlay = document.getElementById("overlay");

// 📷 Camera
document.querySelector(".menu-item:nth-child(1)").onclick = () => {
  document.getElementById("cameraInput").click();
};

// 🖼️ Photos
document.querySelector(".menu-item:nth-child(2)").onclick = () => {
  document.getElementById("photoInput").click();
};

// 📎 Files
document.querySelector(".menu-item:nth-child(3)").onclick = () => {
  document.getElementById("fileInput").click();
};
plusBtn.onclick = () => {
  menu.classList.toggle("active");
  overlay.classList.toggle("active");
};

// 🔥 outside click close
overlay.onclick = () => {
  menu.classList.remove("active");
  overlay.classList.remove("active");
};
sendBtn.onclick = send;

input.addEventListener("keypress", e=>{
  if(e.key === "Enter") send();
});

/* SEND */
let selectedFile = null;

document.getElementById("cameraInput").onchange = (e) => {
  selectedFile = e.target.files[0];
};

document.getElementById("photoInput").onchange = (e) => {
  selectedFile = e.target.files[0];
};

document.getElementById("fileInput").onchange = (e) => {
  selectedFile = e.target.files[0];
};

async function send(){

  let text = input.value.trim();

  if(!text && !selectedFile) return;

  // text
  if(text){
    chat.innerHTML += `<div class="message user">${text}</div>`;
  }

  // file
  if(selectedFile){
    let url = URL.createObjectURL(selectedFile);

    if(selectedFile.type.startsWith("image")){
      chat.innerHTML += `
        <div class="message user">
          <img src="${url}" style="max-width:150px;border-radius:10px;">
        </div>
      `;
    }else{
      chat.innerHTML += `
        <div class="message user">
          📎 ${selectedFile.name}
        </div>
      `;
    }

    selectedFile = null;
  }

  input.value = "";

  // 🔥 YEH ANDAR HI RAHEGA
  let loading = document.createElement("div");
  loading.className = "bot-text loading";
  loading.innerHTML = `
    <div class="dot">
      <span></span>
      <span></span>
    </div>
  `;
  chat.appendChild(loading);

  try{
    let res = await fetch("https://deepsinky-server-1.onrender.com/chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ message:text })
    });

    let data = await res.json();
    loading.remove();

    streamText(data.reply || "No response");

  }catch{
    loading.innerText = "Error ❌";
  }
}
  function getEmoji(text){
  text = text.toLowerCase();

  const emojiMap = [
    // 🧠 Tech / AI
    { keywords: ["ai","artificial intelligence","ml","neural","brain"], emoji: "🧠", priority: 5 },
    { keywords: ["code","coding","program","function","developer"], emoji: "💻", priority: 5 },
    { keywords: ["robot","bot","automation"], emoji: "🤖", priority: 4 },

    // 💰 Business
    { keywords: ["money","earn","income","profit","cash"], emoji: "💰", priority: 5 },
    { keywords: ["business","startup","company"], emoji: "🏢", priority: 4 },
    { keywords: ["success","growth","win"], emoji: "📈", priority: 3 },

    // ❤️ Emotion
    { keywords: ["love","heart"], emoji: "❤️", priority: 5 },
    { keywords: ["happy","smile","joy"], emoji: "😊", priority: 4 },
    { keywords: ["sad","cry","depressed"], emoji: "😢", priority: 4 },
    { keywords: ["angry","mad"], emoji: "😡", priority: 4 },

    // ⚠️ Alerts
    { keywords: ["warning","alert","danger"], emoji: "⚠️", priority: 6 },
    { keywords: ["error","fail","wrong"], emoji: "❌", priority: 6 },
    { keywords: ["success","done","complete"], emoji: "✅", priority: 6 },

    // 🎯 Productivity
    { keywords: ["goal","target","aim"], emoji: "🎯", priority: 4 },
    { keywords: ["time","deadline","clock"], emoji: "⏰", priority: 4 },
    { keywords: ["fast","speed","quick"], emoji: "⚡", priority: 3 },

    // 📚 Study
    { keywords: ["study","learn","education","book"], emoji: "📚", priority: 5 },
    { keywords: ["exam","test"], emoji: "📝", priority: 5 },

    // 💊 Health
    { keywords: ["health","doctor","medicine","ill","pain"], emoji: "💊", priority: 6 },
    { keywords: ["gym","fitness","workout"], emoji: "🏋️", priority: 4 },

    // 🎮 Fun
    { keywords: ["game","play"], emoji: "🎮", priority: 3 },
    { keywords: ["music","song"], emoji: "🎵", priority: 3 },
    { keywords: ["party","fun","dance"], emoji: "🎉", priority: 3 },

    // 💡 Idea
    { keywords: ["idea","tip","suggest"], emoji: "💡", priority: 5 },

    // 🔥 Default cool
    { keywords: ["awesome","fire","lit"], emoji: "🔥", priority: 2 }
  ];

  let bestMatch = null;

  for (let item of emojiMap){
    for (let word of item.keywords){
      if(text.includes(word)){
        if(!bestMatch || item.priority > bestMatch.priority){
          bestMatch = item;
        }
      }
    }
  }

  return bestMatch ? bestMatch.emoji : "👉";
           }
  function getHeadingEmoji(text){
  text = text.toLowerCase();

  if(text.includes("ai")) return "🧠";
  if(text.includes("money")) return "💰";
  if(text.includes("health")) return "💊";
  if(text.includes("study")) return "📚";
  if(text.includes("warning")) return "⚠️";

  return "🔥";
  }
  function formatText(text){

  
  // ===== HEADINGS (EMOJI VERSION) =====
text = text.replace(/^### (.*$)/gm, (match, title)=>{
  return `<h3>${getHeadingEmoji(title)} ${title}</h3>`;
});

text = text.replace(/^## (.*$)/gm, (match, title)=>{
  return `<h2>${getHeadingEmoji(title)} ${title}</h2>`;
});

text = text.replace(/^# (.*$)/gm, (match, title)=>{
  return `<h1>${getHeadingEmoji(title)} ${title}</h1>`;
});
  // ===== BOLD =====
  text = text.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");

  // ===== INLINE CODE =====
  text = text.replace(/`(.*?)`/g, "<code>$1</code>");

  // ===== CODE BLOCK =====
  text = text.replace(/```([\s\S]*?)```/g, (m, code)=>{
    return `<pre><code>${code}</code></pre>`;
  });

  // ===== TABLE =====
  if(text.includes("|")){
    
let lines = text.split("\n");
let formatted = "";
let inList = false;

lines.forEach(line=>{
  if(line.startsWith("• ") || line.startsWith("- ")){
    if(!inList){
      formatted += "<ul>";
      inList = true;
    }
    let item = line.replace(/^[-•]\s/, "");
    formatted += `<li>${getBulletEmoji(item)} ${item}</li>`;
  } else {
    if(inList){
      formatted += "</ul>";
      inList = false;
    }
    formatted += line + "<br>";
  }
});

if(inList) formatted += "</ul>";

text = formatted;
  // ===== BULLETS =====
  text = text.replace(/• (.*)/g, "<li>$1</li>");
  text = text.replace(/(<li>.*<\/li>)/g, "<ul>$1</ul>");

  // ===== NUMBERED LIST =====
  text = text.replace(/^\d+\.\s(.*)/gm, "<li>$1</li>");

  // ===== LINE BREAK =====
  text = text.replace(/\n/g, "<br>");

  return text;
  }
/* STREAM */
function streamText(text){

  let div = document.createElement("div");
  div.className = "message bot";
  chat.appendChild(div);

  let i = 0;

  function type(){

    if(i < text.length){

      // 🔥 character based (emoji safe)
      let currentText = text.substring(0, i+1);

      div.innerHTML = formatText(currentText);

      i++;
      chat.scrollTop = chat.scrollHeight;

      setTimeout(type, 10);

    }else{

      // ✅ FINAL clean render
      div.innerHTML = formatText(text);

      // ✅ COPY BUTTON
      addCopyButtons();
      hljs.highlightAll();
    }

  }

  type();
}
/* SIDEBAR */
function toggleSidebar(){
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
}

/* VOICE */
function voiceInput(){
  let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.start();
  rec.onresult = e=>{
    input.value = e.results[0][0].transcript;
  }
}

</script>
