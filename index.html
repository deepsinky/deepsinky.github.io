<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>DeepSINKY — Think. Create. Research. Build.</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/* ==========================================================
   DEEPSINKY — DESIGN TOKENS
========================================================== */
:root{
    color-scheme: dark;
    --bg:#0a0d14;
    --bg-elevated:#10141d;
    --surface:#141924;
    --surface-hover:#1b2230;
    --border:#232b3a;
    --border-soft:#1a212e;

    --text:#f2f4f8;
    --text-secondary:#a8b1c4;
    --text-muted:#616d84;

    --accent-a:#3b82f6;
    --accent-b:#60a5fa;
    --accent-grad:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    --accent-soft:rgba(59,130,246,.14);

    --danger:#f0616f;
    --success:#3ecf8e;

    --radius-s:10px;
    --radius-m:16px;
    --radius-l:22px;
    --radius-pill:999px;

    --header-h:64px;
    --sidebar-w:280px;

    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 8px 24px rgba(0,0,0,.35);
    --shadow-glow:0 0 0 1px rgba(59,130,246,.25), 0 8px 30px rgba(59,130,246,.18);

    --ease:cubic-bezier(.22,1,.36,1);
}

html[data-theme="light"]{
    color-scheme: light;
    --bg:#f7f7fb;
    --bg-elevated:#ffffff;
    --surface:#ffffff;
    --surface-hover:#f0f1f7;
    --border:#e6e7ef;
    --border-soft:#eef0f6;

    --text:#161821;
    --text-secondary:#565b6d;
    --text-muted:#8b90a0;

    --accent-soft:rgba(59,130,246,.09);
    --shadow-1:0 1px 2px rgba(20,20,40,.06);
    --shadow-2:0 12px 28px rgba(20,20,40,.09);
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
    height:100%;
    overscroll-behavior:none;
}

body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition:background .2s var(--ease),color .2s var(--ease);
}

button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
input,textarea{ font-family:inherit; border:none; outline:none; background:none; color:inherit; }
a{ color:var(--accent-b); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:999px; }
::-webkit-scrollbar-thumb:hover{ background:var(--accent-a); }

:focus-visible{ outline:2px solid var(--accent-a); outline-offset:2px; }

@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}



/* ==========================================================
   APP SHELL
========================================================== */
#app{
    position:relative;
    display:flex;
    width:100%;
    height:100dvh;
}

/* ---------- Sidebar ---------- */
.sidebar{
    position:fixed;
    inset:0 auto 0 0;
    width:var(--sidebar-w);
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg-elevated);
    border-right:1px solid var(--border-soft);
    z-index:60;
    transform:translateX(0);
    transition:transform .28s var(--ease);
}
.sidebar[data-open="false"]{ transform:translateX(-100%); }

.sidebar-top{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px;
    border-bottom:1px solid var(--border-soft);
}
.brand{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
}
.brand-mark{ width:30px; height:30px; flex-shrink:0; }
.brand-name{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:-.01em;
    white-space:nowrap;
}
.icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    transition:background .15s var(--ease), color .15s var(--ease);
    flex-shrink:0;
}
.icon-btn:hover{ background:var(--surface-hover); color:var(--text); }
.icon-btn svg{ width:18px; height:18px; }

.new-chat-btn{
    display:flex; align-items:center; gap:10px;
    margin:12px;
    padding:11px 14px;
    border-radius:var(--radius-m);
    background:var(--accent-grad);
    color:#fff;
    font-weight:600;
    font-size:.9rem;
    box-shadow:var(--shadow-1);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
}
.new-chat-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-glow); }
.new-chat-btn svg{ width:16px; height:16px; }

.sidebar-search{
    display:flex; align-items:center; gap:8px;
    margin:0 12px 10px;
    padding:9px 12px;
    border-radius:var(--radius-s);
    background:var(--surface);
    border:1px solid var(--border-soft);
}
.sidebar-search svg{ width:15px; height:15px; color:var(--text-muted); flex-shrink:0; }
.sidebar-search input{ flex:1; font-size:.85rem; color:var(--text); }
.sidebar-search input::placeholder{ color:var(--text-muted); }

.history{
    flex:1;
    overflow-y:auto;
    padding:4px 8px 8px;
    display:flex;
    flex-direction:column;
    gap:2px;
}
.history-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    padding:40px 20px;
    color:var(--text-muted);
    text-align:center;
    font-size:.83rem;
}
.history-item{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:10px 10px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    font-size:.85rem;
    text-align:left;
    transition:background .15s var(--ease), color .15s var(--ease);
    position:relative;
}
.history-item:hover{ background:var(--surface-hover); color:var(--text); }
.history-item[data-active="true"]{ background:var(--accent-soft); color:var(--text); }
.history-item span{
    flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.history-item .del{
    opacity:0; width:26px; height:26px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:7px;
}
.history-item:hover .del{ opacity:1; }
.history-item .del:hover{ background:rgba(240,97,111,.15); color:var(--danger); }
.history-item .del svg{ width:14px; height:14px; }

.sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    gap:8px;
}
.theme-toggle{
    display:flex; align-items:center; gap:10px;
    flex:1;
    padding:10px 12px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    font-size:.83rem;
    font-weight:600;
    transition:background .15s var(--ease);
}
.theme-toggle:hover{ background:var(--surface-hover); color:var(--text); }
.theme-toggle svg{ width:16px; height:16px; }


/* ---------- Overlay (mobile sidebar) ---------- */
.overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(2px);
    z-index:55;
    opacity:0; pointer-events:none;
    transition:opacity .25s var(--ease);
}
.overlay[data-active="true"]{ opacity:1; pointer-events:auto; }

/* ---------- Main ---------- */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100dvh;
    min-width:0;
    margin-left:var(--sidebar-w);
    transition:margin-left .28s var(--ease);
}
.main[data-full="true"]{ margin-left:0; }

.header{
    display:flex; align-items:center; gap:10px;
    height:var(--header-h);
    padding:0 16px;
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0;
}
.header .title{
    flex:1;
    font-weight:600;
    font-size:.92rem;
    color:var(--text-secondary);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.status-pill{
    display:flex; align-items:center; gap:6px;
    padding:5px 10px;
    border-radius:var(--radius-pill);
    background:var(--surface);
    border:1px solid var(--border-soft);
    font-size:.72rem;
    font-weight:600;
    color:var(--text-secondary);
    flex-shrink:0;
}
.status-dot{ width:6px; height:6px; border-radius:50%; background:var(--success); }
.status-dot[data-state="offline"]{ background:var(--text-muted); }
.status-dot[data-state="busy"]{ background:#f5b942; animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }

/* ---------- Chat area ---------- */
.chat-scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}
.chat-inner{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
    gap:22px;
}

/* ---------- Welcome ---------- */
.welcome{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
    min-height:calc(100dvh - var(--header-h) - 96px);
}
.welcome-mark{ width:58px; height:58px; margin-bottom:22px; }
.welcome h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(1.7rem,4.4vw,2.6rem);
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.15;
}
.welcome h1 em{
    font-style:normal;
    background:var(--accent-grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.welcome p{
    margin-top:12px;
    color:var(--text-secondary);
    font-size:.98rem;
}
.starters{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:34px;
    width:100%;
    max-width:560px;
}
.starter{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    padding:15px 16px;
    border-radius:var(--radius-m);
    background:var(--surface);
    border:1px solid var(--border-soft);
    text-align:left;
    transition:border-color .18s var(--ease), transform .18s var(--ease), background .18s var(--ease);
}
.starter:hover{ border-color:var(--accent-a); transform:translateY(-2px); background:var(--surface-hover); }
.starter strong{ font-size:.85rem; font-weight:600; }
.starter span{ font-size:.78rem; color:var(--text-muted); }
@media (max-width:520px){ .starters{ grid-template-columns:1fr; } }

/* ---------- Messages ---------- */
.msg{
    display:flex;
    gap:12px;
    align-items:flex-start;
    animation:msgIn .25s var(--ease);
}
@keyframes msgIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.msg.user{ flex-direction:row-reverse; }
.avatar{
    width:30px; height:30px; border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.7rem; font-weight:700;
}
.msg.user .avatar{ background:var(--surface-hover); color:var(--text-secondary); }
.msg.assistant .avatar{ background:var(--accent-grad); color:#fff; }

.bubble-col{
    display:flex; flex-direction:column; gap:6px;
    max-width:86%;
    min-width:0;
}
.msg.user .bubble-col{ align-items:flex-end; }

.bubble{
    padding:12px 15px;
    border-radius:var(--radius-m);
    font-size:.93rem;
    line-height:1.65;
    word-wrap:break-word;
}
.msg.user .bubble{
    background:var(--accent-grad);
    color:#fff;
    border-radius:var(--radius-m) var(--radius-m) 4px var(--radius-m);
}
.msg.assistant .bubble{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-m) var(--radius-m) var(--radius-m) 4px;
}
.bubble p{ margin:0 0 10px; }
.bubble p:last-child{ margin-bottom:0; }
.bubble pre{
    background:var(--bg);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-s);
    padding:12px 14px;
    overflow-x:auto;
    margin:10px 0;
    font-size:.8rem;
}
.bubble code{ font-family:"SF Mono",Consolas,monospace; }
.bubble :not(pre)>code{
    background:var(--bg);
    padding:2px 6px;
    border-radius:5px;
    font-size:.85em;
}
.bubble ul,.bubble ol{ margin:0 0 10px 20px; }
.bubble a{ text-decoration:underline; }

.msg-actions{
    display:flex; gap:4px;
    opacity:0;
    transition:opacity .15s var(--ease);
}
.msg:hover .msg-actions{ opacity:1; }
.msg-actions button{
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    border-radius:7px;
    color:var(--text-muted);
}
.msg-actions button:hover{ background:var(--surface-hover); color:var(--text); }
.msg-actions svg{ width:13px; height:13px; }

.error-bubble{
    display:flex; align-items:center; gap:10px;
    padding:11px 14px;
    border-radius:var(--radius-m);
    background:rgba(240,97,111,.1);
    border:1px solid rgba(240,97,111,.3);
    color:var(--danger);
    font-size:.85rem;
}
.error-bubble button{
    margin-left:auto;
    font-weight:600;
    text-decoration:underline;
    flex-shrink:0;
}

.thinking{
    display:flex; gap:5px; align-items:center;
    padding:14px 15px;
}
.thinking span{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-muted);
    animation:bounce 1.2s infinite ease-in-out;
}
.thinking span:nth-child(2){ animation-delay:.15s; }
.thinking span:nth-child(3){ animation-delay:.3s; }
@keyframes bounce{ 0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-5px); opacity:1;} }

/* ---------- Composer ---------- */
.composer-wrap{
    flex-shrink:0;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
}
.composer{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:8px 8px 8px 16px;
    border-radius:var(--radius-l);
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:var(--shadow-2);
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.composer:focus-within{ border-color:var(--accent-a); box-shadow:var(--shadow-glow); }
.composer textarea{
    flex:1;
    resize:none;
    max-height:180px;
    font-size:.94rem;
    line-height:1.5;
    padding:9px 0;
    color:var(--text);
}
.composer textarea::placeholder{ color:var(--text-muted); }
.send-btn{
    width:38px; height:38px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--accent-grad);
    color:#fff;
    transition:transform .15s var(--ease), opacity .15s var(--ease);
}
.send-btn:disabled{ opacity:.35; pointer-events:none; }
.send-btn:not(:disabled):hover{ transform:scale(1.06); }
.send-btn svg{ width:16px; height:16px; }
.send-btn[data-stop="true"]{ background:var(--danger); }

.composer-hint{
    max-width:760px;
    margin:8px auto 0;
    text-align:center;
    font-size:.72rem;
    color:var(--text-muted);
        }

/* ---------- Toast ---------- */
.toast-stack{
    position:fixed;
    bottom:calc(90px + env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    display:flex; flex-direction:column; gap:8px;
    z-index:200;
    width:min(360px,90vw);
    align-items:center;
}
.toast{
    padding:10px 16px;
    border-radius:var(--radius-pill);
    background:var(--bg-elevated);
    border:1px solid var(--border);
    color:var(--text);
    font-size:.82rem;
    box-shadow:var(--shadow-2);
    animation:toastIn .25s var(--ease);
}
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }



/* ==========================================================
   RESPONSIVE
========================================================== */
@media (max-width:860px){
    .sidebar{ z-index:70; box-shadow:var(--shadow-2); }
    .main{ margin-left:0 !important; }
}
@media (max-width:480px){
    .header{ padding:0 10px; }
    .chat-inner{ padding:18px 12px 30px; }
    .composer-wrap{ padding:10px 10px calc(12px + env(safe-area-inset-bottom)); }
    .bubble-col{ max-width:92%; }
}

/* ---------- Phase 1 additions ---------- */
.msg.user .bubble{ white-space:pre-wrap; }
.msg-time{ font-size:.68rem; color:var(--text-muted); margin:0 4px; align-self:center; }
.msg-actions{ align-items:center; }
@media (hover:none){ .msg-actions{ opacity:1; } }
.msg.editing .bubble-col{ width:86%; }
.edit-area{
    width:100%; min-height:72px; max-height:260px; resize:vertical;
    padding:12px 14px; border-radius:var(--radius-m);
    background:var(--surface); border:1px solid var(--accent-a);
    color:var(--text); font-size:.93rem; line-height:1.6;
}
.edit-row{ display:flex; gap:8px; justify-content:flex-end; }
.edit-row button{ padding:8px 14px; border-radius:var(--radius-s); font-size:.82rem; font-weight:600; color:var(--text-secondary); background:var(--surface-hover); }
.edit-row button.primary{ background:var(--accent-grad); color:#fff; }
.codeblock{ margin:10px 0; border:1px solid var(--border-soft); border-radius:var(--radius-s); overflow:hidden; background:var(--bg); }
.codeblock pre{ margin:0 !important; border:none !important; border-radius:0 !important; }
.code-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 8px 6px 14px; background:var(--surface-hover); font-size:.72rem; color:var(--text-secondary); }
.code-head button{ display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:7px; color:var(--text-secondary); font-size:.72rem; }
.code-head button:hover{ background:var(--border); color:var(--text); }
.code-head svg{ width:13px; height:13px; }
.code-head em{ font-style:normal; }
.hljs-keyword,.hljs-selector-tag,.hljs-literal{ color:#60a5fa; }
.hljs-string,.hljs-attr,.hljs-template-variable{ color:#3ecf8e; }
.hljs-number,.hljs-built_in,.hljs-type{ color:#f0a35e; }
.hljs-title,.hljs-function,.hljs-name{ color:#5cb8ff; }
.hljs-comment,.hljs-quote{ color:var(--text-muted); font-style:italic; }
.hljs-variable,.hljs-params{ color:var(--text); }

/* ---------- Phase 1.5: ChatGPT-mobile-style layout + auto theme ---------- */
:root{ --bg:#000; --bg-elevated:#000; --surface:#2b2b2b; --surface-hover:#242424; --border:#3a3a3a; --border-soft:#232323;
  --text:#fff; --text-secondary:#c7c7cc; --text-muted:#8e8e93; --accent-grad:linear-gradient(#3b82f6,#3b82f6);
  --accent-soft:rgba(59,130,246,.18); --header-h:76px; --sidebar-w:310px; }
html[data-theme="light"]{ --bg:#fff; --bg-elevated:#fff; --surface:#f2f2f4; --surface-hover:#ebebee; --border:#e1e1e6; --border-soft:#ececf0;
  --text:#111; --text-secondary:#4a4a52; --text-muted:#8a8a93; --accent-soft:rgba(59,130,246,.12); }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.round-btn{ width:46px; height:46px; border-radius:50%; background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s var(--ease); }
.round-btn:hover{ background:var(--surface-hover); }
.round-btn svg{ width:21px; height:21px; }
.header{ border-bottom:none; height:auto; padding:calc(12px + env(safe-area-inset-top,0px)) 14px 8px; }
.header .title{ text-align:center; font-size:.95rem; }
.sidebar{ padding-top:env(safe-area-inset-top,0px); }
.sb-head{ display:flex; align-items:center; gap:10px; padding:18px 16px 10px 24px; }
.sb-title{ flex:1; font-size:1.9rem; font-weight:600; letter-spacing:-.01em; }
.sidebar-search{ margin:0 16px 6px; border-radius:var(--radius-pill); padding:11px 16px; background:var(--surface); border:none; }
.sidebar-search[hidden]{ display:none; }
.sb-status{ padding:0 24px 6px; }
.sb-scroll{ flex:1; overflow-y:auto; padding:6px 12px 12px; }
.sb-nav{ display:flex; flex-direction:column; }
.nav-item{ display:flex; align-items:center; gap:18px; padding:14px 12px; border-radius:14px; font-size:1.12rem; font-weight:600; color:var(--text); text-align:left; }
.nav-item svg{ width:24px; height:24px; flex-shrink:0; }
.nav-item:hover{ background:var(--surface-hover); }
.nav-item small{ margin-left:auto; font-size:.65rem; font-weight:600; color:var(--text-muted); border:1px solid var(--border); padding:2px 7px; border-radius:99px; }
.history{ flex:none; overflow:visible; padding:0; gap:0; }
.section-label{ padding:20px 12px 8px; font-size:1.12rem; font-weight:600; color:var(--text); }
.history-item{ padding:14px 12px; font-size:1.05rem; font-weight:500; color:var(--text); border-radius:14px; cursor:pointer; }

.more-btn{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); flex-shrink:0; opacity:0; }

.history-item:hover .more-btn,.history-item:focus-within .more-btn{ opacity:1; }
@media (hover:none){ .more-btn{ opacity:.8; } }
.sb-bottom{ display:flex; align-items:center; gap:10px; padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px)); }
.sb-spacer{ flex:1; }
.chat-pill{ display:flex; align-items:center; gap:10px; padding:14px 24px; border-radius:99px; background:#3b82f6; color:#fff; font-size:1.1rem; font-weight:600; }
.chat-pill svg{ width:22px; height:22px; }
.sb-bottom .round-btn{ width:50px; height:50px; }
.avatar-btn{ width:54px; height:54px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.avatar-btn span{ width:40px; height:40px; border-radius:50%; background:#1bbf9b; color:#fff; font-weight:600; display:flex; align-items:center; justify-content:center; }
.chat-menu{ position:fixed; z-index:120; min-width:170px; padding:6px; border-radius:16px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-2); }
.chat-menu button{ display:block; width:100%; text-align:left; padding:11px 12px; border-radius:10px; font-size:.95rem; font-weight:500; }
.chat-menu button:hover{ background:var(--surface-hover); }
.chat-menu .danger{ color:var(--danger); }
@media (max-width:860px){ .sidebar{ width:min(86vw,340px); } .sb-close{ display:none; } .composer-hint{ display:none; } }
.welcome{ align-items:stretch; justify-content:space-between; text-align:left; padding:8px 8px 0; min-height:calc(100dvh - var(--header-h) - 110px); }
.welcome-top{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; }
.welcome-mark{ margin:0; width:52px; height:52px; }
.welcome h1{ font-size:1.6rem; font-weight:600; }
.starters{ display:flex; flex-direction:column; gap:2px; max-width:none; margin-top:0; grid-template-columns:none; }
.starter{ flex-direction:row; align-items:center; gap:18px; background:none; border:none; padding:16px 10px; font-size:1.1rem; font-weight:600; color:var(--text); }
.starter:hover{ transform:none; background:var(--surface-hover); }
.starter svg{ width:26px; height:26px; flex-shrink:0; }
.avatar{ display:none; }
.bubble-col{ max-width:100%; }
.msg.user .bubble-col{ max-width:86%; }
.msg.assistant .bubble-col{ width:100%; }
.msg.user .bubble{ background:var(--surface); color:var(--text); border-radius:22px 22px 6px 22px; }
.msg.assistant .bubble{ background:none; border:none; padding:4px 2px; }
.composer-wrap{ background:none; padding:6px 14px calc(12px + env(safe-area-inset-bottom,0px)); }
.composer{ align-items:flex-end; gap:4px; padding:8px; border-radius:32px; background:var(--surface); border:none; box-shadow:none; min-height:60px; }
.composer:focus-within{ border:none; box-shadow:none; }
.composer textarea{ font-size:1.05rem; padding:10px 4px; }
.comp-btn{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text); flex-shrink:0; }
.comp-btn svg{ width:24px; height:24px; }
.comp-btn[data-on="true"]{ background:var(--danger); color:#fff; }
.send-btn{ width:44px; height:44px; background:#3b82f6; }
.send-btn svg{ width:20px; height:20px; }
.hljs-keyword,.hljs-selector-tag,.hljs-literal{ color:#c792ea; }
.starter span{ font-size:inherit; color:inherit; }
.sidebar[data-open="false"]{ box-shadow:none !important; }
.sb-status .status-pill{ display:inline-flex; }

/* no focus rectangle inside the composer / search */
.composer textarea,.composer textarea:focus,.composer textarea:focus-visible,
.sidebar-search input,.sidebar-search input:focus,.sidebar-search input:focus-visible{ outline:none !important; box-shadow:none !important; }
.send-btn[data-mode="rec"]{ background:var(--danger); }
.send-btn[data-mode="stop"] rect,.send-btn[data-mode="rec"] rect{ fill:currentColor; }

.comp-btn[hidden]{ display:none; }
.send-btn svg{ stroke-linecap:round; stroke-linejoin:round; }
.comp-btn[data-on="true"]{ background:var(--danger); color:#fff; }
.attach-row{ display:flex; gap:8px; overflow-x:auto; padding:0 6px 8px; }
.attach-row[hidden],.sheet[hidden],.sheet-backdrop[hidden]{ display:none; }
.chip{ position:relative; flex-shrink:0; display:flex; align-items:center; gap:8px; max-width:200px; height:60px; padding:0 30px 0 8px; border-radius:16px; background:var(--surface); font-size:.8rem; }
.chip img{ width:44px; height:44px; border-radius:10px; object-fit:cover; }
.chip svg{ width:24px; height:24px; flex-shrink:0; }
.chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip button{ position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:var(--surface-hover); display:flex; align-items:center; justify-content:center; }
.chip button svg{ width:12px; height:12px; }
.sheet-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:150; }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:160; margin:0 auto; max-width:600px; max-height:90dvh; overflow-y:auto; padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px)); background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:28px 28px 0 0; animation:sheetIn .25s var(--ease); }
@keyframes sheetIn{ from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }
.sheet-grip{ width:44px; height:5px; border-radius:99px; background:var(--border); margin:2px auto 12px; }
.sheet-head{ position:relative; display:flex; align-items:center; justify-content:center; height:44px; margin-bottom:12px; }
.sheet-head h3{ font-size:1.15rem; font-weight:600; }
.sheet-x{ position:absolute; left:0; width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
.sheet-x svg{ width:22px; height:22px; }
.sheet-tiles{ display:flex; gap:10px; margin-bottom:10px; }
.tile{ flex:1; display:flex; flex-direction:column; align-items:center; gap:12px; padding:18px 6px; border-radius:20px; background:var(--surface); font-weight:600; font-size:1rem; color:var(--text); }
.tile .ic,.sheet-row .ic{ width:52px; height:52px; border-radius:50%; background:var(--surface-hover); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tile .ic svg,.sheet-row .ic svg{ width:24px; height:24px; }
.sheet-row{ display:flex; align-items:center; gap:14px; width:100%; margin-top:8px; padding:12px 14px; border-radius:18px; background:var(--surface); color:var(--text); text-align:left; opacity:.6; }
.sheet-row .txt{ flex:1; display:flex; flex-direction:column; font-size:1.05rem; }
.sheet-row strong{ font-weight:600; }
.sheet-row em{ font-style:normal; font-size:.9rem; color:var(--text-muted); }
.sheet-row small{ font-size:.65rem; font-weight:600; color:var(--text-muted); border:1px solid var(--border); padding:2px 7px; border-radius:99px; }
.sw{ width:50px; height:30px; border-radius:99px; background:var(--border); position:relative; flex-shrink:0; }
.sw::after{ content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; }

.msg.assistant .msg-actions{ opacity:1; }
.msg-actions button{ width:34px; height:34px; }
.msg-actions svg{ width:17px; height:17px; }
.msg-actions button.fb-on{ color:#60a5fa; }
.msg-actions button.fb-on svg{ fill:currentColor; }

html[data-theme="dark"]{ color-scheme:dark; }
html[data-theme="light"]{ color-scheme:light; }
html[data-theme="dark"]{ --bg:#000; --bg-elevated:#000; --surface:#2b2b2b; --surface-hover:#242424; --border:#3a3a3a; --border-soft:#232323;
  --text:#fff; --text-secondary:#c7c7cc; --text-muted:#8e8e93; --accent-soft:rgba(59,130,246,.18); }
html[data-theme="light"] .hljs-keyword,html[data-theme="light"] .hljs-selector-tag,html[data-theme="light"] .hljs-literal{ color:#7c3aed; }
html[data-theme="light"] .hljs-string,html[data-theme="light"] .hljs-attr,html[data-theme="light"] .hljs-template-variable{ color:#047857; }
html[data-theme="light"] .hljs-number,html[data-theme="light"] .hljs-built_in,html[data-theme="light"] .hljs-type{ color:#c2410c; }
html[data-theme="light"] .hljs-title,html[data-theme="light"] .hljs-function,html[data-theme="light"] .hljs-name{ color:#1d4ed8; }
html[data-theme="light"] .sheet-backdrop,html[data-theme="light"] .overlay{ background:rgba(0,0,0,.35); }
html[data-theme="light"] .msg-actions button.fb-on{ color:#2563eb; }
html[data-theme="light"] .error-bubble{ background:rgba(240,97,111,.08); }

/* ===== POWER PACK ===== */
.sheet-row{opacity:1}
.sw{transition:background .2s}.sw::after{transition:left .2s}
.sw.on{background:#3b82f6}.sw.on::after{left:23px}
.pn{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.pn[hidden],.lb[hidden]{display:none}
.pn-box{width:100%;max-width:640px;height:88dvh;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:sheetIn .25s var(--ease)}
.pn-head{display:flex;align-items:center;gap:10px;padding:14px 16px}
.pn-head h3{flex:1;text-align:center;font-size:1.15rem;font-weight:600}
.pn-x{width:40px;height:40px;border-radius:50%;background:var(--surface);font-size:1rem}
.pn-act{min-width:40px;display:flex;justify-content:flex-end}
.pn-body{flex:1;overflow-y:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface);cursor:pointer}
.ptxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ptxt b{font-weight:600;font-size:1rem;overflow-wrap:anywhere}
.ptxt small,.note,.empty{color:var(--text-muted);font-size:.85rem}
.empty{text-align:center;padding:50px 10px;line-height:1.6}
.tick{color:#60a5fa;font-weight:700}
.pdel{width:32px;height:32px;border-radius:50%;background:var(--surface-hover);color:var(--text-secondary);flex-shrink:0}
.form{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:var(--surface)}
.form input,.form textarea{background:var(--surface-hover);border-radius:12px;padding:12px;font-size:1rem;resize:none;width:100%}
.pbtn{padding:10px 16px;border-radius:99px;background:#3b82f6;color:#fff;font-weight:600;font-size:.9rem;align-self:flex-start}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface)}
.grid img{width:100%;height:100%;object-fit:cover}
.lb{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.lb-box{max-width:min(92vw,640px);max-height:88dvh;display:flex;flex-direction:column;gap:12px;background:var(--bg-elevated);padding:14px;border-radius:20px;overflow:hidden}
.lb-box>div:first-child{overflow:auto}
.lb-img{max-width:100%;max-height:60dvh;border-radius:12px;display:block;margin:0 auto 10px}
.lb pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.82rem;font-family:ui-monospace,monospace}
.lb-row{display:flex;gap:8px;justify-content:flex-end}
.lb-row button{padding:10px 16px;border-radius:99px;background:var(--surface);font-weight:600}
.lb-row button:first-child:not(:last-child){background:#3b82f6;color:#fff}
.chip{max-width:230px}
.chip .ct,.att-file .ct{display:flex;flex-direction:column;min-width:0;cursor:pointer}
.chip b,.att-file b{font-weight:600;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small,.att-file small{color:var(--text-muted);font-size:.7rem}
.chip.busy small{animation:pulse 1.2s infinite}
.msg-atts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-bottom:6px}
.att-img{width:150px;height:150px;border-radius:16px;overflow:hidden;background:var(--surface)}
.att-img img{width:100%;height:100%;object-fit:cover}
.att-file{display:flex;align-items:center;gap:10px;max-width:240px;padding:10px 14px;border-radius:16px;background:var(--surface);text-align:left;color:var(--text)}
.att-file svg{width:24px;height:24px;flex-shrink:0}
.bubble.clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.more-text{display:block;margin:4px 0 0 auto;font-size:.82rem;color:#60a5fa;font-weight:600}
.msg.user .bubble{white-space:pre-wrap;overflow-wrap:anywhere}

.header .title{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text)}
.hdr-logo{width:22px;height:22px;object-fit:contain}
.welcome-mark.logo-img{width:88px;height:88px;object-fit:contain;animation:logoIn .9s var(--ease) both,logoFloat 4s ease-in-out .9s infinite;filter:drop-shadow(0 0 18px rgba(96,165,250,.4))}
@keyframes logoIn{from{opacity:0;transform:scale(.55) rotate(-14deg);filter:blur(12px)}to{opacity:1;transform:none}}
@keyframes logoFloat{50%{transform:translateY(-7px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.welcome h1{animation:fadeUp .8s var(--ease) .3s both}
.starter{animation:fadeUp .6s var(--ease) both}
.starter:nth-child(1){animation-delay:.45s}.starter:nth-child(2){animation-delay:.53s}.starter:nth-child(3){animation-delay:.61s}.starter:nth-child(4){animation-delay:.69s}
.think-logo{width:30px;height:30px;object-fit:contain;animation:logoPulse 1.3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.06)}}

.sb-status{display:none !important}
.hm-back{position:fixed;inset:0;z-index:119}
.hmenu{position:fixed;z-index:120;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:min(310px,88vw);max-height:calc(100dvh - 24px);overflow-y:auto;padding:8px;border-radius:26px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-2);transform-origin:top right;animation:hmIn .18s var(--ease)}
@keyframes hmIn{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
.hm-title{padding:12px 14px;color:var(--text-muted);font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-item{display:flex;align-items:center;gap:16px;width:100%;padding:14px;border-radius:16px;font-size:1.08rem;font-weight:600;text-align:left}
.hm-item:hover,.hm-item:active{background:var(--surface-hover)}
.hm-item svg{width:24px;height:24px;flex-shrink:0}
.hm-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-item i{font-style:normal;font-size:1.5rem;color:var(--text-muted)}
.hm-item.danger{color:#ff6b6b}
.findbar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border-soft)}
.findbar[hidden]{display:none}
.findbar input{flex:1;min-width:0;background:var(--surface);border-radius:99px;padding:10px 14px;font-size:1rem}
.findbar button{width:34px;height:34px;border-radius:50%;background:var(--surface);flex-shrink:0}
.fc{font-size:.8rem;color:var(--text-muted);min-width:34px;text-align:center}
.find-hit{outline:2px solid rgba(250,204,21,.35);outline-offset:6px;border-radius:12px}
.find-cur{outline-color:#facc15}

/* ===== code card, composer expand ===== */
.codeblock{border-radius:20px;background:var(--surface);border:1px solid var(--border-soft);overflow:hidden;margin:12px 0}
.codeblock .code-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 2px 18px;background:none;border:none;color:var(--text-muted);font-weight:600;font-size:.9rem}
.code-acts{display:flex;gap:2px}
.code-acts button,.cx-head button{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;color:var(--text-secondary);transition:background .15s,color .15s,transform .15s var(--ease)}
.code-acts button:hover{background:var(--surface-hover);color:var(--text)}
.code-acts button:active,.cx-head button:active,.msg-actions button:active{transform:scale(.85)}
.code-acts svg{width:20px;height:20px}
.code-acts .done,.msg-actions .done{color:#3ecf8e}
.code-body{display:flex;padding:6px 0 16px}
.code-gutter{padding:0 14px 0 18px;text-align:right;color:var(--text-muted);user-select:none;font:.86rem/1.65 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.code-body pre{flex:1;min-width:0;overflow-x:auto;margin:0;padding:0 18px 0 0;background:none;border:none;border-radius:0}
.code-body pre code{display:block;padding:0;background:none;font:.86rem/1.65 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.cx{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;animation:cxIn .24s var(--ease);transition:opacity .18s,transform .18s}
@keyframes cxIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.cx.out{opacity:0;transform:scale(.97)}
.cx-head{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px 18px;border-bottom:1px solid var(--border-soft);color:var(--text-secondary);font-weight:600}
.cx-head div{display:flex;gap:6px}
.cx-head button{background:var(--surface);border-radius:50%}
.cx-head svg{width:20px;height:20px}
.cx-body{flex:1;overflow:auto;display:flex;padding:16px 0 calc(28px + env(safe-area-inset-bottom,0px))}
.cx-body pre{margin:0;padding-right:18px;min-width:0}
.cx-body code{font:.86rem/1.65 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.attach-row{max-height:0;opacity:0;padding:0 6px;overflow-y:hidden;transition:max-height .32s var(--ease),opacity .25s,padding .3s var(--ease)}
.attach-row[data-open="true"]{max-height:190px;opacity:1;padding:4px 6px 10px}
.chip.pop{animation:popIn .35s var(--ease)}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.chip.imgc{position:relative;width:96px;height:96px;padding:0;border-radius:18px;overflow:hidden}
.chip.imgc img{width:100%;height:100%;border-radius:0;object-fit:cover}
.chip.imgc .ct{display:none}
.chip.imgc button{top:6px;right:6px;width:26px;height:26px;background:rgba(0,0,0,.65);color:#fff}
.composer{transition:border-radius .25s var(--ease)}
.composer.grow{border-radius:26px}
.composer textarea{transition:height .22s var(--ease);max-height:220px;line-height:1.45}
.comp-btn,.send-btn{transition:transform .15s var(--ease),background .2s}
.comp-btn:active,.send-btn:active{transform:scale(.88)}
</style>

<body>

<div id="app">

    <div class="overlay" id="overlay" data-active="false"></div>

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar" data-open="true" aria-label="Sidebar">
        <div class="sb-head">
            <h2 class="sb-title">DeepSINKY</h2>
            <button class="round-btn" id="searchToggle" type="button" aria-label="Search chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
            <button class="round-btn sb-close" id="closeSidebarBtn" type="button" aria-label="Close sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="sidebar-search" id="searchBox" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"style="width:15px;height:15px;color:var(--text-muted)"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Search chats">
        </div>

    dark:'<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>'

}

    const resolved = pref === "auto" ? (darkMQ.matches ? "dark" : "light") : pref;
    document.documentElement.setAttribute("data-theme", resolved);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = resolved === "dark" ? "#000000" : "#ffffff";
    const label = pref === "auto" ? "Auto" : pref === "dark" ? "Dark" : "Light";

themeToggle.addEventListener("click", () => {

        const t = prompt("Rename chat", chat.title);

}

function historyItem(chat){
    const row = document.createElement("div");
    row.className = "history-item";
    row.setAttribute("role","button"); row.tabIndex = 0;
    row.dataset.active = (chat.id === activeId) ? "true" : "false";
    const label = document.createElement("span");

    const open = () => {
        activeId = chat.id;
        renderActiveChat();

    row.addEventListener("click", open);
    row.addEventListener("keydown", (e) => { if (e.target === row && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); open(); } });
    return row;
}

function renderHistory(filter){
    filter = (filter || "").toLowerCase().trim();
    historyEl.innerHTML = "";
    const match = c => !filter || c.title.toLowerCase().includes(filter) ||
        c.messages.some(m => !m.error && m.text.toLowerCase().includes(filter));
    const vis = chats.filter(c => !c.archived && match(c));
    if (!vis.length){
        historyEl.innerHTML = '<div class="history-empty"><span></span></div>';
        historyEl.querySelector("span").textContent = filter ? "No chats match your search." : "No chats yet — start one below.";
        return;
    }
    const section = (name, list) => {
        if (!list.length) return;
        const h = document.createElement("div");
        h.className = "section-label"; h.textContent = name;
        historyEl.appendChild(h);
        list.forEach(c => historyEl.appendChild(historyItem(c)));
    };
    section("Pinned", vis.filter(c => c.pinned));
    section("Recents", vis.filter(c => !c.pinned));
}
searchInput.addEventListener("input", () => renderHistory(searchInput.value));

function deleteChat(id){
    chats = chats.filter(c => c.id !== id);
    saveChats();
    if (activeId === id){
        activeId = (chats.find(c => !c.archived) || {}).id || null;
        renderActiveChat();
    }
    renderHistory(searchInput.value);
                    }

    const chat = { id: "c" + Date.now(), title: "New chat", messages: [] };

function renderActiveChat(){
    stopSpeaking();
    const chat = getActiveChat();
    chatInner.innerHTML = "";

    if (!chat || !chat.messages.length){

        return;

const ICON = {
    copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',

};
Object.assign(ICON, {
    share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg>',

    stop:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
    up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4v-9zM7 11l4-7a2 2 0 012 2v4h5.5a2 2 0 012 2.3l-1.2 6A2 2 0 0117.3 20H7"/></svg>',

});

/* Share: native share sheet when available, otherwise copy */
function shareText(t){
    if (navigator.share){ navigator.share({ text:t }).catch(() => {}); return; }

/* Read aloud: browser text-to-speech, tap again to stop */
let speakingBtn = null;
function stopSpeaking(){
    if (window.speechSynthesis) speechSynthesis.cancel();

}
function speak(btn, bubble){
    if (!("speechSynthesis" in window)){ showToast("Read aloud isn't supported in this browser"); return; }
    if (speakingBtn === btn){ stopSpeaking(); return; }

    try{ speechSynthesis.speak(u); }catch(e){ stopSpeaking(); showToast("Couldn't start read aloud"); }
}

/* Markdown -> sanitized DOM, with highlighted code + copy-code buttons */
function renderMarkdown(text){
    const box = document.createElement("div");
    if (!window.DOMPurify){ box.textContent = text; box.style.whiteSpace = "pre-wrap"; return box; }
    box.innerHTML = DOMPurify.sanitize(marked.parse(text));
    box.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
    box.querySelectorAll("pre").forEach(pre => {
        const code = pre.querySelector("code");
        if (!code) return;
        const lang = ((code.className.match(/language-([\w+-]+)/) || [])[1]) || "";
        const raw = code.textContent;
        if (window.hljs && lang && hljs.getLanguage(lang)){ try{ hljs.highlightElement(code); }catch(e){} }
        const wrap = document.createElement("div");
        wrap.className = "codeblock";
        const head = document.createElement("div");
        head.className = "code-head";
        const label = document.createElement("span");
        label.textContent = lang || "code";
        const acts = document.createElement("div"); acts.className = "code-acts";
        const cb = document.createElement("button"); cb.type = "button"; cb.setAttribute("aria-label", "Copy code"); cb.innerHTML = ICON.copy;
        cb.addEventListener("click", () => copyCode(cb, raw));
        const xb = document.createElement("button"); xb.type = "button"; xb.setAttribute("aria-label", "Expand code"); xb.innerHTML = ICON.expand;
        xb.addEventListener("click", () => expandCode(lang, raw));
        acts.append(cb, xb);
        head.append(label, acts);
        pre.replaceWith(wrap);
        const body = document.createElement("div"); body.className = "code-body";
        const gut = document.createElement("div"); gut.className = "code-gutter";
        gut.textContent = Array.from({length: raw.replace(/\n$/, "").split("\n").length}, (_, i) => i + 1).join("\n");
        body.append(gut, pre);
        wrap.append(head, body);
    });
    return box;
}

async function handleSend(){
    const text = promptInput.value.trim();
    if (generating) return;
    if (attachments.some(a => a.busy)){ showToast("Still reading your files…"); return; }
    if (!text && !attachments.length) return;

    if (pend.length){ showToast("Reading text in image…"); await Promise.race([Promise.all(pend), new Promise(r => setTimeout(r, 12000))]); }
    const atts = attachments.map(toAtt);
    lastImgs = attachments.filter(a => a.data).map(a => a.data);
    attachments = []; renderAttach();

    let chat = getActiveChat();
    if (!chat){
        chat = { id: "c" + Date.now(), title: "New chat", messages: [] };
        chats.unshift(chat);
        activeId = chat.id;
    }
    if (chat.messages.length === 0){
        chat.title = autoTitle(text || (atts[0] && atts[0].name) || "New chat");
    }

    chat.messages.push({ role:"user", text, atts, ts:Date.now() });
    if (chatInner.contains(welcome)) chatInner.innerHTML = "";
    appendMessageEl(chat.messages[chat.messages.length-1], chat.messages.length-1);
    scrollToBottom();

    saveChats();
    renderHistory(searchInput.value);
    ;

/* Conversation context: send the recent history (bounded by size), oldest dropped first. */
function buildHistory(chat){
    const MAX_CHARS = 80000;
    const out = [];
    let used = 0;
    for (let i = chat.messages.length - 1; i >= 0; i--){
        const m = chat.messages[i];
        if (m.error) continue;
        const cc = m.role === "user" ? compose(m) : m.text;
        used += cc.length;
        if (used > MAX_CHARS && out.length) break;
        out.unshift({ role:m.role, content:cc });
    }
    while (out.length && out[0].role !== "user") out.shift();
    return out;
}

async function sendToAPI(){
    stopSpeaking();
    const chat = getActiveChat();
    if (!chat) return;
    const msgs = buildHistory(chat);
    const last = msgs[msgs.length - 1];
    if (!last || last.role !== "user"){ setGenerating(false); return; }

    setGenerating(true);
    controller = new AbortController();
    showThinking();

    const push = (m) => {
        m.ts = Date.now();
        chat.messages.push(m);
        saveChats();
        if (getActiveChat() === chat){
            appendMessageEl(m, chat.messages.length - 1);
            scrollToBottom();
        }
    };

    try{
        const res = await fetch(API_URL, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            // "message" keeps the current server working; "history"/"messages" carry the context.
            body: JSON.stringify({ message:sendMsg(last.content), history:msgs.slice(0,-1), messages:msgs.slice(0,-1).concat([{ role:"user", content:sendMsg(last.content) }]), system:sysPrefix(), web_search:S.web, images:lastImgs }),
            signal: controller.signal
        });

        if (!res.ok) throw new Error(res.status === 413 ? "Message too large for the server - raise its JSON limit: express.json({limit:'30mb'})" : "Server error (" + res.status + ")");
        const data = await res.json();
        if (!data.reply) throw new Error("Empty response from server");

        hideThinking();
        push({ role:"assistant", text:data.reply });
        if (getActiveChat() === chat) revealLast(chat);
        if (voice) speakThenListen(data.reply);
        setStatus("online");

    }catch(err){
        hideThinking();
        if (err.name === "AbortError"){
            push({ role:"assistant", text:"Generation stopped.", error:true });
        } else {
            const msgText = /fetch|network|failed/i.test(err.message)
                ? "Couldn't reach DeepSINKY's server. Check your connection and try again."
                : err.message;
            push({ role:"assistant", text:msgText, error:true });
            setStatus("offline");
            if (voice) stopVoice();
        }
    }finally{
        setGenerating(false);
        controller = null;
    }
}

function shrink(file,max,q){
    return new Promise((res,rej)=>{
        const u=URL.createObjectURL(file), im=new Image();
        im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas");
            c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);

        im.onerror=()=>{ URL.revokeObjectURL(u); rej(); };

const words=t=>t.trim()?t.trim().split(/\s+/).length:0;
async function readFile(a){
    const f=a.file, n=f.name.toLowerCase();
    if(f.type.startsWith("image/")){
        a.kind="image"; a.data=await shrink(f,1280,.82); a.thumb=await shrink(f,480,.6); a.url=a.thumb;
        a.ocr=(async()=>{ try{
            await load("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
            const r=await Tesseract.recognize(a.data,"eng"), t=(r.data.text||"").trim();
            if(t.length>15) a.text="Text detected in this image (OCR):\n"+t.slice(0,20000);
        }catch(e){} })();
        return;
    }
    if(n.endsWith(".pdf")){
        await load(CDN+"pdf.js/3.11.174/pdf.min.js");
        pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+"pdf.js/3.11.174/pdf.worker.min.js";
        const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; let t="";

    if(a.text.length>CAP){ a.text=a.text.slice(0,CAP)+"\n…[truncated]"; showToast(a.name+" is very long — first part used"); }
    a.words=words(a.text);
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBase = "";
function toggleMic(){
    if (!SpeechRec){ showToast("Voice input isn't supported in this browser"); return; }
    if (listening){ rec.stop(); return; }
    rec = new SpeechRec();
    rec.lang = navigator.language || "en-US";
    rec.interimResults = true;
    rec.continuous = false;
    micBase = promptInput.value ? promptInput.value.replace(/\s*$/, " ") : "";
    rec.onstart = () => { listening = true; updateSendBtn(); };
    rec.onresult = (e) => {
        let t = "";
        for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        promptInput.value = micBase + t;
        promptInput.dispatchEvent(new Event("input"));
    };
    rec.onerror = (e) => {
        showToast(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Microphone permission denied"
            : e.error === "no-speech" ? "Didn't catch anything — try again" : "Voice input error: " + e.error);
    };
    rec.onend = () => { listening = false; updateSendBtn(); };
    try{ rec.start(); }catch(err){ showToast("Couldn't start the microphone"); }
}

/* ===== LOGO: uses your own logo.png file from the same folder ===== */
const LOGO_FILES=["logo.png","Logo.png"], logoCache={};
function logoURL(rgb){
    const key=rgb.join();
    if(logoCache[key]) return logoCache[key];
    return logoCache[key]=new Promise(res=>{
        const go=(i)=>{
            if(i>=LOGO_FILES.length){ res(null); return; }
            const im=new Image();
            im.onload=()=>{ try{
                const k=Math.min(1,512/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement("canvas");
                c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
                const x=c.getContext("2d"); x.drawImage(im,0,0,c.width,c.height);
                const d=x.getImageData(0,0,c.width,c.height), q=d.data; let alpha=false;
                for(let n=3;n<q.length;n+=4) if(q[n]<200){ alpha=true; break; }
                for(let n=0;n<q.length;n+=4){
                    const a=q[n+3]/255, dark=1-(q[n]*.299+q[n+1]*.587+q[n+2]*.114)/255;
                    const v=alpha?a:Math.min(1,Math.max(0,(dark-.08)*1.25))*a;
                    q[n]=rgb[0]; q[n+1]=rgb[1]; q[n+2]=rgb[2]; q[n+3]=Math.round(255*v);
                }
                x.putImageData(d,0,0); res(c.toDataURL("image/png"));
            }catch(e){ res(im.src); } };
            im.onerror=()=>go(i+1);
            im.src=LOGO_FILES[i];
        };
        go(0);
    });
}
function applyLogos(){
    const rgb=document.documentElement.dataset.theme==="light"?[22,24,33]:[255,255,255];
    logoURL(rgb).then(u=>{
        new Set([...document.querySelectorAll(".dslogo"),...welcome.querySelectorAll(".dslogo")]).forEach(i=>{ if(u) i.src=u; else i.style.display="none"; });
    });
}

    o.innerHTML='<div class="cx-head"><span></span><div><button type="button" data-c aria-label="Copy code"></button><button type="button" data-x aria-label="Close"></button></div></div><div class="cx-body"><div class="code-gutter"></div><pre><code></code></pre></div>';
    o.querySelector("span").textContent=lang||"code";
    const cb=o.querySelector("[data-c]"), xb=o.querySelector("[data-x]"), code=o.querySelector("code");
    cb.innerHTML=ICON.copy; xb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    try{ code.innerHTML=(window.hljs&&lang&&hljs.getLanguage(lang))?hljs.highlight(raw,{language:lang}).value:escapeHtml(raw); }catch(e){ code.textContent=raw; }
    o.querySelector(".code-gutter").textContent=Array.from({length:raw.replace(/\n$/,"").split("\n").length},(_,i)=>i+1).join("\n");
    const onKey=e=>{ if(e.key==="Escape") close(); };
    const close=()=>{ document.removeEventListener("keydown",onKey); o.classList.add("out"); setTimeout(()=>o.remove(),180); };
    document.addEventListener("keydown",onKey); cb.onclick=()=>copyCode(cb,raw); xb.onclick=close;
    document.body.appendChild(o);
}
/* composer grows smoothly as you type (measured on a hidden mirror so the height can animate) */
const mir=document.createElement("div"); mir.setAttribute("aria-hidden","true");
mir.style.cssText="position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre-wrap;overflow-wrap:anywhere;box-sizing:border-box";
document.body.appendChild(mir);
const composerEl=document.querySelector(".composer");
function fitPrompt(){
    const ta=promptInput; if(!ta.clientWidth) return;
    const cs=getComputedStyle(ta);
    ["fontFamily","fontSize","fontWeight","lineHeight","letterSpacing","paddingTop","paddingBottom","paddingLeft","paddingRight"].forEach(k=>{ mir.style[k]=cs[k]; });
    mir.style.width=ta.clientWidth+"px";
    mir.textContent="x"; const base=mir.offsetHeight;
    mir.textContent=ta.value+"\u200b"; const full=mir.offsetHeight, max=220;
    ta.style.height=Math.min(Math.max(full,base),max)+"px";
    ta.style.overflowY=full>max?"auto":"hidden";
    composerEl.classList.toggle("grow",full>base+4||attachments.length>0);
}
window.addEventListener("resize",fitPrompt);
{ const _ra=renderAttach; renderAttach=function(){ _ra(); fitPrompt(); }; }

/* ===== REPLY ANIMATION, VOICE MODE ===== */
/* ChatGPT-style progressive reveal of a fresh reply */
function revealLast(chat){
    if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const m=chat.messages[chat.messages.length-1];
    if(!m||m.error||m.text.length>6000) return;
    const all=chatInner.querySelectorAll(".msg.assistant"), msg=all[all.length-1];
    const bubble=msg&&msg.querySelector(".bubble"); if(!bubble) return;
    const full=m.text, step=Math.max(3,Math.ceil(full.length/45)); let n=0;
    const done=()=>bubble.replaceChildren(...renderMarkdown(full).childNodes);
    const id=setInterval(()=>{
        if(!bubble.isConnected){ clearInterval(id); return; }
        n+=step;
        if(n>=full.length){ clearInterval(id); done(); return; }
        let cut=full.lastIndexOf(" ",n); if(cut<n-30) cut=n;
        bubble.replaceChildren(...renderMarkdown(full.slice(0,cut)).childNodes);
        if(chatScroll.scrollHeight-chatScroll.scrollTop-chatScroll.clientHeight<220) chatScroll.scrollTop=chatScroll.scrollHeight;
    },40);
}

/* Hands-free voice mode: listen -> send -> read reply aloud -> listen again */
let voice=false, silent=0;
function startVoice(){
    if(!SpeechRec){ showToast("Voice isn't supported in this browser"); return; }
    voice=true; silent=0; updateSendBtn(); showToast("Voice mode on - speak now. Tap stop to end"); listenOnce();
}
function stopVoice(){
    voice=false;
    try{ if(rec&&listening) rec.stop(); }catch(e){}
    if(window.speechSynthesis) speechSynthesis.cancel();
    updateSendBtn();
}
function listenOnce(){
    if(!voice||listening||generating) return;
    promptInput.value=""; promptInput.dispatchEvent(new Event("input"));
    toggleMic();
    const r=rec; if(!r) return;
    const prev=r.onend;
    r.onend=()=>{
        prev&&prev();
        if(!voice) return;
        const t=promptInput.value.trim();
        if(t){ silent=0; handleSend(); }
        else if(++silent>=3){ showToast("Didn't hear anything - voice mode off"); stopVoice(); }
        else if(!generating) setTimeout(listenOnce,500);
    };
}
function speakThenListen(text){
    if(!window.speechSynthesis){ setTimeout(listenOnce,300); return; }
    const t=(renderMarkdown(text).textContent||"").slice(0,1800);
    const u=new SpeechSynthesisUtterance(t);
    u.lang=/[\u0900-\u097F]/.test(t)?"hi-IN":(navigator.language||"en-US");
    u.onend=u.onerror=()=>{ if(voice) setTimeout(listenOnce,300); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
}

renderHistory("");
renderActiveChat();
setGenerating(false);
fitPrompt();

})();
