<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DeepSINKY — Think. Create. Research. Build.</title>
<meta name="description" content="DeepSINKY AI">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* ==========================================================
   DEEPSINKY — DESIGN TOKENS
========================================================== */
:root{
    color-scheme: dark;
    --bg:#0a0d14;
    --bg-elevated:#10141d;
    --surface:#141924;
    --surface-hover:#1b2230;
    --border:#232b3a;
    --border-soft:#1a212e;

    --text:#f2f4f8;
    --text-secondary:#a8b1c4;
    --text-muted:#616d84;

    --accent-a:#6d5ef8;
    --accent-b:#9f7bff;
    --accent-grad:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    --accent-soft:rgba(109,94,248,.14);

    --danger:#f0616f;
    --success:#3ecf8e;

    --radius-s:10px;
    --radius-m:16px;
    --radius-l:22px;
    --radius-pill:999px;

    --header-h:64px;
    --sidebar-w:280px;

    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 8px 24px rgba(0,0,0,.35);
    --shadow-glow:0 0 0 1px rgba(109,94,248,.25), 0 8px 30px rgba(109,94,248,.18);

    --ease:cubic-bezier(.22,1,.36,1);
}

html[data-theme="light"]{
    color-scheme: light;
    --bg:#f7f7fb;
    --bg-elevated:#ffffff;
    --surface:#ffffff;
    --surface-hover:#f0f1f7;
    --border:#e6e7ef;
    --border-soft:#eef0f6;

    --text:#161821;
    --text-secondary:#565b6d;
    --text-muted:#8b90a0;

    --accent-soft:rgba(109,94,248,.09);
    --shadow-1:0 1px 2px rgba(20,20,40,.06);
    --shadow-2:0 12px 28px rgba(20,20,40,.09);
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
    height:100%;
    overscroll-behavior:none;
}

body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition:background .2s var(--ease),color .2s var(--ease);
}

button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
input,textarea{ font-family:inherit; border:none; outline:none; background:none; color:inherit; }
a{ color:var(--accent-b); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:999px; }
::-webkit-scrollbar-thumb:hover{ background:var(--accent-a); }

:focus-visible{ outline:2px solid var(--accent-a); outline-offset:2px; }

@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}



/* ==========================================================
   APP SHELL
========================================================== */
#app{
    position:relative;
    display:flex;
    width:100%;
    height:100dvh;
}

/* ---------- Sidebar ---------- */
.sidebar{
    position:fixed;
    inset:0 auto 0 0;
    width:var(--sidebar-w);
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg-elevated);
    border-right:1px solid var(--border-soft);
    z-index:60;
    transform:translateX(0);
    transition:transform .28s var(--ease);
}
.sidebar[data-open="false"]{ transform:translateX(-100%); }

.sidebar-top{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px;
    border-bottom:1px solid var(--border-soft);
}
.brand{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
}
.brand-mark{ width:30px; height:30px; flex-shrink:0; }
.brand-name{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:-.01em;
    white-space:nowrap;
}
.icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    transition:background .15s var(--ease), color .15s var(--ease);
    flex-shrink:0;
}
.icon-btn:hover{ background:var(--surface-hover); color:var(--text); }
.icon-btn svg{ width:18px; height:18px; }

.new-chat-btn{
    display:flex; align-items:center; gap:10px;
    margin:12px;
    padding:11px 14px;
    border-radius:var(--radius-m);
    background:var(--accent-grad);
    color:#fff;
    font-weight:600;
    font-size:.9rem;
    box-shadow:var(--shadow-1);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
}
.new-chat-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-glow); }
.new-chat-btn svg{ width:16px; height:16px; }

.sidebar-search{
    display:flex; align-items:center; gap:8px;
    margin:0 12px 10px;
    padding:9px 12px;
    border-radius:var(--radius-s);
    background:var(--surface);
    border:1px solid var(--border-soft);
}
.sidebar-search svg{ width:15px; height:15px; color:var(--text-muted); flex-shrink:0; }
.sidebar-search input{ flex:1; font-size:.85rem; color:var(--text); }
.sidebar-search input::placeholder{ color:var(--text-muted); }

.history{
    flex:1;
    overflow-y:auto;
    padding:4px 8px 8px;
    display:flex;
    flex-direction:column;
    gap:2px;
}
.history-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    padding:40px 20px;
    color:var(--text-muted);
    text-align:center;
    font-size:.83rem;
}
.history-item{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:10px 10px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    font-size:.85rem;
    text-align:left;
    transition:background .15s var(--ease), color .15s var(--ease);
    position:relative;
}
.history-item:hover{ background:var(--surface-hover); color:var(--text); }
.history-item[data-active="true"]{ background:var(--accent-soft); color:var(--text); }
.history-item span{
    flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.history-item .del{
    opacity:0; width:26px; height:26px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:7px;
}
.history-item:hover .del{ opacity:1; }
.history-item .del:hover{ background:rgba(240,97,111,.15); color:var(--danger); }
.history-item .del svg{ width:14px; height:14px; }

.sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    gap:8px;
}
.theme-toggle{
    display:flex; align-items:center; gap:10px;
    flex:1;
    padding:10px 12px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    font-size:.83rem;
    font-weight:600;
    transition:background .15s var(--ease);
}
.theme-toggle:hover{ background:var(--surface-hover); color:var(--text); }
.theme-toggle svg{ width:16px; height:16px; }


/* ---------- Overlay (mobile sidebar) ---------- */
.overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(2px);
    z-index:55;
    opacity:0; pointer-events:none;
    transition:opacity .25s var(--ease);
}
.overlay[data-active="true"]{ opacity:1; pointer-events:auto; }

/* ---------- Main ---------- */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100dvh;
    min-width:0;
    margin-left:var(--sidebar-w);
    transition:margin-left .28s var(--ease);
}
.main[data-full="true"]{ margin-left:0; }

.header{
    display:flex; align-items:center; gap:10px;
    height:var(--header-h);
    padding:0 16px;
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0;
}
.header .title{
    flex:1;
    font-weight:600;
    font-size:.92rem;
    color:var(--text-secondary);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.status-pill{
    display:flex; align-items:center; gap:6px;
    padding:5px 10px;
    border-radius:var(--radius-pill);
    background:var(--surface);
    border:1px solid var(--border-soft);
    font-size:.72rem;
    font-weight:600;
    color:var(--text-secondary);
    flex-shrink:0;
}
.status-dot{ width:6px; height:6px; border-radius:50%; background:var(--success); }
.status-dot[data-state="offline"]{ background:var(--text-muted); }
.status-dot[data-state="busy"]{ background:#f5b942; animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }

/* ---------- Chat area ---------- */
.chat-scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}
.chat-inner{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
    gap:22px;
}

/* ---------- Welcome ---------- */
.welcome{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
    min-height:calc(100dvh - var(--header-h) - 96px);
}
.welcome-mark{ width:58px; height:58px; margin-bottom:22px; }
.welcome h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(1.7rem,4.4vw,2.6rem);
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.15;
}
.welcome h1 em{
    font-style:normal;
    background:var(--accent-grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.welcome p{
    margin-top:12px;
    color:var(--text-secondary);
    font-size:.98rem;
}
.starters{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:34px;
    width:100%;
    max-width:560px;
}
.starter{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    padding:15px 16px;
    border-radius:var(--radius-m);
    background:var(--surface);
    border:1px solid var(--border-soft);
    text-align:left;
    transition:border-color .18s var(--ease), transform .18s var(--ease), background .18s var(--ease);
}
.starter:hover{ border-color:var(--accent-a); transform:translateY(-2px); background:var(--surface-hover); }
.starter strong{ font-size:.85rem; font-weight:600; }
.starter span{ font-size:.78rem; color:var(--text-muted); }
@media (max-width:520px){ .starters{ grid-template-columns:1fr; } }

/* ---------- Messages ---------- */
.msg{
    display:flex;
    gap:12px;
    align-items:flex-start;
    animation:msgIn .25s var(--ease);
}
@keyframes msgIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.msg.user{ flex-direction:row-reverse; }
.avatar{
    width:30px; height:30px; border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.7rem; font-weight:700;
}
.msg.user .avatar{ background:var(--surface-hover); color:var(--text-secondary); }
.msg.assistant .avatar{ background:var(--accent-grad); color:#fff; }

.bubble-col{
    display:flex; flex-direction:column; gap:6px;
    max-width:86%;
    min-width:0;
}
.msg.user .bubble-col{ align-items:flex-end; }

.bubble{
    padding:12px 15px;
    border-radius:var(--radius-m);
    font-size:.93rem;
    line-height:1.65;
    word-wrap:break-word;
}
.msg.user .bubble{
    background:var(--accent-grad);
    color:#fff;
    border-radius:var(--radius-m) var(--radius-m) 4px var(--radius-m);
}
.msg.assistant .bubble{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-m) var(--radius-m) var(--radius-m) 4px;
}
.bubble p{ margin:0 0 10px; }
.bubble p:last-child{ margin-bottom:0; }
.bubble pre{
    background:var(--bg);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-s);
    padding:12px 14px;
    overflow-x:auto;
    margin:10px 0;
    font-size:.8rem;
}
.bubble code{ font-family:"SF Mono",Consolas,monospace; }
.bubble :not(pre)>code{
    background:var(--bg);
    padding:2px 6px;
    border-radius:5px;
    font-size:.85em;
}
.bubble ul,.bubble ol{ margin:0 0 10px 20px; }
.bubble a{ text-decoration:underline; }

.msg-actions{
    display:flex; gap:4px;
    opacity:0;
    transition:opacity .15s var(--ease);
}
.msg:hover .msg-actions{ opacity:1; }
.msg-actions button{
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    border-radius:7px;
    color:var(--text-muted);
}
.msg-actions button:hover{ background:var(--surface-hover); color:var(--text); }
.msg-actions svg{ width:13px; height:13px; }

.error-bubble{
    display:flex; align-items:center; gap:10px;
    padding:11px 14px;
    border-radius:var(--radius-m);
    background:rgba(240,97,111,.1);
    border:1px solid rgba(240,97,111,.3);
    color:var(--danger);
    font-size:.85rem;
}
.error-bubble button{
    margin-left:auto;
    font-weight:600;
    text-decoration:underline;
    flex-shrink:0;
}

.thinking{
    display:flex; gap:5px; align-items:center;
    padding:14px 15px;
}
.thinking span{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-muted);
    animation:bounce 1.2s infinite ease-in-out;
}
.thinking span:nth-child(2){ animation-delay:.15s; }
.thinking span:nth-child(3){ animation-delay:.3s; }
@keyframes bounce{ 0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-5px); opacity:1;} }

/* ---------- Composer ---------- */
.composer-wrap{
    flex-shrink:0;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
}
.composer{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:8px 8px 8px 16px;
    border-radius:var(--radius-l);
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:var(--shadow-2);
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.composer:focus-within{ border-color:var(--accent-a); box-shadow:var(--shadow-glow); }
.composer textarea{
    flex:1;
    resize:none;
    max-height:180px;
    font-size:.94rem;
    line-height:1.5;
    padding:9px 0;
    color:var(--text);
}
.composer textarea::placeholder{ color:var(--text-muted); }
.send-btn{
    width:38px; height:38px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--accent-grad);
    color:#fff;
    transition:transform .15s var(--ease), opacity .15s var(--ease);
}
.send-btn:disabled{ opacity:.35; pointer-events:none; }
.send-btn:not(:disabled):hover{ transform:scale(1.06); }
.send-btn svg{ width:16px; height:16px; }
.send-btn[data-stop="true"]{ background:var(--danger); }

.composer-hint{
    max-width:760px;
    margin:8px auto 0;
    text-align:center;
    font-size:.72rem;
    color:var(--text-muted);
        }

/* ---------- Toast ---------- */
.toast-stack{
    position:fixed;
    bottom:calc(90px + env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    display:flex; flex-direction:column; gap:8px;
    z-index:200;
    width:min(360px,90vw);
    align-items:center;
}
.toast{
    padding:10px 16px;
    border-radius:var(--radius-pill);
    background:var(--bg-elevated);
    border:1px solid var(--border);
    color:var(--text);
    font-size:.82rem;
    box-shadow:var(--shadow-2);
    animation:toastIn .25s var(--ease);
}
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }



/* ==========================================================
   RESPONSIVE
========================================================== */
@media (max-width:860px){
    .sidebar{ z-index:70; box-shadow:var(--shadow-2); }
    .main{ margin-left:0 !important; }
}
@media (max-width:480px){
    .header{ padding:0 10px; }
    .chat-inner{ padding:18px 12px 30px; }
    .composer-wrap{ padding:10px 10px calc(12px + env(safe-area-inset-bottom)); }
    .bubble-col{ max-width:92%; }
}
</style>
</head>
<body>

<div id="app">

    <div class="overlay" id="overlay" data-active="false"></div>

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar" data-open="true">
        <div class="sidebar-top">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 100 100" fill="none">
                    <path d="M50 4 L92 27 V73 L50 96 L8 73 V27 Z" stroke="url(#g1)" stroke-width="6"/>
                    <path d="M50 24 L74 38 V62 L50 76 L26 62 V38 Z" fill="url(#g1)"/>
                    <defs><linearGradient id="g1" x1="0" y1="0" x2="100" y2="100">
                        <stop offset="0" stop-color="#6d5ef8"/><stop offset="1" stop-color="#9f7bff"/>
                    </linearGradient></defs>
                </svg>
                <span class="brand-name">DeepSINKY</span>
            </div>
            <button class="icon-btn" id="closeSidebarBtn" aria-label="Close sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>

        <button class="new-chat-btn" id="newChatBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
            New chat
        </button>

        <div class="sidebar-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Search chats">
        </div>

        <div class="history" id="history"></div>

        <div class="sidebar-bottom">
            <button class="theme-toggle" id="themeToggle">
                <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
                <span id="themeLabel">Dark mode</span>
            </button>
        </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main" id="main" data-full="false">
        <header class="header">
            <button class="icon-btn" id="openSidebarBtn" aria-label="Open sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="title" id="chatTitle">New chat</div>
            <div class="status-pill">
                <span class="status-dot" id="statusDot" data-state="offline"></span>
                <span id="statusLabel">Checking…</span>
            </div>
        </header>

        <div class="chat-scroll" id="chatScroll">
            <div class="chat-inner" id="chatInner">
                <div class="welcome" id="welcome">
                    <svg class="welcome-mark" viewBox="0 0 100 100" fill="none">
                        <path d="M50 4 L92 27 V73 L50 96 L8 73 V27 Z" stroke="url(#g2)" stroke-width="5"/>
                        <path d="M50 24 L74 38 V62 L50 76 L26 62 V38 Z" fill="url(#g2)"/>
                        <defs><linearGradient id="g2" x1="0" y1="0" x2="100" y2="100">
                            <stop offset="0" stop-color="#6d5ef8"/><stop offset="1" stop-color="#9f7bff"/>
                        </linearGradient></defs>
                    </svg>
                    <h1>Think. Create. <em>Build.</em></h1>
                    <p>Ask DeepSINKY anything to get started.</p>
                    <div class="starters" id="starters">
                        <button class="starter" data-prompt="Explain this concept to me like I'm new to it: ">
                            <strong>Learn something</strong>
                            <span>Understand a difficult topic, simply</span>
                        </button>
                        <button class="starter" data-prompt="Help me write: ">
                            <strong>Write something</strong>
                            <span>Draft an email, post, or story</span>
                        </button>
                        <button class="starter" data-prompt="Help me plan: ">
                            <strong>Plan something</strong>
                            <span>Break a goal into clear steps</span>
                        </button>
                        <button class="starter" data-prompt="Help me debug this code: ">
                            <strong>Fix some code</strong>
                            <span>Find and solve a bug together</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="composer-wrap">
            <div class="composer">
                <textarea id="promptInput" rows="1" placeholder="Message DeepSINKY…"></textarea>
                <button class="send-btn" id="sendBtn" disabled aria-label="Send">
                    <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </button>
            </div>
            <div class="composer-hint">DeepSINKY can make mistakes. Check important info.</div>
        </div>
    </main>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
(function(){
"use strict";


/* ==========================================================
   CONFIG
========================================================== */
const API_URL = "https://deepsinky-server-1.onrender.com/chat";
const STORAGE_KEY = "deepsinky_chats_v1";
const THEME_KEY = "deepsinky_theme";

/* ==========================================================
   DOM
========================================================== */
const $ = (id) => document.getElementById(id);
const sidebar = $("sidebar"), overlay = $("overlay"), main = $("main");
const openSidebarBtn = $("openSidebarBtn"), closeSidebarBtn = $("closeSidebarBtn");
const newChatBtn = $("newChatBtn"), searchInput = $("searchInput"), historyEl = $("history");
const themeToggle = $("themeToggle"), themeIcon = $("themeIcon"), themeLabel = $("themeLabel");
const chatScroll = $("chatScroll"), chatInner = $("chatInner"), welcome = $("welcome"), starters = $("starters");
const promptInput = $("promptInput"), sendBtn = $("sendBtn"), sendIcon = $("sendIcon");
const chatTitle = $("chatTitle"), statusDot = $("statusDot"), statusLabel = $("statusLabel");
const toastStack = $("toastStack");

marked.setOptions({ breaks:true });

/* ==========================================================
   STATE
========================================================== */
let chats = loadChats();
let activeId = chats.length ? chats[0].id : null;
let generating = false;
let controller = null;

function loadChats(){
    try{
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
}
function saveChats(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}
function getActiveChat(){
    return chats.find(c => c.id === activeId) || null;
}

/* ==========================================================
   TOAST
========================================================== */
window.showToast = function(message){
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = message;
    toastStack.appendChild(t);
    setTimeout(() => t.remove(), 2800);
};

/* ==========================================================
   THEME
========================================================== */
function applyTheme(mode){
    document.documentElement.setAttribute("data-theme", mode);
    themeLabel.textContent = mode === "light" ? "Light mode" : "Dark mode";
    themeIcon.innerHTML = mode === "light"
        ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
        : '<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>';
    localStorage.setItem(THEME_KEY, mode);
}
themeToggle.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme") || "dark";
    applyTheme(current === "dark" ? "light" : "dark");
});
applyTheme(localStorage.getItem(THEME_KEY) || "dark");

/* ==========================================================
   SIDEBAR (mobile)
========================================================== */
function isMobile(){ return window.innerWidth <= 860; }
function setSidebar(open){
    sidebar.dataset.open = open ? "true" : "false";
    overlay.dataset.active = (open && isMobile()) ? "true" : "false";
    main.dataset.full = (!open) ? "true" : "false";
}
openSidebarBtn.addEventListener("click", () => setSidebar(true));
closeSidebarBtn.addEventListener("click", () => setSidebar(false));
overlay.addEventListener("click", () => setSidebar(false));
if (isMobile()) setSidebar(false);
window.addEventListener("resize", () => { if(!isMobile()) overlay.dataset.active="false"; });

/* ==========================================================
   RENDER: HISTORY LIST
========================================================== */
function renderHistory(filter){
    filter = (filter || "").toLowerCase();
    historyEl.innerHTML = "";
    const visible = chats.filter(c => c.title.toLowerCase().includes(filter));

    if (!visible.length){
        historyEl.innerHTML = `<div class="history-empty">
            <span>No chats yet — start one above.</span>
        </div>`;
        return;
    }

    visible.forEach(chat => {
        const item = document.createElement("button");
        item.className = "history-item";
        item.dataset.active = (chat.id === activeId) ? "true" : "false";
        item.innerHTML = `<span>${escapeHtml(chat.title)}</span>
            <span class="del" title="Delete chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
            </span>`;
        item.addEventListener("click", (e) => {
            if (e.target.closest(".del")){
                deleteChat(chat.id);
                return;
            }
            activeId = chat.id;
            renderActiveChat();
            renderHistory(searchInput.value);
            if (isMobile()) setSidebar(false);
        });
        historyEl.appendChild(item);
    });
}
searchInput.addEventListener("input", () => renderHistory(searchInput.value));

function deleteChat(id){
    chats = chats.filter(c => c.id !== id);
    saveChats();
    if (activeId === id){
        activeId = chats.length ? chats[0].id : null;
        renderActiveChat();
    }
    renderHistory(searchInput.value);
                    }


/* ==========================================================
   NEW CHAT
========================================================== */
function createChat(){
    const chat = { id: "c" + Date.now(), title: "New chat", messages: [] };
    chats.unshift(chat);
    activeId = chat.id;
    saveChats();
    renderHistory(searchInput.value);
    renderActiveChat();
    if (isMobile()) setSidebar(false);
    promptInput.focus();
}
newChatBtn.addEventListener("click", createChat);

/* ==========================================================
   RENDER: ACTIVE CHAT
========================================================== */
function renderActiveChat(){
    const chat = getActiveChat();
    chatInner.innerHTML = "";

    if (!chat || !chat.messages.length){
        chatTitle.textContent = "New chat";
        chatInner.appendChild(welcome);
        return;
    }

    chatTitle.textContent = chat.title;
    chat.messages.forEach(m => appendMessageEl(m.role, m.text, m.error));
    scrollToBottom();
}

function scrollToBottom(){
    requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; });
}

function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
}

function appendMessageEl(role, text, isError){
    const msg = document.createElement("div");
    msg.className = "msg " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "Y" : "S";

    const col = document.createElement("div");
    col.className = "bubble-col";

    if (isError){
        const err = document.createElement("div");
        err.className = "error-bubble";
        err.innerHTML = `<span>${escapeHtml(text)}</span><button>Retry</button>`;
        err.querySelector("button").addEventListener("click", () => {
            msg.remove();
            const chat = getActiveChat();
            const lastUser = [...chat.messages].reverse().find(m => m.role === "user");
            if (lastUser) sendToAPI(lastUser.text, true);
        });
        col.appendChild(err);
    } else {
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = role === "assistant" ? marked.parse(text) : escapeHtml(text);
        col.appendChild(bubble);

        const actions = document.createElement("div");
        actions.className = "msg-actions";
        actions.innerHTML = `<button title="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg></button>`;
        actions.querySelector("button").addEventListener("click", () => {
            navigator.clipboard.writeText(text);
            showToast("Copied to clipboard");
        });
        col.appendChild(actions);
    }

    msg.appendChild(avatar);
    msg.appendChild(col);
    chatInner.appendChild(msg);
    return msg;
}

/* ==========================================================
   THINKING INDICATOR
========================================================== */
let thinkingEl = null;
function showThinking(){
    thinkingEl = document.createElement("div");
    thinkingEl.className = "msg assistant";
    thinkingEl.innerHTML = `<div class="avatar">S</div>
        <div class="bubble-col"><div class="bubble thinking"><span></span><span></span><span></span></div></div>`;
    chatInner.appendChild(thinkingEl);
    scrollToBottom();
}
function hideThinking(){
    if (thinkingEl){ thinkingEl.remove(); thinkingEl = null; }
}

/* ==========================================================
   SEND / STREAM / API
========================================================== */
function autoTitle(text){
    const clean = text.trim().replace(/\s+/g," ");
    return clean.length > 42 ? clean.slice(0,42) + "…" : (clean || "New chat");
}

function setGenerating(state){
    generating = state;
    sendBtn.dataset.stop = state ? "true" : "false";
    sendIcon.innerHTML = state
        ? '<rect x="6" y="6" width="12" height="12" rx="2"/>'
        : '<path d="M12 19V5M5 12l7-7 7 7"/>';
    sendBtn.disabled = state ? false : (promptInput.value.trim().length === 0);
}

async function handleSend(){
    const text = promptInput.value.trim();
    if (!text || generating) return;

    let chat = getActiveChat();
    if (!chat){
        chat = { id: "c" + Date.now(), title: "New chat", messages: [] };
        chats.unshift(chat);
        activeId = chat.id;
    }
    if (chat.messages.length === 0){
        chat.title = autoTitle(text);
    }

    chat.messages.push({ role:"user", text });
    if (chatInner.contains(welcome)) chatInner.innerHTML = "";
    appendMessageEl("user", text);
    scrollToBottom();

    promptInput.value = "";
    promptInput.style.height = "auto";
    setGenerating(true);

    saveChats();
    renderHistory(searchInput.value);
    chatTitle.textContent = chat.title;

    await sendToAPI(text);
}

async function sendToAPI(message){
    setGenerating(true);
    controller = new AbortController();
    showThinking();

    try{
        const res = await fetch(API_URL, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ message }),
            signal: controller.signal
        });

        if (!res.ok) throw new Error("Server error (" + res.status + ")");
        const data = await res.json();
        if (!data.reply) throw new Error("Empty response from server");

        hideThinking();
        const chat = getActiveChat();
        chat.messages.push({ role:"assistant", text: data.reply });
        saveChats();
        appendMessageEl("assistant", data.reply);
        scrollToBottom();
        setStatus("online");

    }catch(err){
        hideThinking();
        const isAbort = err.name === "AbortError";
        if (!isAbort){
            const chat = getActiveChat();
            const msgText = /fetch|network|failed/i.test(err.message)
                ? "Couldn't reach DeepSINKY's server. Check your connection and try again."
                : err.message;
            chat.messages.push({ role:"assistant", text: msgText, error:true });
            saveChats();
            appendMessageEl("assistant", msgText, true);
            scrollToBottom();
            setStatus("offline");
        }
    }finally{
        setGenerating(false);
        controller = null;
    }
}

sendBtn.addEventListener("click", () => {
    if (generating){
        if (controller) controller.abort();
        hideThinking();
        setGenerating(false);
        return;
    }
    handleSend();
});

promptInput.addEventListener("input", () => {
    promptInput.style.height = "auto";
    promptInput.style.height = Math.min(promptInput.scrollHeight, 180) + "px";
    if (!generating) sendBtn.disabled = promptInput.value.trim().length === 0;
});
promptInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        handleSend();
    }
});



/* Starter prompts fill the composer for the user to edit/send —
   real, working, no dead buttons. */
starters.addEventListener("click", (e) => {
    const btn = e.target.closest(".starter");
    if (!btn) return;
    promptInput.value = btn.dataset.prompt;
    promptInput.focus();
    promptInput.dispatchEvent(new Event("input"));
    const len = promptInput.value.length;
    promptInput.setSelectionRange(len, len);
});

/* ==========================================================
   SERVER STATUS CHECK (real ping, not decorative)
========================================================== */
function setStatus(state){
    statusDot.dataset.state = state;
    statusLabel.textContent = state === "online" ? "Online" : state === "busy" ? "Connecting…" : "Offline";
}
async function pingServer(){
    setStatus("busy");
    try{
        // A reachable server (even one that replies with a 4xx/5xx to
        // this throwaway probe) still means the network path is up —
        // only an actual fetch failure means truly offline.
        await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:"{}" });
        setStatus("online");
    }catch(e){
        setStatus("offline");
    }
}
pingServer();

/* ==========================================================
   INIT
========================================================== */
renderHistory("");
renderActiveChat();
setGenerating(false);

})();
</script>
</body>
</html>
