<!DOCTYPE html>
<html lang="en">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSINKY</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>

/* ===== BODY ===== */
body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
  font-size:15px;
  line-height:1.6;
  letter-spacing:0.2px;
  background:#0f0f0f;
  color:white;
  height:100vh;
}
 b{
  font-size:16px;
  font-weight:600;
  color:#ffffff;
 }

/* ===== SIDEBAR ===== */
.sidebar{
  width:260px;
  background:#202123;
  padding:10px;
  overflow-y:auto;

  position:fixed;
  top:0;
  left:0;

  transform:translateX(-100%);   /* 🔥 MAIN FIX */
  transition:0.3s;
}
.sidebar.open{ left:0; }

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
}
.overlay.show{ display:block; }

/* ===== MAIN ===== */
.main{
  display:flex;
  flex-direction:column;
  height:100vh;   /* 🔥 FINAL FIX */
}

/* ===== HEADER ===== */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  border-bottom:1px solid #333;
}
/* MENU */
.menu{
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.line{
  height:2px;
  background:white;
  border-radius:2px;
}

/* FULL LINE */
.line.full{
  width:22px;
}

/* HALF LINE */
.line.half{
  width:12px;
}

/* BRAND (LOGO + TEXT) */
.brand{
  display:flex;
  align-items:center;
  gap:8px;
}

.logo-img{
  width:28px;
  height:28px;
  object-fit:contain;
}

.title{
  font-weight:bold;
  font-size:18px;
}

/* LOGIN */
.login-btn{
  background:#19c37d;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

/* ===== CHAT ===== */
 .chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  }
  .message{
  margin:8px 0;
  }
  .message{
  margin:10px 0;
  padding:10px 14px;
  border-radius:18px;
  max-width:fit-content;   /* 🔥 auto size */
  width:auto;
  word-wrap:break-word;
  line-height:1.4;
}

/* 👤 USER BUBBLE */
.user{
  background:#2a2b32;
  color:#fff;
  margin-left:auto;
  border-radius:18px;
  padding:10px 14px;
  max-width:75%;

  /* 👇 ADD ये */
  width:fit-content;
  word-wrap:break-word;
  line-height:1.5;
}

/* 🤖 BOT (no bubble clean text) */
.bot{
  background:transparent;
  color:#e5e5e5;
  padding:0;
  margin-left:0;
  margin-right:auto;
  max-width:85%;
}
  pre{
  background:#0d1117;
  padding:14px;
  border-radius:10px;
  overflow:auto;
}

code{
  font-family:Consolas, monospace;
  font-size:13px;
}

  .bot{
  line-height:1.6;
  }
  /* =========================
   🔥 CODE BLOCK STYLE
========================= */

pre {
  background: #0d1117;
  color: #c9d1d9;
  padding: 14px;
  border-radius: 10px;
  overflow: auto;
  margin: 12px 0;
  position: relative;
  font-size: 13px;
  line-height: 1.5;
}

code {
  font-family: "Fira Code", monospace;
  font-size: 13px;
}

pre code {
  background: none !important;
  padding: 0 !important;
}

/* 🎨 COLORS */
.hljs-keyword { color: #ff7b72; }
.hljs-string { color: #a5d6ff; }
.hljs-number { color: #79c0ff; }
.hljs-title { color: #d2a8ff; }
.hljs-variable { color: #ffa657; }
.hljs-comment { color: #8b949e; font-style: italic; }

/* 📋 COPY BUTTON */
.copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  background: #21262d;
  color: #c9d1d9;
  border: none;
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 6px;
  cursor: pointer;
}

.copy-btn:hover {
  background: #30363d;
}

/* ===== INPUT ===== */
.input-area{
  padding:10px;
  display:flex;
  justify-content:center;
  position:sticky;   /* ✅ ADD */
  bottom:0;          /* ✅ ADD */
  background:#0f0f0f; /* ✅ ADD */
}

.input-box{
  width:95%;
  max-width:700px;
  display:flex;
  align-items:center;
  background:#2a2b32;
  border-radius:30px;
  padding:10px;
  gap:10px;
}

.input-box input{
  flex:1;
  background:transparent;
  border:none;
  color:white;
  outline:none;
}

#sendBtn{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:white;
  cursor:pointer;
}

/* LOADING */
.dot{
  display:flex;
  gap:5px;
}

.dot span{
  width:6px;
  height:6px;
  background:#aaa;
  border-radius:50%;
  animation: blink 1s infinite;
}

.dot span:nth-child(2){
  animation-delay:0.3s;
}

@keyframes blink{
  0%,100%{ opacity:0.3; }
  50%{ opacity:1; }
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h3>Chats</h3>
  <div>New Chat</div>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- MAIN -->
<div class="main">

  <!-- HEADER -->
  <div class="header">

    <div class="menu" onclick="toggleSidebar()">
  <span class="line full"></span>
  <span class="line half"></span>
    </div>

    <!-- ✅ FIXED LOGO -->
    <div class="brand">
      <img src="logo.png" class="logo-img">
      <span class="title">DeepSINKY</span>
    </div>

    <button class="login-btn">Login</button>

  </div>

  <!-- CHAT -->
<div class="chat" id="chat"></div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-box">
      <span>+</span>

      <input id="input" placeholder="Ask DeepSINKY">
      <span onclick="voiceInput()">🎤</span>
      <button id="sendBtn">➤</button>
    </div>
  </div>

</div>

<script>

/* CORE */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

sendBtn.onclick = send;

input.addEventListener("keypress", e=>{
  if(e.key === "Enter") send();
});

/* SEND */
async function send(){

  let text = input.value.trim();
  if(!text) return;

  chat.innerHTML += `<div class="message user">${text}</div>`;
  input.value = "";

  let loading = document.createElement("div");
  loading.className = "bot-text loading";
  loading.innerHTML = `
  <div class="dot">
    <span></span>
    <span></span>
  </div>
`;
  chat.appendChild(loading);

  try{
    let res = await fetch("https://deepsinky-server-1.onrender.com/chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ message:text })
    });

    let data = await res.json();
    loading.remove();

    streamText(data.reply || "No response");

  }catch{
    loading.innerText = "Error ❌";
  }
}
  function formatText(text){

  // ✅ bold
  text = text.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");

  // ✅ code block
  text = text.replace(/```([\s\S]*?)```/g, (match, code)=>{
  return `<pre><code>${code}</code></pre>`;
});

  // ✅ inline code
  text = text.replace(/`(.*?)`/g, "<code>$1</code>");

  // ✅ list (proper UL)
  let lines = text.split("\n");
  let formatted = "";
  let inList = false;

  lines.forEach(line=>{
    if(line.startsWith("- ")){
      if(!inList){
        formatted += "<ul>";
        inList = true;
      }
      formatted += `<li>${line.substring(2)}</li>`;
    }else{
      if(inList){
        formatted += "</ul>";
        inList = false;
      }
      formatted += line + "<br><br>";
    }
  });

  if(inList) formatted += "</ul>";

  return formatted;
  }
/* STREAM */
function streamText(text){

  let div = document.createElement("div");
  div.className = "message bot";
  chat.appendChild(div);

  let i = 0;

  function type(){

    if(i < text.length){

      // 🔥 character based (emoji safe)
      let currentText = text.substring(0, i+1);

      div.innerHTML = formatText(currentText);

      i++;
      chat.scrollTop = chat.scrollHeight;

      setTimeout(type, 10);

    }else{

      // ✅ FINAL clean render
      div.innerHTML = formatText(text);

      // ✅ COPY BUTTON
      addCopyButtons();
      hljs.highlightAll();
    }

  }

  type();
}
/* SIDEBAR */
function toggleSidebar(){
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
}

/* VOICE */
function voiceInput(){
  let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.start();
  rec.onresult = e=>{
    input.value = e.results[0][0].transcript;
  }
}

</script>

</body>
<script src="script.js"></script>
</html>
