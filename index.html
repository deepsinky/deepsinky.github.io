<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSINKY</title>

<link rel="stylesheet" href="style.css">

<style>

/* 🔥 FIXED BODY */
body{
  margin:0;
  font-family:Arial;
  background:#202123;
  color:white;
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  border-bottom:1px solid #333;
  font-size:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
}

.logo{
  width:28px;
}

/* CENTER */
.center{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:none;
}

/* MESSAGE */
.message{
  padding:10px 15px;
  margin:10px 0;
  border-radius:10px;
  max-width:70%;
}

.user{
  background:#19c37d;
  margin-left:auto;
}

.bot{
  background:#333;
}

/* 🔥 INPUT FIX */
.input-area{
  position:fixed;
  bottom:10px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
}

.input-box{
  width:95%;
  max-width:600px;
  display:flex;
  align-items:center;
  background:#2a2b32;
  border-radius:30px;
  padding:10px 15px;
}

/* INPUT */
.input-box input{
  flex:1;
  background:transparent;
  border:none;
  color:white;
  padding:10px;
  outline:none;
}

/* BUTTON */
#sendBtn{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:white;
  color:black;
  cursor:pointer;
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="menu-circle" onclick="toggleSidebar()">
    <span></span>
    <span></span>
  </div>

  <div class="brand">
    <img src="logo.png" class="logo">
    <span>DeepSINKY</span>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <input class="search" placeholder="Search">
  <div class="side-item">New chat</div>
  <div class="side-item">Images</div>
  <div class="side-item">Apps</div>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- WELCOME -->
<div class="center" id="welcome">
  <h1>How can I assist you?</h1>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<!-- INPUT -->
<div class="input-area">
  <div class="input-box">

    <span>+</span>

    <input id="input" placeholder="Ask DeepSINKY">

    <span>🎤</span>

    <button id="sendBtn">➤</button>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
