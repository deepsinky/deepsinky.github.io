<title>DeepSINKY — Think. Create. Research. Build.</title>

<style>
/* ==========================================================
   DEEPSINKY — DESIGN TOKENS
========================================================== */
:root{
    color-scheme: dark;
    --bg:#0a0d14;
    --bg-elevated:#10141d;
    --surface:#141924;
    --surface-hover:#1b2230;
    --border:#232b3a;
    --border-soft:#1a212e;

    --text:#f2f4f8;
    --text-secondary:#a8b1c4;
    --text-muted:#616d84;

    --accent-a:#3b82f6;
    --accent-b:#60a5fa;
    --accent-grad:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    --accent-soft:rgba(59,130,246,.14);

    --danger:#f0616f;
    --success:#3ecf8e;

    --radius-s:10px;
    --radius-m:16px;
    --radius-l:22px;
    --radius-pill:999px;

    --header-h:64px;
    --sidebar-w:280px;

    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 8px 24px rgba(0,0,0,.35);
    --shadow-glow:0 0 0 1px rgba(59,130,246,.25), 0 8px 30px rgba(59,130,246,.18);

    --ease:cubic-bezier(.22,1,.36,1);
}

html[data-theme="light"]{
    color-scheme: light;
    --bg:#f7f7fb;
    --bg-elevated:#ffffff;
    --surface:#ffffff;
    --surface-hover:#f0f1f7;
    --border:#e6e7ef;
    --border-soft:#eef0f6;

    --text:#161821;
    --text-secondary:#565b6d;
    --text-muted:#8b90a0;

    --accent-soft:rgba(59,130,246,.09);
    --shadow-1:0 1px 2px rgba(20,20,40,.06);
    --shadow-2:0 12px 28px rgba(20,20,40,.09);
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
    height:100%;
    overscroll-behavior:none;
}

body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition:background .2s var(--ease),color .2s var(--ease);
}

button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
input,textarea{ font-family:inherit; border:none; outline:none; background:none; color:inherit; }
a{ color:var(--accent-b); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:999px; }
::-webkit-scrollbar-thumb:hover{ background:var(--accent-a); }

:focus-visible{ outline:2px solid var(--accent-a); outline-offset:2px; }

@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}



/* ==========================================================
   APP SHELL
========================================================== */
#app{
    position:relative;
    display:flex;
    width:100%;
    height:100dvh;
}

/* ---------- Sidebar ---------- */
.sidebar{
    position:fixed;
    inset:0 auto 0 0;
    width:var(--sidebar-w);
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg-elevated);
    border-right:1px solid var(--border-soft);
    z-index:60;
    transform:translateX(0);
    transition:transform .28s var(--ease);
}
.sidebar[data-open="false"]{ transform:translateX(-100%); }

.sidebar-top{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px;
    border-bottom:1px solid var(--border-soft);
}
.brand{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
}
.brand-mark{ width:30px; height:30px; flex-shrink:0; }
.brand-name{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:-.01em;
    white-space:nowrap;
}
.icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    transition:background .15s var(--ease), color .15s var(--ease);
    flex-shrink:0;
}
.icon-btn:hover{ background:var(--surface-hover); color:var(--text); }
.icon-btn svg{ width:18px; height:18px; }

.new-chat-btn{
    display:flex; align-items:center; gap:10px;
    margin:12px;
    padding:11px 14px;
    border-radius:var(--radius-m);
    background:var(--accent-grad);
    color:#fff;
    font-weight:600;
    font-size:.9rem;
    box-shadow:var(--shadow-1);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
}
.new-chat-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-glow); }
.new-chat-btn svg{ width:16px; height:16px; }

.sidebar-search{
    display:flex; align-items:center; gap:8px;
    margin:0 12px 10px;
    padding:9px 12px;
    border-radius:var(--radius-s);
    background:var(--surface);
    border:1px solid var(--border-soft);
}
.sidebar-search svg{ width:15px; height:15px; color:var(--text-muted); flex-shrink:0; }
.sidebar-search input{ flex:1; font-size:.85rem; color:var(--text); }
.sidebar-search input::placeholder{ color:var(--text-muted); }

.history{
    flex:1;
    overflow-y:auto;
    padding:4px 8px 8px;
    display:flex;
    flex-direction:column;
    gap:2px;
}
.history-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    padding:40px 20px;
    color:var(--text-muted);
    text-align:center;
    font-size:.83rem;
}
.history-item{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:10px 10px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    font-size:.85rem;
    text-align:left;
    transition:background .15s var(--ease), color .15s var(--ease);
    position:relative;
}
.history-item:hover{ background:var(--surface-hover); color:var(--text); }
.history-item[data-active="true"]{ background:var(--accent-soft); color:var(--text); }
.history-item span{
    flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.history-item .del{
    opacity:0; width:26px; height:26px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:7px;
}
.history-item:hover .del{ opacity:1; }
.history-item .del:hover{ background:rgba(240,97,111,.15); color:var(--danger); }
.history-item .del svg{ width:14px; height:14px; }

.sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    gap:8px;
}
.theme-toggle{
    display:flex; align-items:center; gap:10px;
    flex:1;
    padding:10px 12px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    font-size:.83rem;
    font-weight:600;
    transition:background .15s var(--ease);
}
.theme-toggle:hover{ background:var(--surface-hover); color:var(--text); }
.theme-toggle svg{ width:16px; height:16px; }


/* ---------- Overlay (mobile sidebar) ---------- */
.overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(2px);
    z-index:55;
    opacity:0; pointer-events:none;
    transition:opacity .25s var(--ease);
}
.overlay[data-active="true"]{ opacity:1; pointer-events:auto; }

/* ---------- Main ---------- */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100dvh;
    min-width:0;
    margin-left:var(--sidebar-w);
    transition:margin-left .28s var(--ease);
}
.main[data-full="true"]{ margin-left:0; }

.header{
    display:flex; align-items:center; gap:10px;
    height:var(--header-h);
    padding:0 16px;
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0;
}
.header .title{
    flex:1;
    font-weight:600;
    font-size:.92rem;
    color:var(--text-secondary);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.status-pill{
    display:flex; align-items:center; gap:6px;
    padding:5px 10px;
    border-radius:var(--radius-pill);
    background:var(--surface);
    border:1px solid var(--border-soft);
    font-size:.72rem;
    font-weight:600;
    color:var(--text-secondary);
    flex-shrink:0;
}
.status-dot{ width:6px; height:6px; border-radius:50%; background:var(--success); }
.status-dot[data-state="offline"]{ background:var(--text-muted); }
.status-dot[data-state="busy"]{ background:#f5b942; animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }

/* ---------- Chat area ---------- */
.chat-scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}
.chat-inner{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
    gap:22px;
}

/* ---------- Welcome ---------- */
.welcome{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
    min-height:calc(100dvh - var(--header-h) - 96px);
}
.welcome-mark{ width:58px; height:58px; margin-bottom:22px; }
.welcome h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(1.7rem,4.4vw,2.6rem);
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.15;
}
.welcome h1 em{
    font-style:normal;
    background:var(--accent-grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.welcome p{
    margin-top:12px;
    color:var(--text-secondary);
    font-size:.98rem;
}
.starters{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:34px;
    width:100%;
    max-width:560px;
}
.starter{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    padding:15px 16px;
    border-radius:var(--radius-m);
    background:var(--surface);
    border:1px solid var(--border-soft);
    text-align:left;
    transition:border-color .18s var(--ease), transform .18s var(--ease), background .18s var(--ease);
}
.starter:hover{ border-color:var(--accent-a); transform:translateY(-2px); background:var(--surface-hover); }
.starter strong{ font-size:.85rem; font-weight:600; }
.starter span{ font-size:.78rem; color:var(--text-muted); }
@media (max-width:520px){ .starters{ grid-template-columns:1fr; } }

/* ---------- Messages ---------- */
.msg{
    display:flex;
    gap:12px;
    align-items:flex-start;
    animation:msgIn .25s var(--ease);
}
@keyframes msgIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.msg.user{ flex-direction:row-reverse; }
.avatar{
    width:30px; height:30px; border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.7rem; font-weight:700;
}
.msg.user .avatar{ background:var(--surface-hover); color:var(--text-secondary); }
.msg.assistant .avatar{ background:var(--accent-grad); color:#fff; }

.bubble-col{
    display:flex; flex-direction:column; gap:6px;
    max-width:86%;
    min-width:0;
}

.lb-row button:first-child:not(:last-child){background:#3b82f6;color:#fff}
.chip{max-width:230px}
.chip .ct,.att-file .ct{display:flex;flex-direction:column;min-width:0;cursor:pointer}
.chip b,.att-file b{font-weight:600;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small,.att-file small{color:var(--text-muted);font-size:.7rem}
.chip.busy small{animation:pulse 1.2s infinite}
.msg-atts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-bottom:6px}
.att-img{width:150px;height:150px;border-radius:16px;overflow:hidden;background:var(--surface)}
.att-img img{width:100%;height:100%;object-fit:cover}
.att-file{display:flex;align-items:center;gap:10px;max-width:240px;padding:10px 14px;border-radius:16px;background:var(--surface);text-align:left;color:var(--text)}
.att-file svg{width:24px;height:24px;flex-shrink:0}
.bubble.clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.more-text{display:block;margin:4px 0 0 auto;font-size:.82rem;color:#60a5fa;font-weight:600}
.msg.user .bubble{white-space:pre-wrap;overflow-wrap:anywhere}

.logo-img{width:76px;height:76px;object-fit:contain;mix-blend-mode:multiply}
html[data-theme="dark"] .logo-img{filter:invert(1);mix-blend-mode:screen}
</style>
</head>

<div id="app">

    <div class="overlay" id="overlay" data-active="false"></div>

    <!-- ================= SIDEBAR ================= -->

            <button class="round-btn" id="searchToggle" type="button" aria-label="Search chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
            <button class="round-btn sb-close" id="closeSidebarBtn" type="button" aria-label="Close sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

        </div>
        <div class="sb-bottom">
            <button class="chat-pill" id="newChatBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg> Chat</button>
            <div class="sb-spacer"></div>
            <button class="round-btn" id="themeToggle" type="button" aria-label="Theme: Auto">
                <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
                <span class="sr-only" id="themeLabel">Auto</span>
            </button>
            <button class="avatar-btn" id="accountBtn" type="button" aria-label="Account"><span>G</span></button>
        </div>
    </aside>

        <div class="sheet-head"><button class="sheet-x" id="sheetClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><h3>Add to chat</h3></div>
        <div class="sheet-tiles">
            <button class="tile" id="pickCamera" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>Camera</button>
            <button class="tile" id="pickPhotos" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg></span>Photos</button>
            <button class="tile" id="pickFiles" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M12 17v-6M9 13l3-3 3 3"/></svg></span>Files</button>
        </div>
        <button class="sheet-row" type="button" data-panel="projects"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></span><span class="txt"><strong>Add to project</strong><em>None</em></span></button><button class="sheet-row" type="button" data-panel="web-search"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg></span><span class="txt"><strong>Web search</strong></span><span class="sw"></span></button><button class="sheet-row" type="button" data-panel="connectors"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/></svg></span><span class="txt"><strong>Connectors</strong></span></button><button class="sheet-row" type="button" data-panel="memory"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5M12 8v4l3 2"/></svg></span><span class="txt"><strong>Memory</strong></span></button>
    </div>
    <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
    <input type="file" id="filePhotos" accept="image/*" multiple hidden>
    <input type="file" id="fileAny" multiple hidden>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
(function(){
"use strict";


/* ==========================================================
   CONFIG
========================================================== */
const API_URL = "https://deepsinky-server-1.onrender.com/chat";
const STORAGE_KEY = "deepsinky_chats_v1";
const THEME_KEY = "deepsinky_theme_v2";

/* ==========================================================
   DOM
========================================================== */
const $ = (id) => document.getElementById(id);
const sidebar = $("sidebar"), overlay = $("overlay"), main = $("main");
const openSidebarBtn = $("openSidebarBtn"), closeSidebarBtn = $("closeSidebarBtn");
const newChatBtn = $("newChatBtn"), searchInput = $("searchInput"), historyEl = $("history");
const themeToggle = $("themeToggle"), themeIcon = $("themeIcon"), themeLabel = $("themeLabel");
const chatScroll = $("chatScroll"), chatInner = $("chatInner"), welcome = $("welcome"), starters = $("starters");
const promptInput = $("promptInput"), sendBtn = $("sendBtn"), sendIcon = $("sendIcon");
const chatTitle = $("chatTitle"), statusDot = $("statusDot"), statusLabel = $("statusLabel");
const toastStack = $("toastStack"), micBtn = $("micBtn");

marked.setOptions({ breaks:true });

/* ==========================================================
   STATE
========================================================== */
let chats = loadChats();
let activeId = chats.length ? chats[0].id : null;
let generating = false;
let controller = null;
let rec = null, listening = false;

function loadChats(){
    try{
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
}
function saveChats(){
    for (let n = 0; n < 40; n++){
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); return; }
        catch(e){
            let done = false;
            for (const c of chats.slice().reverse()){
                for (const m of c.messages){
                    for (const a of (m.atts || [])){
                        if (a.text && a.text.length > 3000 && !a.cut){ a.text = a.text.slice(0, 3000); a.cut = 1; done = true; break; }
                    }
                    if (done) break;
                }
                if (done) break;
            }
            if (!done){ showToast("Storage full - delete some old chats"); return; }
        }
    }
}
function getActiveChat(){
    return chats.find(c => c.id === activeId) || null;
}

/* ==========================================================
   TOAST
========================================================== */
window.showToast = function(message){
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = message;
    toastStack.appendChild(t);
    setTimeout(() => t.remove(), 2800);
};

/* ==========================================================
   THEME
========================================================== */
const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
const THEME_ICONS = {
    auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/>',
    light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    dark:'<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>'
};
function getThemePref(){
    const v = localStorage.getItem(THEME_KEY);
    return (v === "light" || v === "dark") ? v : "auto";
}
function applyTheme(pref){
    const resolved = pref === "auto" ? (darkMQ.matches ? "dark" : "light") : pref;
    document.documentElement.setAttribute("data-theme", resolved);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = resolved === "dark" ? "#000000" : "#ffffff";
    const label = pref === "auto" ? "Auto" : pref === "dark" ? "Dark" : "Light";
    themeLabel.textContent = label;
    themeToggle.setAttribute("aria-label", "Theme: " + label);
    themeIcon.innerHTML = THEME_ICONS[pref];
    if (pref === "auto") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, pref);
}
/* Auto = follow the device's dark/light setting live */
darkMQ.addEventListener("change", () => { if (getThemePref() === "auto") applyTheme("auto"); });
themeToggle.addEventListener("click", () => {
    const order = ["auto","light","dark"];
    const next = order[(order.indexOf(getThemePref()) + 1) % 3];
    applyTheme(next);
    showToast("Theme: " + (next === "auto" ? "Auto (follows your device)" : next === "dark" ? "Dark" : "Light"));
});
applyTheme(getThemePref());

/* ==========================================================
   SIDEBAR (mobile)
========================================================== */
function isMobile(){ return window.innerWidth <= 860; }
function setSidebar(open){
    sidebar.dataset.open = open ? "true" : "false";
    overlay.dataset.active = (open && isMobile()) ? "true" : "false";
    main.dataset.full = (!open) ? "true" : "false";
}
openSidebarBtn.addEventListener("click", () => setSidebar(true));
closeSidebarBtn.addEventListener("click", () => setSidebar(false));
overlay.addEventListener("click", () => setSidebar(false));
if (isMobile()) setSidebar(false);
window.addEventListener("resize", () => { if(!isMobile()) overlay.dataset.active="false"; });

/* ==========================================================
   RENDER: HISTORY LIST
========================================================== */
function closeChatMenu(){ const m = document.getElementById("chatMenu"); if (m) m.remove(); }
function openChatMenu(anchor, chat){
    closeChatMenu();
    const m = document.createElement("div");
    m.className = "chat-menu"; m.id = "chatMenu"; m.setAttribute("role","menu");
    const add = (label, fn, cls) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = label; if (cls) b.className = cls;
        b.addEventListener("click", () => { closeChatMenu(); fn(); });
        m.appendChild(b);
    };
    add(chat.pinned ? "Unpin" : "Pin", () => { chat.pinned = !chat.pinned; saveChats(); renderHistory(searchInput.value); });
    add("Rename", () => {
        const t = prompt("Rename chat", chat.title);
        if (t && t.trim()){
            chat.title = t.trim().slice(0, 80);
            saveChats(); renderHistory(searchInput.value);
            if (chat.id === activeId) chatTitle.textContent = chat.title;
        }
    });
    add("Delete", () => { if (confirm("Delete this chat?")) deleteChat(chat.id); }, "danger");
    document.body.appendChild(m);
    const r = anchor.getBoundingClientRect();
    m.style.top = Math.max(8, Math.min(r.bottom + 4, window.innerHeight - m.offsetHeight - 8)) + "px";
    m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, window.innerWidth - m.offsetWidth - 8)) + "px";
    setTimeout(() => document.addEventListener("click", closeChatMenu, { once:true }), 0);
}

function historyItem(chat){
    const row = document.createElement("div");
    row.className = "history-item";
    row.setAttribute("role","button"); row.tabIndex = 0;
    row.dataset.active = (chat.id === activeId) ? "true" : "false";
    const label = document.createElement("span");
    label.textContent = chat.title;
    const more = document.createElement("button");
    more.type = "button"; more.className = "more-btn"; more.setAttribute("aria-label","Chat options");
    more.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
    more.addEventListener("click", (e) => { e.stopPropagation(); openChatMenu(more, chat); });
    row.append(label, more);
    const open = () => {
        activeId = chat.id;
        renderActiveChat();
        renderHistory(searchInput.value);
        if (isMobile()) setSidebar(false);
    };
    row.addEventListener("click", open);
    row.addEventListener("keydown", (e) => { if (e.target === row && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); open(); } });
    return row;
}

function renderHistory(filter){
    filter = (filter || "").toLowerCase().trim();
    historyEl.innerHTML = "";
    const match = c => !filter || c.title.toLowerCase().includes(filter) ||
        c.messages.some(m => !m.error && m.text.toLowerCase().includes(filter));
    const vis = chats.filter(match);
    if (!vis.length){
        historyEl.innerHTML = '<div class="history-empty"><span></span></div>';
        historyEl.querySelector("span").textContent = filter ? "No chats match your search." : "No chats yet — start one below.";
        return;
    }
    const section = (name, list) => {
        if (!list.length) return;
        const h = document.createElement("div");
        h.className = "section-label"; h.textContent = name;
        historyEl.appendChild(h);
        list.forEach(c => historyEl.appendChild(historyItem(c)));
    };
    section("Pinned", vis.filter(c => c.pinned));
    section("Recents", vis.filter(c => !c.pinned));
}
searchInput.addEventListener("input", () => renderHistory(searchInput.value));

function deleteChat(id){
    chats = chats.filter(c => c.id !== id);
    saveChats();
    if (activeId === id){
        activeId = chats.length ? chats[0].id : null;
        renderActiveChat();
    }
    renderHistory(searchInput.value);
                    }


/* ==========================================================
   NEW CHAT
========================================================== */
function createChat(){
    const chat = { id: "c" + Date.now(), title: "New chat", messages: [] };
    chats.unshift(chat);
    activeId = chat.id;
    saveChats();
    renderHistory(searchInput.value);
    renderActiveChat();
    if (isMobile()) setSidebar(false);
    promptInput.focus();
}
newChatBtn.addEventListener("click", createChat);

/* ==========================================================
   RENDER: ACTIVE CHAT
========================================================== */
function renderActiveChat(){
    stopSpeaking();
    const chat = getActiveChat();
    chatInner.innerHTML = "";

    if (!chat || !chat.messages.length){
        chatTitle.textContent = "New chat";
        chatInner.appendChild(welcome);
        return;
    }

    chatTitle.textContent = chat.title;
    chat.messages.forEach((m,i) => appendMessageEl(m, i));
    scrollToBottom();
}

function scrollToBottom(){
    requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; });
}

function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
}

const ICON = {
    copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
    regen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>'
};
Object.assign(ICON, {
    share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg>',
    play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>',
    stop:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
    up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4v-9zM7 11l4-7a2 2 0 012 2v4h5.5a2 2 0 012 2.3l-1.2 6A2 2 0 0117.3 20H7"/></svg>',
    down:'<svg style="transform:scaleY(-1)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4v-9zM7 11l4-7a2 2 0 012 2v4h5.5a2 2 0 012 2.3l-1.2 6A2 2 0 0117.3 20H7"/></svg>'
});

/* Share: native share sheet when available, otherwise copy */
function shareText(t){
    if (navigator.share){ navigator.share({ text:t }).catch(() => {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => showToast("Sharing isn't supported here — copied instead"), () => showToast("Sharing isn't supported here"));
    else showToast("Sharing isn't supported here");
}

/* Read aloud: browser text-to-speech, tap again to stop */
let speakingBtn = null;
function stopSpeaking(){
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (speakingBtn){ speakingBtn.innerHTML = ICON.play; speakingBtn.title = "Read aloud"; speakingBtn = null; }
}
function speak(btn, bubble){
    if (!("speechSynthesis" in window)){ showToast("Read aloud isn't supported in this browser"); return; }
    if (speakingBtn === btn){ stopSpeaking(); return; }
    stopSpeaking();
    const text = (bubble.innerText || bubble.textContent || "").trim();
    if (!text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = /[\u0900-\u097F]/.test(text) ? "hi-IN" : (navigator.language || "en-US");
    u.onend = u.onerror = () => { if (speakingBtn === btn) stopSpeaking(); };
    speakingBtn = btn; btn.innerHTML = ICON.stop; btn.title = "Stop reading";
    try{ speechSynthesis.speak(u); }catch(e){ stopSpeaking(); showToast("Couldn't start read aloud"); }
}

function fmtTime(ts){ return ts ? new Date(ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : ""; }
function copyText(t){
    if (!navigator.clipboard){ showToast("Copy not supported here"); return; }
    navigator.clipboard.writeText(t).then(() => showToast("Copied to clipboard"), () => showToast("Copy failed"));
}
function actionBtn(title, icon, cls, fn){
    const b = document.createElement("button");
    b.type = "button"; b.title = title; b.setAttribute("aria-label", title);
    if (cls) b.className = cls;
    b.innerHTML = icon;
    b.addEventListener("click", fn);
    return b;
}

/* Markdown -> sanitized DOM, with highlighted code + copy-code buttons */
function renderMarkdown(text){
    const box = document.createElement("div");
    if (!window.DOMPurify){ box.textContent = text; box.style.whiteSpace = "pre-wrap"; return box; }
    box.innerHTML = DOMPurify.sanitize(marked.parse(text));
    box.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
    box.querySelectorAll("pre").forEach(pre => {
        const code = pre.querySelector("code");
        if (!code) return;
        const lang = ((code.className.match(/language-([\w+-]+)/) || [])[1]) || "";
        const raw = code.textContent;
        if (window.hljs && lang && hljs.getLanguage(lang)){ try{ hljs.highlightElement(code); }catch(e){} }
        const wrap = document.createElement("div");
        wrap.className = "codeblock";
        const head = document.createElement("div");
        head.className = "code-head";
        const label = document.createElement("span");
        label.textContent = lang || "code";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.innerHTML = ICON.copy + "<em>Copy code</em>";
        btn.addEventListener("click", () => copyText(raw));
        head.append(label, btn);
        pre.replaceWith(wrap);
        wrap.append(head, pre);
    });
    return box;
}

function appendMessageEl(m, idx){
    const role = m.role, text = m.text, isError = m.error;
    const msg = document.createElement("div");
    msg.className = "msg " + role;
    msg.dataset.idx = idx;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "Y" : "S";

    const col = document.createElement("div");
    col.className = "bubble-col";

    if (isError){
        const err = document.createElement("div");
        err.className = "error-bubble";
        err.innerHTML = `<span>${escapeHtml(text)}</span><button type="button">Retry</button>`;
        err.querySelector("button").addEventListener("click", () => {
            const chat = getActiveChat();
            if (!chat || generating) return;
            while (chat.messages.length && chat.messages[chat.messages.length-1].error) chat.messages.pop();
            saveChats();
            renderActiveChat();
            sendToAPI();
        });
        col.appendChild(err);
    } else {
        if (m.atts && m.atts.length){
            const arow = document.createElement("div"); arow.className = "msg-atts";
            m.atts.forEach(a => arow.appendChild(attCard(a)));
            col.appendChild(arow);
        }
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (role === "assistant") bubble.replaceChildren(...renderMarkdown(text).childNodes);
        else bubble.textContent = text;
        if (role === "assistant" || text) col.appendChild(bubble);
        if (role === "user" && text.length > 700){
            bubble.classList.add("clamp");
            const mb = document.createElement("button"); mb.type = "button"; mb.className = "more-text"; mb.textContent = "Show more";
            mb.onclick = () => { const c = bubble.classList.toggle("clamp"); mb.textContent = c ? "Show more" : "Show less"; };
            col.appendChild(mb);
        }

        const actions = document.createElement("div");
        actions.className = "msg-actions";
        actions.appendChild(actionBtn("Copy", ICON.copy, "", () => copyText(text)));
        if (role === "user"){
            actions.appendChild(actionBtn("Edit message", ICON.edit, "", () => startEdit(msg, idx)));
        } else {
            chatInner.querySelectorAll(".regen").forEach(b => b.remove());
            actions.appendChild(actionBtn("Share", ICON.share, "", () => shareText(text)));
            const sp = actionBtn("Read aloud", ICON.play, "", () => speak(sp, bubble));
            actions.appendChild(sp);
            const up = actionBtn("Good response", ICON.up, m.fb === "up" ? "fb-on" : "", () => setFb("up"));
            const down = actionBtn("Bad response", ICON.down, m.fb === "down" ? "fb-on" : "", () => setFb("down"));
            const setFb = (v) => {
                m.fb = (m.fb === v) ? null : v;
                saveChats();
                up.classList.toggle("fb-on", m.fb === "up");
                down.classList.toggle("fb-on", m.fb === "down");
                showToast(m.fb ? "Thanks for the feedback" : "Feedback removed");
            };
            actions.append(up, down);
            const chat = getActiveChat();
            if (chat && idx === chat.messages.length - 1){
                actions.appendChild(actionBtn("Regenerate response", ICON.regen, "regen", regenerate));
            }
        }
        if (m.ts){
            const t = document.createElement("span");
            t.className = "msg-time";
            t.textContent = fmtTime(m.ts);
            actions.appendChild(t);
        }
        col.appendChild(actions);
    }

    msg.appendChild(avatar);
    msg.appendChild(col);
    chatInner.appendChild(msg);
    return msg;
}

function startEdit(msgEl, idx){
    if (generating){ showToast("Stop the reply first, then edit"); return; }
    const chat = getActiveChat();
    if (!chat || !chat.messages[idx]) return;
    msgEl.classList.add("editing");
    const col = msgEl.querySelector(".bubble-col");
    col.innerHTML = "";
    const ta = document.createElement("textarea");
    ta.className = "edit-area";
    ta.value = chat.messages[idx].text;
    ta.setAttribute("aria-label", "Edit your message");
    const row = document.createElement("div");
    row.className = "edit-row";
    const cancel = document.createElement("button");
    cancel.type = "button"; cancel.textContent = "Cancel";
    const save = document.createElement("button");
    save.type = "button"; save.className = "primary"; save.textContent = "Save & send";
    row.append(cancel, save);
    col.append(ta, row);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);

    const doSave = () => {
        const t = ta.value.trim();
        if (!t) return;
        const oa = chat.messages[idx].atts || [];
        chat.messages = chat.messages.slice(0, idx);
        chat.messages.push({ role:"user", text:t, atts:oa, ts:Date.now() });
        if (idx === 0) chat.title = autoTitle(t);
        saveChats();
        renderHistory(searchInput.value);
        chatTitle.textContent = chat.title;
        renderActiveChat();
        sendToAPI();
    };
    cancel.addEventListener("click", () => renderActiveChat());
    save.addEventListener("click", doSave);
    ta.addEventListener("keydown", (e) => {
        if (e.key === "Escape") renderActiveChat();
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); doSave(); }
    });
}

function regenerate(){
    const chat = getActiveChat();
    if (!chat || generating) return;
    while (chat.messages.length && chat.messages[chat.messages.length-1].role === "assistant") chat.messages.pop();
    saveChats();
    renderActiveChat();
    sendToAPI();
}

/* ==========================================================
   THINKING INDICATOR
========================================================== */
let thinkingEl = null;
function showThinking(){
    thinkingEl = document.createElement("div");
    thinkingEl.className = "msg assistant";
    thinkingEl.innerHTML = `<div class="avatar">S</div>
        <div class="bubble-col"><div class="bubble thinking"><span></span><span></span><span></span></div></div>`;
    chatInner.appendChild(thinkingEl);
    scrollToBottom();
}

   SEND / STREAM / API
========================================================== */
function autoTitle(text){
    const clean = text.trim().replace(/\s+/g," ");
    return clean.length > 42 ? clean.slice(0,42) + "…" : (clean || "New chat");
}

const BTN_ICONS = {
    send:'<path d="M12 19V5M5 12l7-7 7 7"/>',
    voice:'<path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>',
    stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>'
};
/* Round button: waveform/voice (empty) -> send (typing) -> stop (generating). Mic = dictation. */
function updateSendBtn(){
    const hasText = promptInput.value.trim().length > 0 || (typeof attachments !== "undefined" && attachments.length > 0);
    const mode = generating ? "stop" : hasText ? "send" : "voice";
    sendBtn.dataset.mode = mode;
    sendBtn.dataset.stop = generating ? "true" : "false";
    sendBtn.disabled = false;
    sendIcon.innerHTML = BTN_ICONS[mode];
    sendBtn.setAttribute("aria-label", { send:"Send", voice:"Voice conversation", stop:"Stop" }[mode]);
    micBtn.hidden = generating || (hasText && !listening);
    micBtn.dataset.on = listening ? "true" : "false";
    micBtn.setAttribute("aria-label", listening ? "Stop dictation" : "Dictate");
}
function setGenerating(state){
    generating = state;
    updateSendBtn();
}

async function handleSend(){
    const text = promptInput.value.trim();
    if (generating) return;
    if (attachments.some(a => a.busy)){ showToast("Still reading your files…"); return; }
    if (!text && !attachments.length) return;
    const pend = attachments.map(a => a.ocr).filter(Boolean);
    if (pend.length){ showToast("Reading text in image…"); await Promise.race([Promise.all(pend), new Promise(r => setTimeout(r, 12000))]); }
    const atts = attachments.map(toAtt);
    lastImgs = attachments.filter(a => a.data).map(a => a.data);
    attachments = []; renderAttach();

    let chat = getActiveChat();
    if (!chat){
        chat = { id: "c" + Date.now(), title: "New chat", messages: [] };
        chats.unshift(chat);
        activeId = chat.id;
    }
    if (chat.messages.length === 0){
        chat.title = autoTitle(text || (atts[0] && atts[0].name) || "New chat");
    }

    chat.messages.push({ role:"user", text, atts, ts:Date.now() });
    if (chatInner.contains(welcome)) chatInner.innerHTML = "";
    appendMessageEl(chat.messages[chat.messages.length-1], chat.messages.length-1);
    scrollToBottom();

    promptInput.value = "";
    promptInput.style.height = "auto";
    setGenerating(true);

    saveChats();
    renderHistory(searchInput.value);
    chatTitle.textContent = chat.title;

    await sendToAPI();
}

/* Conversation context: send the recent history (bounded by size), oldest dropped first. */
function buildHistory(chat){
    const MAX_CHARS = 80000;
    const out = [];
    let used = 0;
    for (let i = chat.messages.length - 1; i >= 0; i--){
        const m = chat.messages[i];
        if (m.error) continue;
        const cc = m.role === "user" ? compose(m) : m.text;
        used += cc.length;
        if (used > MAX_CHARS && out.length) break;
        out.unshift({ role:m.role, content:cc });
    }
    while (out.length && out[0].role !== "user") out.shift();
    return out;
}

async function sendToAPI(){
    stopSpeaking();
    const chat = getActiveChat();
    if (!chat) return;
    const msgs = buildHistory(chat);
    const last = msgs[msgs.length - 1];
    if (!last || last.role !== "user"){ setGenerating(false); return; }

    setGenerating(true);
    controller = new AbortController();
    showThinking();

    const push = (m) => {
        m.ts = Date.now();
        chat.messages.push(m);
        saveChats();
        if (getActiveChat() === chat){
            appendMessageEl(m, chat.messages.length - 1);
            scrollToBottom();
        }
    };

    try{
        const res = await fetch(API_URL, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            // "message" keeps the current server working; "history"/"messages" carry the context.
            body: JSON.stringify({ message:sendMsg(last.content), history:msgs.slice(0,-1), messages:msgs.slice(0,-1).concat([{ role:"user", content:sendMsg(last.content) }]), system:sysPrefix(), web_search:S.web, images:lastImgs }),
            signal: controller.signal
        });

        if (!res.ok) throw new Error(res.status === 413 ? "Message too large for the server - raise its JSON limit: express.json({limit:'30mb'})" : "Server error (" + res.status + ")");
        const data = await res.json();
        if (!data.reply) throw new Error("Empty response from server");

        hideThinking();
        push({ role:"assistant", text:data.reply });
        setStatus("online");

    }catch(err){
        hideThinking();
        if (err.name === "AbortError"){
            push({ role:"assistant", text:"Generation stopped.", error:true });
        } else {
            const msgText = /fetch|network|failed/i.test(err.message)
                ? "Couldn't reach DeepSINKY's server. Check your connection and try again."
                : err.message;
            push({ role:"assistant", text:msgText, error:true });
            setStatus("offline");
        }
    }finally{
        setGenerating(false);
        controller = null;
    }
}

function compose(m){

    (m.atts||[]).forEach(a=>{
        if(a.text) t+="\n\n[Attached "+(a.kind==="paste"?"pasted text":"file: "+a.name)+"]\n"+a.text+"\n[End of attachment]";

const load=src=>new Promise((res,rej)=>{ if(document.querySelector('script[src="'+src+'"]')) return res(); const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
function shrink(file,max,q){
    return new Promise((res,rej)=>{
        const u=URL.createObjectURL(file), im=new Image();
        im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas");
            c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
            c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",q)); };
        im.onerror=()=>{ URL.revokeObjectURL(u); rej(); };
        im.src=u;
    });
}
const words=t=>t.trim()?t.trim().split(/\s+/).length:0;
async function readFile(a){
    const f=a.file, n=f.name.toLowerCase();
    if(f.type.startsWith("image/")){
        a.kind="image"; a.data=await shrink(f,1280,.82); a.thumb=await shrink(f,480,.6); a.url=a.thumb;
        a.ocr=(async()=>{ try{
            await load("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
            const r=await Tesseract.recognize(a.data,"eng"), t=(r.data.text||"").trim();
            if(t.length>15) a.text="Text detected in this image (OCR):\n"+t.slice(0,20000);
        }catch(e){} })();
        return;
    }
    if(n.endsWith(".pdf")){
        await load(CDN+"pdf.js/3.11.174/pdf.min.js");
        pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+"pdf.js/3.11.174/pdf.worker.min.js";
        const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; let t="";
        for(let i=1;i<=d.numPages&&t.length<CAP;i++){ const c=await (await d.getPage(i)).getTextContent(); t+="\n"+c.items.map(x=>x.str).join(" "); }
        a.text=t.trim();
    } else if(n.endsWith(".docx")){
        await load(CDN+"mammoth/1.6.0/mammoth.browser.min.js");
        a.text=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value.trim();
    } else {
        const t=await f.text();
        if(/\u0000/.test(t.slice(0,2000))) throw 0;
        a.text=t;
    }
    if(!a.text) throw 0;
    if(a.text.length>CAP){ a.text=a.text.slice(0,CAP)+"\n…[truncated]"; showToast(a.name+" is very long — first part used"); }
    a.words=words(a.text);
}

function renderAttach(){
    attachRow.innerHTML=""; attachRow.hidden=!attachments.length;
    attachments.forEach((a,i)=>{

function addFiles(list){
    for(const f of list){
        if(attachments.length>=MAX_FILES){ showToast("You can attach up to "+MAX_FILES+" files"); break; }
        if(f.size>MAX_BYTES){ showToast(f.name+" is too large (25 MB max)"); continue; }
        const a={file:f,name:f.name||"file",kind:"file",busy:true};
        attachments.push(a);
        readFile(a).catch(()=>{ showToast("Couldn't read "+a.name); attachments=attachments.filter(x=>x!==a); })
            .finally(()=>{ a.busy=false; renderAttach(); updateSendBtn(); });
    }
    renderAttach(); updateSendBtn();
}
function addPaste(t,name,kind){
    if(t.length>CAP) t=t.slice(0,CAP)+"\n…[truncated]";

P.memory=()=>setP("Memory",'<div class="prow" data-a="tog"><div class="ptxt"><b>Use memory</b><small>Saved facts go with every message</small></div>'+sw(S.memOn)+'</div><div class="form"><input id="mmI" placeholder="Add something to remember…"><button class="pbtn" type="button" data-a="add">Add</button></div>'+(S.mem.length?S.mem.map((m,i)=>'<div class="prow"><div class="ptxt"><b>'+esc(m)+"</b></div>"+del(i)+"</div>").join(""):'<p class="empty">Nothing saved yet.</p>'));
H.memory=(a,b)=>{
    if(a==="tog") S.memOn=!S.memOn;
    if(a==="add"){ const v=$("mmI").value.trim(); if(!v) return; S.mem.push(v.slice(0,300)); }
    if(a==="del") S.mem.splice(+b.dataset.id,1);
    saveS(); P.memory();
};

P.connectors=()=>setP("Connectors",'<div class="form"><input id="cnU" placeholder="https://… web page"><button class="pbtn" type="button" data-a="url">Read web page</button></div>'+prow("clip","","Clipboard","Attach whatever you copied")+prow("files","","Device files","PDF, Word, text, code, CSV…")+prow("cam","","Camera","Take a photo"));
H.connectors=async(a)=>{
    if(a==="files"){ closePanel(); $("fileAny").click(); }
    if(a==="cam"){ closePanel(); $("fileCamera").click(); }
    if(a==="clip"){ try{ const t=await navigator.clipboard.readText(); if(!t.trim()){ showToast("Clipboard is empty"); return; } addPaste(t,"Clipboard"); closePanel(); }catch(e){ showToast("Clipboard access was blocked"); } }
    if(a==="url"){
        let u=$("cnU").value.trim(); if(!u) return; if(!/^https?:\/\//i.test(u)) u="https://"+u;
        showToast("Reading page…");
        try{ const r=await fetch("https://r.jina.ai/"+u); if(!r.ok) throw 0; const t=await r.text(); addPaste(t,new URL(u).hostname,"web"); closePanel(); }
        catch(e){ showToast("Couldn't read that page"); }
    }
};
function syncAvatar(){ const s=document.querySelector("#accountBtn span"); if(s) s.textContent=((S.name||"G").trim()[0]||"G").toUpperCase(); }
P.account=()=>setP("Profile",'<div class="form"><input id="acN" placeholder="Your name" value="'+esc(S.name==="G"?"":S.name)+'"><button class="pbtn" type="button" data-a="save">Save</button></div>'+prow("exp","","Export chats","Download all chats as a file")+prow("clr","","Delete all chats","This can't be undone"));
H.account=(a)=>{
    if(a==="save"){ S.name=$("acN").value.trim()||"G"; saveS(); syncAvatar(); showToast("Saved"); }
    if(a==="exp"){ const u=URL.createObjectURL(new Blob([JSON.stringify(chats,null,1)],{type:"application/json"})), l=document.createElement("a"); l.href=u; l.download="deepsinky-chats.json"; l.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
    if(a==="clr"&&confirm("Delete all chats?")){ chats=[]; activeId=null; saveChats(); renderActiveChat(); renderHistory(""); closePanel(); }
};
function syncWeb(){ const s=document.querySelector('#addSheet [data-panel="web-search"] .sw'); if(s) s.classList.toggle("on",S.web); }
document.querySelectorAll("[data-panel]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.panel;
    if(k==="web-search"){ S.web=!S.web; saveS(); syncWeb(); showToast(S.web?"Web search on":"Web search off"); return; }
    closeSheet(); if(isMobile()) setSidebar(false); openPanel(k);
}));
$("accountBtn").addEventListener("click",()=>openPanel("account"));
syncWeb(); syncAvatar(); refreshProj();


[["pickCamera","fileCamera"],["pickPhotos","filePhotos"],["pickFiles","fileAny"]].forEach(([btn, inp]) => {
    const input = $(inp);
    $(btn).addEventListener("click", () => { closeSheet(); input.click(); });
    input.addEventListener("change", () => { addFiles(input.files); input.value = ""; });
});

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBase = "";
function toggleMic(){
    if (!SpeechRec){ showToast("Voice input isn't supported in this browser"); return; }
    if (listening){ rec.stop(); return; }
    rec = new SpeechRec();
    rec.lang = navigator.language || "en-US";
    rec.interimResults = true;
    rec.continuous = false;
    micBase = promptInput.value ? promptInput.value.replace(/\s*$/, " ") : "";
    rec.onstart = () => { listening = true; updateSendBtn(); };
    rec.onresult = (e) => {
        let t = "";
        for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        promptInput.value = micBase + t;
        promptInput.dispatchEvent(new Event("input"));
    };
    rec.onerror = (e) => {
        showToast(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Microphone permission denied"
            : e.error === "no-speech" ? "Didn't catch anything — try again" : "Voice input error: " + e.error);
    };
    rec.onend = () => { listening = false; updateSendBtn(); };
    try{ rec.start(); }catch(err){ showToast("Couldn't start the microphone"); }
}

renderHistory("");
renderActiveChat();
setGenerating(false);
