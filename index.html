<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSINKY</title>

<style>

body{
margin:0;
font-family:Arial;
background:#202123;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:220px;
background:#171717;
padding:15px;
border-right:1px solid #333;
}

.sidebar h2{
margin-top:0;
}

.newchat{
background:#19c37d;
padding:10px;
border-radius:20px;
text-align:center;
cursor:pointer;
margin-bottom:20px;
}

/* MAIN AREA */

.main{
flex:1;
display:flex;
flex-direction:column;
}

.header{
padding:15px;
border-bottom:1px solid #333;
text-align:center;
font-size:18px;
}

.center{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.center h1{
font-size:28px;
margin-bottom:30px;
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.option{
padding:12px 20px;
border-radius:25px;
border:1px solid #444;
cursor:pointer;
}

.option:hover{
background:#2a2b32;
}

.chat{
flex:1;
overflow-y:auto;
padding:20px;
display:none;
}

.message{
padding:10px 15px;
margin:10px 0;
border-radius:10px;
max-width:70%;
}

.user{
background:#444;
margin-left:auto;
}

.bot{
background:#333;
}

.input-area{
display:flex;
padding:15px;
border-top:1px solid #333;
background:#202123;
}

input{
flex:1;
padding:15px;
border-radius:25px;
border:none;
background:#40414f;
color:white;
outline:none;
}

button{
margin-left:10px;
padding:12px 18px;
border:none;
border-radius:25px;
background:#19c37d;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h2>DeepSINKY</h2>

<div class="newchat" onclick="newChat()">
+ New Chat
</div>

</div>

<!-- MAIN -->

<div class="main">
<body>

<div class="header">

<div class="menu" onclick="toggleSidebar()">☰</div>

<div class="brand">
<img src="logo.png" class="logo">
<span>DeepSINKY</span>
</div>

</div>


<div class="center" id="welcome">

<h1>What can I help with?</h1>

<div class="options">

<div class="option">Create image</div>
<div class="option">Get advice</div>
<div class="option">Summarize text</div>
<div class="option">Make a plan</div>

</div>

</div>

<div class="chat" id="chat"></div>

<div class="input-area">

<input id="input" placeholder="Ask DeepSINKY">

<button onclick="send()">Send</button>

</div>

</div>

<script>

let input = document.getElementById("input")

input.addEventListener("keypress", function(e){
if(e.key==="Enter"){
send()
}
})

function send(){

let text = input.value.trim()

if(text==="") return

document.getElementById("welcome").style.display="none"
document.getElementById("chat").style.display="block"

let chat = document.getElementById("chat")

chat.innerHTML += `<div class="message user">${text}</div>`

setTimeout(()=>{
chat.innerHTML += `<div class="message bot">This is DeepSINKY response.</div>`
chat.scrollTop = chat.scrollHeight
},800)

input.value=""

chat.scrollTop = chat.scrollHeight

}

function newChat(){

document.getElementById("chat").innerHTML=""
document.getElementById("chat").style.display="none"
document.getElementById("welcome").style.display="flex"

}

</script>

</body>
</html>
