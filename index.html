<!DOCTYPE html>
<html lang="en">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSINKY</title>

<style>

/* ===== BODY ===== */
body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#0f0f0f;
  color:white;
  display:flex;
  height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:260px;
  background:#202123;
  padding:10px;
  overflow-y:auto;
  position:fixed;
  left:-260px;
  top:0;
  height:100%;
  transition:0.3s;
}
.sidebar.open{ left:0; }

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
}
.overlay.show{ display:block; }

/* ===== MAIN ===== */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  width:100%;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  border-bottom:1px solid #333;
}

/* MENU */
.menu{
  cursor:pointer;
  font-size:20px;
}

/* BRAND (LOGO + TEXT) */
.brand{
  display:flex;
  align-items:center;
  gap:8px;
}

.logo-img{
  width:28px;
  height:28px;
  object-fit:contain;
}

.title{
  font-weight:bold;
  font-size:18px;
}

/* LOGIN */
.login-btn{
  background:#19c37d;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

/* ===== CHAT ===== */
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.message{
  margin:10px 0;
  max-width:70%;
  padding:10px;
  border-radius:10px;
}

.user{
  background:#19c37d;
  margin-left:auto;
}

.bot{
  background:#2a2b32;
}

/* ===== INPUT ===== */
.input-area{
  padding:10px;
  display:flex;
  justify-content:center;
}

.input-box{
  width:95%;
  max-width:700px;
  display:flex;
  align-items:center;
  background:#2a2b32;
  border-radius:30px;
  padding:10px;
  gap:10px;
}

.input-box input{
  flex:1;
  background:transparent;
  border:none;
  color:white;
  outline:none;
}

#sendBtn{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:white;
  cursor:pointer;
}

/* LOADING */
.loading{
  animation: blink 1s infinite;
}

@keyframes blink{
  0%{opacity:0.2;}
  50%{opacity:1;}
  100%{opacity:0.2;}
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h3>Chats</h3>
  <div>New Chat</div>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- MAIN -->
<div class="main">

  <!-- HEADER -->
  <div class="header">

    <div class="menu" onclick="toggleSidebar()">☰</div>

    <!-- ✅ FIXED LOGO -->
    <div class="brand">
      <img src="logo.png" class="logo-img">
      <span class="title">DeepSINKY</span>
    </div>

    <button class="login-btn">Login</button>

  </div>

  <!-- CHAT -->
  <div class="chat" id="chat"></div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-box">
      <span>+</span>
      <input id="input" placeholder="Ask DeepSINKY">
      <span onclick="voiceInput()">🎤</span>
      <button id="sendBtn">➤</button>
    </div>
  </div>

</div>

<script>

/* CORE */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

sendBtn.onclick = send;

input.addEventListener("keypress", e=>{
  if(e.key === "Enter") send();
});

/* SEND */
async function send(){

  let text = input.value.trim();
  if(!text) return;

  chat.innerHTML += `<div class="message user">${text}</div>`;
  input.value = "";

  let loading = document.createElement("div");
  loading.className = "message bot loading";
  loading.innerText = "Thinking...";
  chat.appendChild(loading);

  try{
    let res = await fetch("https://deepsinky-server-1.onrender.com/chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ message:text })
    });

    let data = await res.json();
    loading.remove();

    streamText(data.reply || "No response");

  }catch{
    loading.innerText = "Error ❌";
  }
}

/* STREAM */
function streamText(text){

  let div = document.createElement("div");
  div.className = "message bot";
  chat.appendChild(div);

  let i = 0;

  function type(){
    if(i < text.length){
      div.innerHTML += text[i];
      i++;
      setTimeout(type, 15);
    }
    chat.scrollTop = chat.scrollHeight;
  }

  type();
}

/* SIDEBAR */
function toggleSidebar(){
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
}

/* VOICE */
function voiceInput(){
  let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.start();
  rec.onresult = e=>{
    input.value = e.results[0][0].transcript;
  }
}

</script>

</body>
<script src="script.js"></script>
</html>
