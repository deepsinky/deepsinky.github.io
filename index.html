<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSINKY</title>

<link rel="stylesheet" href="style.css">

<style>

/* ===== BODY ===== */
body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#0f0f0f;
  color:#e5e5e5;
  display:flex;
  flex-direction:column;
  height:100vh;
  transition:0.3s;
}

/* LIGHT MODE */
body.light{
  background:#ffffff;
  color:#000;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  border-bottom:1px solid #222;
  position:relative;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
}

.logo{
  width:28px;
}

/* MENU */
.menu-circle{
  position:absolute;
  left:15px;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#2a2b32;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* THEME BUTTON */
.theme-btn{
  position:absolute;
  right:15px;
  cursor:pointer;
}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;
  left:-260px;
  top:0;
  width:260px;
  height:100%;
  background:#202123;
  padding:15px;
  transition:0.3s;
  z-index:1000;
}

.sidebar.open{
  left:0;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
}

.overlay.show{
  display:block;
}

/* ===== CENTER ===== */
.center{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* ===== CHAT ===== */
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  padding-bottom:120px;
  display:none;
}

/* ===== MESSAGE ===== */
.message{
  margin:20px 0;
}

/* USER */
.message.user{
  text-align:right;
}

.message.user .text{
  color:#aaa;
}

/* BOT */
.message.bot .text{
  line-height:1.7;
}

/* ===== INPUT ===== */
.input-area{
  position:fixed;
  bottom:0;
  width:100%;
  padding:10px;
  display:flex;
  justify-content:center;
  background:#0f0f0f;
}

.input-box{
  width:95%;
  max-width:700px;
  display:flex;
  align-items:center;
  gap:10px;
}

/* + BUTTON */
.plus{
  font-size:22px;
  background:#2a2b32;
  padding:10px;
  border-radius:50%;
  cursor:pointer;
}

/* INPUT */
.input-box input{
  flex:1;
  background:#1e1e1e;
  border:none;
  border-radius:25px;
  padding:12px;
  color:white;
  outline:none;
}

/* MIC */
.mic{
  background:#2a2b32;
  padding:10px;
  border-radius:50%;
  cursor:pointer;
}

/* SEND */
#sendBtn{
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:white;
  cursor:pointer;
  transition:0.3s;
}

/* GLOW */
#sendBtn:hover{
  box-shadow:0 0 10px #19c37d;
}

/* ANIMATION */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.message{
  animation:fadeIn 0.3s ease;
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="header">


  <!-- 👇 YE LEFT SIDE -->
  <div class="menu-icon" onclick="toggleSidebar()">
    <span></span>
    <span></span>
  </div>

  <!-- CENTER -->
  <div class="brand">
    <img src="logo.png" class="logo">
    <span>DeepSINKY</span>
  </div>

  <!-- RIGHT -->
  <div class="login-btn" onclick="openLogin()">Login</div>

  </div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar"></div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- WELCOME -->
<div class="center" id="welcome">
  <h1>How can I assist you?</h1>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<!-- INPUT -->
<div class="input-area">
  <div class="input-box">

    <span class="plus">+</span>

    <input id="input" placeholder="Ask DeepSINKY">

    <span class="mic">🎤</span>

    <button id="sendBtn">➤</button>

  </div>
</div>

<!-- SCRIPT -->
<script src="./script.js"></script>

</body>
  </html>
