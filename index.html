<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSINKY</title>

<link rel="stylesheet" href="style.css">

<!-- MARKDOWN ENGINE -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

/* ===== BODY ===== */
body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#0f0f0f;
  color:#e5e5e5;
  display:flex;
  flex-direction:column;
  height:100vh;
  transition:0.3s;
}

/* 🌙 LIGHT MODE */
body.light{
  background:#ffffff;
  color:#000;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  border-bottom:1px solid #222;
  font-size:18px;
  position:relative;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
}

.logo{
  width:28px;
}

/* ===== MENU ===== */
.menu-circle{
  position:absolute;
  left:15px;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#2a2b32;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  cursor:pointer;
}

.menu-circle span{
  width:16px;
  height:2px;
  background:white;
}

/* 🌗 THEME BUTTON */
.theme-btn{
  position:absolute;
  right:15px;
  cursor:pointer;
}

/* ===== CENTER ===== */
.center{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* ===== CHAT ===== */
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  padding-bottom:120px;
  display:none;
}

/* ===== MESSAGE BASE ===== */
.message{
  margin:20px 0;
  display:flex;
}

/* ===== USER ===== */
.message.user{
  justify-content:flex-end;
}

.message.user .text{
  color:#aaa;
  font-size:15px;
}

/* ===== BOT ===== */
.message.bot{
  width:100%;
}

.message.bot .content{
  width:100%;
}

.message.bot .text{
  font-size:16px;
  line-height:1.7;
}

/* ===== FORMAT ===== */
.message.bot h1,
.message.bot h2,
.message.bot h3{
  margin:12px 0 6px;
  font-weight:600;
}

.message.bot strong{
  color:white;
}

.message.bot ul{
  padding-left:20px;
}

.message.bot li{
  margin:6px 0;
}

/* ===== CODE ===== */
pre{
  background:#1e1e1e;
  padding:12px;
  border-radius:10px;
  overflow:auto;
  position:relative;
}

code{
  color:#00ffcc;
}

/* COPY BUTTON */
.copy-btn{
  position:absolute;
  right:10px;
  top:5px;
  font-size:12px;
  cursor:pointer;
  color:#00ffcc;
}

/* ===== INPUT ===== */
.input-area{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  padding:10px;
  background:#0f0f0f;
}

.input-box{
  width:95%;
  max-width:600px;
  display:flex;
  align-items:center;
  background:#1e1e1e;
  border-radius:30px;
  padding:10px 15px;
}

.input-box input{
  flex:1;
  background:transparent;
  border:none;
  color:white;
  padding:10px;
  outline:none;
}

#sendBtn{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:white;
  color:black;
  cursor:pointer;
}

/* 🎤 FIX */
.mic{
  cursor:pointer;
  margin:0 10px;
}

/* ===== ANIMATION ===== */
@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message{
  animation:fadeIn 0.3s ease;
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="menu-circle" onclick="toggleSidebar()">
    <span></span>
    <span></span>
  </div>

  <div class="brand">
    <img src="logo.png" class="logo">
    <span>DeepSINKY</span>
  </div>

  <!-- 🌗 THEME -->
  <div class="theme-btn" onclick="toggleTheme()">🌙</div>

</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar"></div>

<!-- ✅ FIXED -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- WELCOME -->
<div class="center" id="welcome">
  <h1>How can I assist you?</h1>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<!-- INPUT -->
<div class="input-area">
  <div class="input-box">

    <span>+</span>

    <input id="input" placeholder="Ask DeepSINKY">

    <!-- ✅ FIXED -->
    <span class="mic">🎤</span>

    <button id="sendBtn">➤</button>

  </div>
</div>

<!-- ✅ FIXED PATH -->
<script src="./script.js"></script>

</body>
</html>
