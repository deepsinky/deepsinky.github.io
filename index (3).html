<style>

/* ==========================================================
   DEEPSINKY — DESIGN TOKENS
========================================================== */
:root{
    color-scheme: dark;
    --bg:#0a0d14;
    --bg-elevated:#10141d;
    --surface:#141924;
    --surface-hover:#1b2230;
    --border:#232b3a;
    --border-soft:#1a212e;

    --text:#f2f4f8;
    --text-secondary:#a8b1c4;
    --text-muted:#616d84;

    --accent-a:#3b82f6;
    --accent-b:#60a5fa;
    --accent-grad:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    --accent-soft:rgba(59,130,246,.14);

    --danger:#f0616f;
    --success:#3ecf8e;

    --radius-s:10px;
    --radius-m:16px;
    --radius-l:22px;
    --radius-pill:999px;

    --header-h:64px;
    --sidebar-w:280px;

    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 8px 24px rgba(0,0,0,.35);
    --shadow-glow:0 0 0 1px rgba(59,130,246,.25), 0 8px 30px rgba(59,130,246,.18);

    --ease:cubic-bezier(.22,1,.36,1);
}

html[data-theme="light"]{
    color-scheme: light;
    --bg:#f7f7fb;
    --bg-elevated:#ffffff;
    --surface:#ffffff;
    --surface-hover:#f0f1f7;
    --border:#e6e7ef;
    --border-soft:#eef0f6;

    --text:#161821;
    --text-secondary:#565b6d;
    --text-muted:#8b90a0;

    --accent-soft:rgba(59,130,246,.09);
    --shadow-1:0 1px 2px rgba(20,20,40,.06);
    --shadow-2:0 12px 28px rgba(20,20,40,.09);
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
    height:100%;
    overscroll-behavior:none;
}

body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition:background .2s var(--ease),color .2s var(--ease);
}

button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
input,textarea{ font-family:inherit; border:none; outline:none; background:none; color:inherit; }
a{ color:var(--accent-b); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:999px; }
::-webkit-scrollbar-thumb:hover{ background:var(--accent-a); }

:focus-visible{ outline:2px solid var(--accent-a); outline-offset:2px; }
input:focus-visible,textarea:focus-visible,select:focus-visible{ outline:none; }
:focus-visible{ outline:none; }

@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}



/* ==========================================================
   APP SHELL
========================================================== */
#app{
    position:relative;
    display:flex;
    width:100%;
    height:100dvh;
}

/* ---------- Sidebar ---------- */
.sidebar{
    position:fixed;
    inset:0 auto 0 0;
    width:var(--sidebar-w);
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg-elevated);
    border-right:1px solid var(--border-soft);
    z-index:60;
    transform:translateX(0);
    transition:transform .28s var(--ease);
}
.sidebar[data-open="false"]{ transform:translateX(-100%); }

.sidebar-top{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px;
    border-bottom:1px solid var(--border-soft);
}
.brand{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
}
.brand-mark{ width:30px; height:30px; flex-shrink:0; }
.brand-name{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:-.01em;
    white-space:nowrap;
}
.icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    transition:background .15s var(--ease), color .15s var(--ease);
    flex-shrink:0;
}
.icon-btn:hover{ background:var(--surface-hover); color:var(--text); }
.icon-btn svg{ width:18px; height:18px; }

.new-chat-btn{
    display:flex; align-items:center; gap:10px;
    margin:12px;
    padding:11px 14px;
    border-radius:var(--radius-m);
    background:var(--accent-grad);
    color:#fff;
    font-weight:600;
    font-size:.9rem;
    box-shadow:var(--shadow-1);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
}
.new-chat-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-glow); }
.new-chat-btn svg{ width:16px; height:16px; }

.sidebar-search{
    display:flex; align-items:center; gap:8px;
    margin:0 12px 10px;
    padding:9px 12px;
    border-radius:var(--radius-s);
    background:var(--surface);
    border:1px solid var(--border-soft);
}
.sidebar-search svg{ width:15px; height:15px; color:var(--text-muted); flex-shrink:0; }
.sidebar-search input{ flex:1; font-size:.85rem; color:var(--text); }
.sidebar-search input::placeholder{ color:var(--text-muted); }

.history{
    flex:1;
    overflow-y:auto;
    padding:4px 8px 8px;
    display:flex;
    flex-direction:column;
    gap:2px;
}
.history-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    padding:40px 20px;
    color:var(--text-muted);
    text-align:center;
    font-size:.83rem;
}
.history-item{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:10px 10px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    font-size:.85rem;
    text-align:left;
    transition:background .15s var(--ease), color .15s var(--ease);
    position:relative;
}
.history-item:hover{ background:var(--surface-hover); color:var(--text); }
.history-item[data-active="true"]{ background:var(--accent-soft); color:var(--text); }
.history-item span{
    flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.history-item .del{
    opacity:0; width:26px; height:26px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:7px;
}
.history-item:hover .del{ opacity:1; }
.history-item .del:hover{ background:rgba(240,97,111,.15); color:var(--danger); }
.history-item .del svg{ width:14px; height:14px; }

.sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    gap:8px;
}
.theme-toggle{
    display:flex; align-items:center; gap:10px;
    flex:1;
    padding:10px 12px;
    border-radius:var(--radius-s);
    color:var(--text-secondary);
    font-size:.83rem;
    font-weight:600;
    transition:background .15s var(--ease);
}
.theme-toggle:hover{ background:var(--surface-hover); color:var(--text); }
.theme-toggle svg{ width:16px; height:16px; }


/* ---------- Overlay (mobile sidebar) ---------- */
.overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(2px);
    z-index:55;
    opacity:0; pointer-events:none;
    transition:opacity .25s var(--ease);
}
.overlay[data-active="true"]{ opacity:1; pointer-events:auto; }

/* ---------- Main ---------- */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100dvh;
    min-width:0;
    margin-left:var(--sidebar-w);
    transition:margin-left .28s var(--ease);
}
.main[data-full="true"]{ margin-left:0; }

.header{
    display:flex; align-items:center; gap:10px;
    height:var(--header-h);
    padding:0 16px;
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0;
}
.header .title{
    flex:1;
    font-weight:600;
    font-size:.92rem;
    color:var(--text-secondary);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.status-pill{
    display:flex; align-items:center; gap:6px;
    padding:5px 10px;
    border-radius:var(--radius-pill);
    background:var(--surface);
    border:1px solid var(--border-soft);
    font-size:.72rem;
    font-weight:600;
    color:var(--text-secondary);
    flex-shrink:0;
}
.status-dot{ width:6px; height:6px; border-radius:50%; background:var(--success); }
.status-dot[data-state="offline"]{ background:var(--text-muted); }
.status-dot[data-state="busy"]{ background:#f5b942; animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }

/* ---------- Chat area ---------- */
.chat-scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}
.chat-inner{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
    gap:22px;
}

/* ---------- Welcome ---------- */
.welcome{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
    min-height:calc(100dvh - var(--header-h) - 96px);
}
.welcome-mark{ width:58px; height:58px; margin-bottom:22px; }
.welcome h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(1.7rem,4.4vw,2.6rem);
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.15;
}
.welcome h1 em{
    font-style:normal;
    background:var(--accent-grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.welcome p{
    margin-top:12px;
    color:var(--text-secondary);
    font-size:.98rem;
}
.starters{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:34px;
    width:100%;
    max-width:560px;
}
.starter{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    padding:15px 16px;
    border-radius:var(--radius-m);
    background:var(--surface);
    border:1px solid var(--border-soft);
    text-align:left;
    transition:border-color .18s var(--ease), transform .18s var(--ease), background .18s var(--ease);
}
.starter:hover{ border-color:var(--accent-a); transform:translateY(-2px); background:var(--surface-hover); }
.starter strong{ font-size:.85rem; font-weight:600; }
.starter span{ font-size:.78rem; color:var(--text-muted); }
@media (max-width:520px){ .starters{ grid-template-columns:1fr; } }

/* ---------- Messages ---------- */
.msg{
    display:flex;
    gap:12px;
    align-items:flex-start;
    animation:msgIn .25s var(--ease);
}
@keyframes msgIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.msg.user{ flex-direction:row-reverse; }
.avatar{
    width:30px; height:30px; border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.7rem; font-weight:700;
}
.msg.user .avatar{ background:var(--surface-hover); color:var(--text-secondary); }
.msg.assistant .avatar{ background:var(--accent-grad); color:#fff; }

.bubble-col{
    display:flex; flex-direction:column; gap:6px;
    max-width:86%;
    min-width:0;
}
.msg.user .bubble-col{ align-items:flex-end; }

.bubble{
    padding:12px 15px;
    border-radius:var(--radius-m);
    font-size:.93rem;
    line-height:1.65;
    word-wrap:break-word;
}
.msg.user .bubble{
    background:var(--accent-grad);
    color:#fff;
    border-radius:var(--radius-m) var(--radius-m) 4px var(--radius-m);
}
.msg.assistant .bubble{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-m) var(--radius-m) var(--radius-m) 4px;
}
.bubble p{ margin:0 0 10px; }
.bubble p:last-child{ margin-bottom:0; }
.bubble pre{
    background:var(--bg);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-s);
    padding:12px 14px;
    overflow-x:auto;
    margin:10px 0;
    font-size:.8rem;
}
.bubble code{ font-family:"SF Mono",Consolas,monospace; }
.bubble :not(pre)>code{
    background:var(--bg);
    padding:2px 6px;
    border-radius:5px;
    font-size:.85em;
}
.bubble ul,.bubble ol{ margin:0 0 10px 20px; }
.bubble a{ text-decoration:underline; }

.msg-actions{
    display:flex; gap:4px;
    opacity:0;
    transition:opacity .15s var(--ease);
}
.msg:hover .msg-actions{ opacity:1; }
.msg-actions button{
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    border-radius:7px;
    color:var(--text-muted);
}
.msg-actions button:hover{ background:var(--surface-hover); color:var(--text); }
.msg-actions svg{ width:13px; height:13px; }

.error-bubble{
    display:flex; align-items:center; gap:10px;
    padding:11px 14px;
    border-radius:var(--radius-m);
    background:rgba(240,97,111,.1);
    border:1px solid rgba(240,97,111,.3);
    color:var(--danger);
    font-size:.85rem;
}
.error-bubble button{
    margin-left:auto;
    font-weight:600;
    text-decoration:underline;
    flex-shrink:0;
}

.thinking{
    display:flex; gap:5px; align-items:center;
    padding:14px 15px;
}
.thinking span{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-muted);
    animation:bounce 1.2s infinite ease-in-out;
}
.thinking span:nth-child(2){ animation-delay:.15s; }
.thinking span:nth-child(3){ animation-delay:.3s; }
@keyframes bounce{ 0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-5px); opacity:1;} }

/* ---------- Composer ---------- */
.composer-wrap{
    flex-shrink:0;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
}
.composer{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:8px 8px 8px 16px;
    border-radius:var(--radius-l);
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:var(--shadow-2);
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.composer:focus-within{ border-color:var(--border); box-shadow:none; }
.composer textarea{
    flex:1;
    resize:none;
    max-height:180px;
    font-size:.94rem;
    line-height:1.5;
    padding:9px 0;
    color:var(--text);
}
.composer textarea::placeholder{ color:var(--text-muted); }
.send-btn{
    width:38px; height:38px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--accent-grad);
    color:#fff;
    transition:transform .15s var(--ease), opacity .15s var(--ease);
}
.send-btn:disabled{ opacity:.35; pointer-events:none; }
.send-btn:not(:disabled):hover{ transform:scale(1.06); }
.send-btn svg{ width:16px; height:16px; }
.send-btn[data-stop="true"]{ background:var(--danger); }

.composer-hint{
    max-width:760px;
    margin:8px auto 0;
    text-align:center;
    font-size:.72rem;
    color:var(--text-muted);
        }

/* ---------- Toast ---------- */
.toast-stack{
    position:fixed;
    bottom:calc(90px + env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    display:flex; flex-direction:column; gap:8px;
    z-index:200;
    width:min(360px,90vw);
    align-items:center;
}
.toast{
    padding:10px 16px;
    border-radius:var(--radius-pill);
    background:var(--bg-elevated);
    border:1px solid var(--border);
    color:var(--text);
    font-size:.82rem;
    box-shadow:var(--shadow-2);
    animation:toastIn .25s var(--ease);
}
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }



/* ==========================================================
   RESPONSIVE
========================================================== */
@media (max-width:860px){
    .sidebar{ z-index:70; box-shadow:var(--shadow-2); }
    .main{ margin-left:0 !important; }
}
@media (max-width:480px){
    .header{ padding:0 10px; }
    .chat-inner{ padding:18px 12px 30px; }
    .composer-wrap{ padding:10px 10px calc(12px + env(safe-area-inset-bottom)); }
    .bubble-col{ max-width:92%; }
}

/* ---------- Phase 1 additions ---------- */
.msg.user .bubble{ white-space:pre-wrap; }
.msg-time{ font-size:.68rem; color:var(--text-muted); margin:0 4px; align-self:center; }
.msg-actions{ align-items:center; }
@media (hover:none){ .msg-actions{ opacity:1; } }
.msg.editing .bubble-col{ width:86%; }
.edit-area{
    width:100%; min-height:72px; max-height:260px; resize:vertical;
    padding:12px 14px; border-radius:var(--radius-m);
    background:var(--surface); border:1px solid var(--accent-a);
    color:var(--text); font-size:.93rem; line-height:1.6;
}
.edit-row{ display:flex; gap:8px; justify-content:flex-end; }
.edit-row button{ padding:8px 14px; border-radius:var(--radius-s); font-size:.82rem; font-weight:600; color:var(--text-secondary); background:var(--surface-hover); }
.edit-row button.primary{ background:var(--accent-grad); color:#fff; }
.codeblock{ margin:10px 0; border:1px solid var(--border-soft); border-radius:var(--radius-s); overflow:hidden; background:var(--bg); }
.codeblock pre{ margin:0 !important; border:none !important; border-radius:0 !important; }
.code-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 8px 6px 14px; background:var(--surface-hover); font-size:.72rem; color:var(--text-secondary); }
.code-head button{ display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:7px; color:var(--text-secondary); font-size:.72rem; }
.code-head button:hover{ background:var(--border); color:var(--text); }
.code-head svg{ width:13px; height:13px; }
.code-head em{ font-style:normal; }
.hljs-keyword,.hljs-selector-tag,.hljs-literal{ color:#60a5fa; }
.hljs-string,.hljs-attr,.hljs-template-variable{ color:#3ecf8e; }
.hljs-number,.hljs-built_in,.hljs-type{ color:#f0a35e; }
.hljs-title,.hljs-function,.hljs-name{ color:#5cb8ff; }
.hljs-comment,.hljs-quote{ color:var(--text-muted); font-style:italic; }
.hljs-variable,.hljs-params{ color:var(--text); }

/* ---------- Phase 1.5: ChatGPT-mobile-style layout + auto theme ---------- */
:root{ --bg:#000; --bg-elevated:#000; --surface:#2b2b2b; --surface-hover:#242424; --border:#3a3a3a; --border-soft:#232323;
  --text:#fff; --text-secondary:#c7c7cc; --text-muted:#8e8e93; --accent-grad:linear-gradient(#3b82f6,#3b82f6);
  --accent-soft:rgba(59,130,246,.18); --header-h:76px; --sidebar-w:310px; }
html[data-theme="light"]{ --bg:#fff; --bg-elevated:#fff; --surface:#f2f2f4; --surface-hover:#ebebee; --border:#e1e1e6; --border-soft:#ececf0;
  --text:#111; --text-secondary:#4a4a52; --text-muted:#8a8a93; --accent-soft:rgba(59,130,246,.12); }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.round-btn{ width:46px; height:46px; border-radius:50%; background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s var(--ease); }
.round-btn:hover{ background:var(--surface-hover); }
.round-btn svg{ width:21px; height:21px; }
.header{ border-bottom:none; height:auto; padding:calc(12px + env(safe-area-inset-top,0px)) 14px 8px; }
.header .title{ text-align:center; font-size:.95rem; }
.sidebar{ padding-top:env(safe-area-inset-top,0px); }
.sb-head{ display:flex; align-items:center; gap:10px; padding:18px 16px 10px 24px; }
.sb-title{ flex:1; font-size:1.9rem; font-weight:600; letter-spacing:-.01em; }
.sidebar-search{ margin:0 16px 6px; border-radius:var(--radius-pill); padding:11px 16px; background:var(--surface); border:none; }
.sidebar-search[hidden]{ display:none; }
.sb-status{ padding:0 24px 6px; }
.sb-scroll{ flex:1; overflow-y:auto; padding:6px 12px 12px; }
.sb-nav{ display:flex; flex-direction:column; }
.nav-item{ display:flex; align-items:center; gap:18px; padding:14px 12px; border-radius:14px; font-size:1.12rem; font-weight:600; color:var(--text); text-align:left; }
.nav-item svg{ width:24px; height:24px; flex-shrink:0; }
.nav-item:hover{ background:var(--surface-hover); }
.nav-item small{ margin-left:auto; font-size:.65rem; font-weight:600; color:var(--text-muted); border:1px solid var(--border); padding:2px 7px; border-radius:99px; }
.history{ flex:none; overflow:visible; padding:0; gap:0; }
.section-label{ padding:20px 12px 8px; font-size:1.12rem; font-weight:600; color:var(--text); }
.history-item{ padding:14px 12px; font-size:1.05rem; font-weight:500; color:var(--text); border-radius:14px; cursor:pointer; }
.history-item[data-active="true"]{ background:var(--surface-hover); }
.more-btn{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); flex-shrink:0; opacity:0; }
.more-btn svg{ width:18px; height:18px; }
.history-item:hover .more-btn,.history-item:focus-within .more-btn{ opacity:1; }
@media (hover:none){ .more-btn{ opacity:.8; } }
.sb-bottom{ display:flex; align-items:center; gap:10px; padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px)); }
.sb-spacer{ flex:1; }
.chat-pill{ display:flex; align-items:center; gap:10px; padding:14px 24px; border-radius:99px; background:#3b82f6; color:#fff; font-size:1.1rem; font-weight:600; }
.chat-pill svg{ width:22px; height:22px; }
.sb-bottom .round-btn{ width:50px; height:50px; }
.avatar-btn{ width:54px; height:54px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.avatar-btn span{ width:40px; height:40px; border-radius:50%; background:#1bbf9b; color:#fff; font-weight:600; display:flex; align-items:center; justify-content:center; }
.chat-menu{ position:fixed; z-index:120; min-width:170px; padding:6px; border-radius:16px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-2); }
.chat-menu button{ display:block; width:100%; text-align:left; padding:11px 12px; border-radius:10px; font-size:.95rem; font-weight:500; }
.chat-menu button:hover{ background:var(--surface-hover); }
.chat-menu .danger{ color:var(--danger); }
@media (max-width:860px){ .sidebar{ width:min(86vw,340px); } .sb-close{ display:none; } .composer-hint{ display:none; } }
.welcome{ align-items:stretch; justify-content:space-between; text-align:left; padding:8px 8px 0; min-height:calc(100dvh - var(--header-h) - 110px); }
.welcome-top{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; }
.welcome-mark{ margin:0; width:52px; height:52px; }
.welcome h1{ font-size:1.6rem; font-weight:600; }
.starters{ display:flex; flex-direction:column; gap:2px; max-width:none; margin-top:0; grid-template-columns:none; }
.starter{ flex-direction:row; align-items:center; gap:18px; background:none; border:none; padding:16px 10px; font-size:1.1rem; font-weight:600; color:var(--text); }
.starter:hover{ transform:none; background:var(--surface-hover); }
.starter svg{ width:26px; height:26px; flex-shrink:0; }
.avatar{ display:none; }
.bubble-col{ max-width:100%; }
.msg.user .bubble-col{ max-width:86%; }
.msg.assistant .bubble-col{ width:100%; }
.msg.user .bubble{ background:var(--surface); color:var(--text); border-radius:22px 22px 6px 22px; }
.msg.assistant .bubble{ background:none; border:none; padding:4px 2px; }
.composer-wrap{ background:none; padding:6px 14px calc(12px + env(safe-area-inset-bottom,0px)); }
.composer{ align-items:flex-end; gap:4px; padding:8px; border-radius:32px; background:var(--surface); border:none; box-shadow:none; min-height:60px; }
.composer:focus-within{ border:none; box-shadow:none; }
.composer textarea{ font-size:1.05rem; padding:10px 4px; }
.comp-btn{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text); flex-shrink:0; }
.comp-btn svg{ width:24px; height:24px; }
.comp-btn[data-on="true"]{ background:var(--danger); color:#fff; }
.send-btn{ width:44px; height:44px; background:#3b82f6; }
.send-btn svg{ width:20px; height:20px; }
.hljs-keyword,.hljs-selector-tag,.hljs-literal{ color:#c792ea; }
.starter span{ font-size:inherit; color:inherit; }
.sidebar[data-open="false"]{ box-shadow:none !important; }
.sb-status .status-pill{ display:inline-flex; }

/* no focus rectangle inside the composer / search */
.composer textarea,.composer textarea:focus,.composer textarea:focus-visible,
.sidebar-search input,.sidebar-search input:focus,.sidebar-search input:focus-visible{ outline:none !important; box-shadow:none !important; }
.send-btn[data-mode="rec"]{ background:var(--danger); }
.send-btn[data-mode="stop"] rect,.send-btn[data-mode="rec"] rect{ fill:currentColor; }

.comp-btn[hidden]{ display:none; }
.send-btn svg{ stroke-linecap:round; stroke-linejoin:round; }
.comp-btn[data-on="true"]{ background:var(--danger); color:#fff; }
.attach-row{ display:flex; gap:8px; overflow-x:auto; padding:0 6px 8px; }
.attach-row[hidden],.sheet[hidden],.sheet-backdrop[hidden]{ display:none; }
.chip{ position:relative; flex-shrink:0; display:flex; align-items:center; gap:8px; max-width:200px; height:60px; padding:0 30px 0 8px; border-radius:16px; background:var(--surface); font-size:.8rem; }
.chip img{ width:44px; height:44px; border-radius:10px; object-fit:cover; }
.chip svg{ width:24px; height:24px; flex-shrink:0; }
.chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip button{ position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:var(--surface-hover); display:flex; align-items:center; justify-content:center; }
.chip button svg{ width:12px; height:12px; }
.sheet-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:150; }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:160; margin:0 auto; max-width:600px; max-height:90dvh; overflow-y:auto; padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px)); background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:28px 28px 0 0; animation:sheetIn .25s var(--ease); }
@keyframes sheetIn{ from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }
.sheet-grip{ width:44px; height:5px; border-radius:99px; background:var(--border); margin:2px auto 12px; }
.sheet-head{ position:relative; display:flex; align-items:center; justify-content:center; height:44px; margin-bottom:12px; }
.sheet-head h3{ font-size:1.15rem; font-weight:600; }
.sheet-x{ position:absolute; left:0; width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
.sheet-x svg{ width:22px; height:22px; }
.sheet-tiles{ display:flex; gap:10px; margin-bottom:10px; }
.tile{ flex:1; display:flex; flex-direction:column; align-items:center; gap:12px; padding:18px 6px; border-radius:20px; background:var(--surface); font-weight:600; font-size:1rem; color:var(--text); }
.tile .ic,.sheet-row .ic{ width:52px; height:52px; border-radius:50%; background:var(--surface-hover); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tile .ic svg,.sheet-row .ic svg{ width:24px; height:24px; }
.sheet-row{ display:flex; align-items:center; gap:14px; width:100%; margin-top:8px; padding:12px 14px; border-radius:18px; background:var(--surface); color:var(--text); text-align:left; opacity:.6; }
.sheet-row .txt{ flex:1; display:flex; flex-direction:column; font-size:1.05rem; }
.sheet-row strong{ font-weight:600; }
.sheet-row em{ font-style:normal; font-size:.9rem; color:var(--text-muted); }
.sheet-row small{ font-size:.65rem; font-weight:600; color:var(--text-muted); border:1px solid var(--border); padding:2px 7px; border-radius:99px; }
.sw{ width:50px; height:30px; border-radius:99px; background:var(--border); position:relative; flex-shrink:0; }
.sw::after{ content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; }

.msg.assistant .msg-actions{ opacity:1; }
.msg-actions button{ width:34px; height:34px; }
.msg-actions svg{ width:17px; height:17px; }
.msg-actions button.fb-on{ color:#60a5fa; }
.msg-actions button.fb-on svg{ fill:currentColor; }

html[data-theme="dark"]{ color-scheme:dark; }
html[data-theme="light"]{ color-scheme:light; }
html[data-theme="dark"]{ --bg:#000; --bg-elevated:#000; --surface:#2b2b2b; --surface-hover:#242424; --border:#3a3a3a; --border-soft:#232323;
  --text:#fff; --text-secondary:#c7c7cc; --text-muted:#8e8e93; --accent-soft:rgba(59,130,246,.18); }
html[data-theme="light"] .hljs-keyword,html[data-theme="light"] .hljs-selector-tag,html[data-theme="light"] .hljs-literal{ color:#7c3aed; }
html[data-theme="light"] .hljs-string,html[data-theme="light"] .hljs-attr,html[data-theme="light"] .hljs-template-variable{ color:#047857; }
html[data-theme="light"] .hljs-number,html[data-theme="light"] .hljs-built_in,html[data-theme="light"] .hljs-type{ color:#c2410c; }
html[data-theme="light"] .hljs-title,html[data-theme="light"] .hljs-function,html[data-theme="light"] .hljs-name{ color:#1d4ed8; }
html[data-theme="light"] .sheet-backdrop,html[data-theme="light"] .overlay{ background:rgba(0,0,0,.35); }
html[data-theme="light"] .msg-actions button.fb-on{ color:#2563eb; }
html[data-theme="light"] .error-bubble{ background:rgba(240,97,111,.08); }

/* ===== POWER PACK ===== */
.sheet-row{opacity:1}
.sw{transition:background .2s}.sw::after{transition:left .2s}
.sw.on{background:#3b82f6}.sw.on::after{left:23px}
.pn{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.pn[hidden],.lb[hidden]{display:none}
.pn-box{width:100%;max-width:640px;height:88dvh;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:sheetIn .25s var(--ease)}
.pn-head{display:flex;align-items:center;gap:10px;padding:14px 16px}
.pn-head h3{flex:1;text-align:center;font-size:1.15rem;font-weight:600}
.pn-x{width:40px;height:40px;border-radius:50%;background:var(--surface);font-size:1rem}
.pn-act{min-width:40px;display:flex;justify-content:flex-end}
.pn-body{flex:1;overflow-y:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface);cursor:pointer}
.ptxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ptxt b{font-weight:600;font-size:1rem;overflow-wrap:anywhere}
.ptxt small,.note,.empty{color:var(--text-muted);font-size:.85rem}
.empty{text-align:center;padding:50px 10px;line-height:1.6}
.tick{color:#60a5fa;font-weight:700}
.pdel{width:32px;height:32px;border-radius:50%;background:var(--surface-hover);color:var(--text-secondary);flex-shrink:0}
.form{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:var(--surface)}
.form input,.form textarea{background:var(--surface-hover);border-radius:12px;padding:12px;font-size:1rem;resize:none;width:100%}
.pbtn{padding:10px 16px;border-radius:99px;background:#3b82f6;color:#fff;font-weight:600;font-size:.9rem;align-self:flex-start}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface)}
.grid img{width:100%;height:100%;object-fit:cover}
.lb{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.lb-box{max-width:min(92vw,640px);max-height:88dvh;display:flex;flex-direction:column;gap:12px;background:var(--bg-elevated);padding:14px;border-radius:20px;overflow:hidden}
.lb-box>div:first-child{overflow:auto}
.lb-img{max-width:100%;max-height:60dvh;border-radius:12px;display:block;margin:0 auto 10px}
.lb pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.82rem;font-family:ui-monospace,monospace}
.lb-row{display:flex;gap:8px;justify-content:flex-end}
.lb-row button{padding:10px 16px;border-radius:99px;background:var(--surface);font-weight:600}
.lb-row button:first-child:not(:last-child){background:#3b82f6;color:#fff}
.chip{max-width:230px}
.chip .ct,.att-file .ct{display:flex;flex-direction:column;min-width:0;cursor:pointer}
.chip b,.att-file b{font-weight:600;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small,.att-file small{color:var(--text-muted);font-size:.7rem}
.chip.busy small{animation:pulse 1.2s infinite}
.msg-atts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-bottom:6px}
.att-img{width:150px;height:150px;border-radius:16px;overflow:hidden;background:var(--surface)}
.att-img img{width:100%;height:100%;object-fit:cover}
.att-file{display:flex;align-items:center;gap:10px;max-width:240px;padding:10px 14px;border-radius:16px;background:var(--surface);text-align:left;color:var(--text)}
.att-file svg{width:24px;height:24px;flex-shrink:0}
.bubble.clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.more-text{display:block;margin:4px 0 0 auto;font-size:.82rem;color:#60a5fa;font-weight:600}
.msg.user .bubble{white-space:pre-wrap;overflow-wrap:anywhere}

.header .title{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text)}
.hdr-logo{width:22px;height:22px;object-fit:contain}
.welcome-mark.logo-img{width:88px;height:88px;object-fit:contain;animation:logoIn .9s var(--ease) both,logoFloat 4s ease-in-out .9s infinite;filter:drop-shadow(0 0 18px rgba(96,165,250,.4))}
@keyframes logoIn{from{opacity:0;transform:scale(.55) rotate(-14deg);filter:blur(12px)}to{opacity:1;transform:none}}
@keyframes logoFloat{50%{transform:translateY(-7px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.welcome h1{animation:fadeUp .8s var(--ease) .3s both}
.starter{animation:fadeUp .6s var(--ease) both}
.starter:nth-child(1){animation-delay:.45s}.starter:nth-child(2){animation-delay:.53s}.starter:nth-child(3){animation-delay:.61s}.starter:nth-child(4){animation-delay:.69s}
.think-logo{width:30px;height:30px;object-fit:contain;animation:logoPulse 1.3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.06)}}

.sb-status{display:none !important}
.hm-back{position:fixed;inset:0;z-index:119}
.hmenu{position:fixed;z-index:120;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:min(310px,88vw);max-height:calc(100dvh - 24px);overflow-y:auto;padding:8px;border-radius:26px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-2);transform-origin:top right;animation:hmIn .18s var(--ease)}
@keyframes hmIn{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
.hm-title{padding:12px 14px;color:var(--text-muted);font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-item{display:flex;align-items:center;gap:16px;width:100%;padding:14px;border-radius:16px;font-size:1.08rem;font-weight:600;text-align:left}
.hm-item:hover,.hm-item:active{background:var(--surface-hover)}
.hm-item svg{width:24px;height:24px;flex-shrink:0}
.hm-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-item i{font-style:normal;font-size:1.5rem;color:var(--text-muted)}
.hm-item.danger{color:#ff6b6b}
.findbar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border-soft)}
.findbar[hidden]{display:none}
.findbar input{flex:1;min-width:0;background:var(--surface);border-radius:99px;padding:10px 14px;font-size:1rem}
.findbar button{width:34px;height:34px;border-radius:50%;background:var(--surface);flex-shrink:0}
.fc{font-size:.8rem;color:var(--text-muted);min-width:34px;text-align:center}
.find-hit{outline:2px solid rgba(250,204,21,.35);outline-offset:6px;border-radius:12px}
.find-cur{outline-color:#facc15}

/* ===== code card, composer expand ===== */
.codeblock{border-radius:20px;background:var(--surface);border:1px solid var(--border-soft);overflow:hidden;margin:12px 0}
.codeblock .code-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 2px 18px;background:none;border:none;color:var(--text-muted);font-weight:600;font-size:.9rem}
.code-acts{display:flex;gap:2px}
.code-acts button,.cx-head button{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;color:var(--text-secondary);transition:background .15s,color .15s,transform .15s var(--ease)}
.code-acts button:hover{background:var(--surface-hover);color:var(--text)}

.cx{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;animation:cxIn .24s var(--ease);transition:opacity .18s,transform .18s}

.cx-head button{background:var(--surface);border-radius:50%}
.cx-head svg{width:20px;height:20px}

.cx-body pre{margin:0;padding-right:18px;min-width:0}
.cx-body code{font:.86rem/1.65 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.attach-row{max-height:0;opacity:0;padding:0 6px;overflow-y:hidden;transition:max-height .32s var(--ease),opacity .25s,padding .3s var(--ease)}
.attach-row[data-open="true"]{max-height:190px;opacity:1;padding:4px 6px 10px}
.chip.pop{animation:popIn .35s var(--ease)}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.chip.imgc{position:relative;width:96px;height:96px;padding:0;border-radius:18px;overflow:hidden}
.chip.imgc img{width:100%;height:100%;border-radius:0;object-fit:cover}
.chip.imgc .ct{display:none}
.chip.imgc button{top:6px;right:6px;width:26px;height:26px;background:rgba(0,0,0,.65);color:#fff}
.composer{transition:border-radius .25s var(--ease)}
.composer.grow{border-radius:26px}
.composer textarea{transition:height .22s var(--ease);max-height:220px;line-height:1.45}
.comp-btn,.send-btn{transition:transform .15s var(--ease),background .2s}
.comp-btn:active,.send-btn:active{transform:scale(.88)}

/* ===== DETAILING: one stroke system for every surface ===== */
:root{--stroke:rgba(255,255,255,.10);--stroke-2:rgba(255,255,255,.17);--hi:inset 0 1px 0 rgba(255,255,255,.07);--sheen:rgba(255,255,255,.045);--lift:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4);--ring:inset 0 0 0 1px var(--stroke)}
html[data-theme="light"]{--stroke:rgba(0,0,0,.09);--stroke-2:rgba(0,0,0,.16);--hi:inset 0 1px 0 rgba(255,255,255,.9);--sheen:rgba(255,255,255,.75);--lift:0 12px 30px rgba(30,30,60,.10),0 2px 6px rgba(30,30,60,.06)}
textarea,input{caret-color:#60a5fa}
::selection{background:rgba(59,130,246,.35)}

/* composer = one card (attachments, text, buttons), Claude style */
.composer{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;column-gap:6px;row-gap:0;padding:12px 10px 10px;min-height:0;border-radius:28px;background-color:var(--surface);background-image:linear-gradient(180deg,var(--sheen),transparent 65%);border:1px solid var(--stroke-2);box-shadow:var(--hi),var(--lift);transition:border-color .2s var(--ease),box-shadow .25s var(--ease),border-radius .25s var(--ease)}
.composer:focus-within{border:1px solid var(--blk);box-shadow:var(--lift)}
.composer.grow{border-radius:28px}
.composer .attach-row{grid-column:1/-1;grid-row:1}
.composer textarea{grid-column:1/-1;grid-row:2;padding:4px 10px 10px}
#plusBtn{grid-column:1;grid-row:3}
#micBtn{grid-column:3;grid-row:3}
#sendBtn{grid-column:4;grid-row:3}
.comp-btn{width:42px;height:42px;background:var(--surface-hover);box-shadow:var(--ring),var(--hi)}
.comp-btn:hover{box-shadow:inset 0 0 0 1px var(--stroke-2),var(--hi)}
.send-btn{width:42px;height:42px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12),0 4px 14px rgba(59,130,246,.38)}
.send-btn[data-mode="stop"],.send-btn[data-mode="rec"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px rgba(240,97,111,.35)}
.composer-hint{opacity:.8}

/* buttons, bars, cards */
.round-btn{box-shadow:var(--ring),var(--hi)}
.round-btn:hover{box-shadow:inset 0 0 0 1px var(--stroke-2),var(--hi)}
.avatar-btn{box-shadow:var(--ring),var(--hi)}
.chat-pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.12),0 6px 18px rgba(59,130,246,.35)}
.sidebar{border-right:1px solid var(--stroke)}
.sidebar-search{border:1px solid var(--stroke);box-shadow:var(--hi)}
.nav-item:hover,.history-item:hover{box-shadow:var(--ring)}
.history-item[data-active="true"]{box-shadow:var(--ring),var(--hi)}
.nav-item,.history-item,.starter{transition:background .15s,box-shadow .15s}
.starter+.starter{border-top:1px solid var(--stroke)}
.starter:hover{box-shadow:var(--ring)}
.msg.user .bubble{border:1px solid var(--stroke);box-shadow:var(--hi)}
.msg-actions button{box-shadow:none;transition:background .15s,box-shadow .15s,transform .15s var(--ease)}
.msg-actions button:hover{box-shadow:var(--ring)}
.bubble :not(pre)>code{box-shadow:var(--ring)}
.bubble table{border-collapse:separate;border-spacing:0;border:1px solid var(--stroke-2);border-radius:14px;overflow:hidden;display:block;overflow-x:auto}
.bubble th,.bubble td{padding:9px 14px;border-bottom:1px solid var(--stroke);border-right:1px solid var(--stroke);text-align:left}
.bubble tr:last-child td{border-bottom:none}.bubble th:last-child,.bubble td:last-child{border-right:none}
.bubble th{background:var(--surface-hover);font-weight:600}
.bubble blockquote{margin:0 0 10px;padding:4px 14px;border-left:3px solid var(--stroke-2);color:var(--text-secondary)}
.bubble hr{border:none;height:1px;background:var(--stroke);margin:14px 0}
.codeblock{border:1px solid var(--stroke-2);box-shadow:var(--hi)}
.code-head{border-bottom:1px solid var(--stroke)!important}
.chip{border:1px solid var(--stroke);box-shadow:var(--hi)}
.att-img,.att-file{border:1px solid var(--stroke);box-shadow:var(--hi)}
.toast{border:1px solid var(--stroke-2);box-shadow:var(--lift)}

/* sheets, panels, menus */
.sheet{border-top:1px solid var(--stroke-2);box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.sheet-grip{background:var(--stroke-2)}
.tile,.sheet-row,.prow,.form{border:1px solid var(--stroke);box-shadow:var(--hi)}
.tile .ic,.sheet-row .ic{box-shadow:var(--ring)}
.tile,.sheet-row,.prow{transition:background .15s,transform .15s var(--ease)}
.tile:active,.sheet-row:active,.prow:active{transform:scale(.985)}
.sw{box-shadow:var(--ring)}
.pn-box{border:1px solid var(--stroke-2);border-bottom:none;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
.pn-x,.pdel{box-shadow:var(--ring)}
.form input,.form textarea,.findbar input{border:1px solid var(--stroke);box-shadow:var(--hi);transition:border-color .15s,box-shadow .15s}
.form input:focus,.form textarea:focus,.findbar input:focus{outline:none;border-color:var(--blk);box-shadow:none}
.pbtn{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 12px rgba(59,130,246,.3)}
.grid button{box-shadow:var(--ring)}
.hmenu,.chat-menu,.lb-box{border:1px solid var(--stroke-2);box-shadow:var(--lift)}
.hm-title{border-bottom:1px solid var(--stroke);margin-bottom:4px}
.hm-item+.hm-item{box-shadow:none}
.findbar{border-bottom:1px solid var(--stroke)}
.findbar button,.lb-row button{box-shadow:var(--ring)}
.cx-head{border-bottom:1px solid var(--stroke-2)}

/* ===== BLACK INNER BORDER: light outline outside, black line just inside ===== */
:root{--blk:#000;--hi:inset 0 0 0 1px var(--blk),inset 0 2px 0 rgba(255,255,255,.06);--ring:0 0 0 1px var(--stroke-2),inset 0 0 0 1px var(--blk)}
html[data-theme="light"]{--blk:rgba(0,0,0,.8);--hi:inset 0 0 0 1px var(--blk),inset 0 2px 0 rgba(255,255,255,.8);--ring:0 0 0 1px var(--stroke-2),inset 0 0 0 1px var(--blk)}
.sidebar{box-shadow:inset -1px 0 0 var(--blk)}
.codeblock .code-head{box-shadow:inset 0 -1px 0 var(--blk)}
.hm-title{box-shadow:0 1px 0 var(--blk)}
/* ===== plugin store + library pages ===== */
.pg{position:fixed;inset:0;z-index:210;background:var(--bg);display:flex;flex-direction:column;opacity:0;transform:translateX(28px);transition:transform .28s var(--ease),opacity .22s}
.pg.in{opacity:1;transform:none}
.pg-head{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px}
.pg-head h2{flex:1;text-align:center;font-size:1.4rem;font-weight:600;margin:0}
.pg-head h2 .chev{font-style:normal;font-size:1.1rem;color:var(--text-secondary)}
.pg-back,.pg-ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-hover);box-shadow:var(--ring),var(--hi);flex-shrink:0;transition:transform .15s var(--ease)}
.pg-back:active,.pg-ic:active{transform:scale(.9)}
.pg-back svg,.pg-ic svg{width:24px;height:24px}
.pg-ic{background:none;box-shadow:none}
.pg-act{min-width:48px;display:flex;justify-content:flex-end;gap:2px}
.pg-body{flex:1;overflow-y:auto;padding:4px 20px calc(110px + env(safe-area-inset-bottom,0px))}
.pg-search{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;height:58px;padding:0 20px;border-radius:99px;background:var(--surface-hover);border:1px solid var(--stroke-2);box-shadow:var(--hi),var(--lift);color:var(--text-secondary);transition:border-color .2s,box-shadow .2s}
.pg-search:focus-within{border-color:var(--blk);box-shadow:var(--lift)}
.pg-search svg{width:24px;height:24px;flex-shrink:0}
.pg-search input{flex:1;min-width:0;background:none;font-size:1.15rem;color:var(--text)}
.ph{display:flex;align-items:center;gap:8px;margin:30px 0 10px;color:var(--text-secondary);font-size:1.3rem;font-weight:600;cursor:pointer}
.ph i{font-style:normal;transition:transform .2s var(--ease)}
.ph:not(.shut) i{transform:rotate(0)}.ph.shut i{transform:rotate(90deg)}
.pi{display:flex;align-items:center;gap:16px;padding:10px 0;cursor:pointer}
.pi.an{animation:fadeUp .45s var(--ease) both;animation-delay:var(--d)}
.ptile{position:relative;flex-shrink:0;width:60px;height:60px;border-radius:17px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 0 0 1px var(--blk,#000)}
.ptile b{font-size:1.45rem;font-weight:700}.ptile b.sm{font-size:.72rem;letter-spacing:.02em}
.ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pt b{font-size:1.2rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt small{color:var(--text-secondary);font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pact{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:transform .2s var(--ease),color .2s,background .2s}
.pact svg{width:28px;height:28px}.pact:active{transform:scale(.8)}
.pact.on{color:#3ecf8e}
.inst-row{display:flex;gap:12px;overflow-x:auto;padding:6px 0 4px}
.inst{flex-shrink:0;border-radius:17px;transition:transform .15s var(--ease)}.inst:active{transform:scale(.92)}
.inst.more{width:60px;height:60px;background:var(--surface-hover);font-size:1.3rem;font-weight:700;box-shadow:var(--ring)}
.ltabs{display:flex;gap:6px;padding:10px 16px 6px;overflow-x:auto}
.ltab{padding:11px 20px;border-radius:99px;font-weight:600;font-size:1.05rem;color:var(--text-secondary);white-space:nowrap;transition:background .2s,color .2s}
.ltab.on{background:var(--text);color:var(--bg)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:14px}
.lc{aspect-ratio:1;border-radius:26px;background:var(--surface);border:1px solid var(--stroke-2);box-shadow:var(--hi);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;overflow:hidden;transition:transform .15s var(--ease);animation:fadeUp .4s var(--ease) both}
.lc:active{transform:scale(.97)}
.lc.img{padding:0}.lc.img img{width:100%;height:100%;object-fit:cover}
.lc b{font-size:1.1rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lc small{color:var(--text-muted);font-size:.9rem}
.lc.add{align-items:center;justify-content:center;border-style:dashed;color:var(--text-secondary)}.lc.add svg{width:34px;height:34px}
.pd-back{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.55);opacity:0;transition:opacity .24s}.pd-back.in{opacity:1}
.pd{position:fixed;left:0;right:0;bottom:0;z-index:260;max-width:640px;margin:0 auto;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:var(--bg-elevated,var(--surface));border:1px solid var(--stroke-2);border-bottom:none;box-shadow:0 -12px 40px rgba(0,0,0,.5);transform:translateY(100%);transition:transform .28s var(--ease)}
.pd.in{transform:none}
.pd-grip{width:44px;height:5px;border-radius:9px;background:var(--stroke-2);margin:0 auto 16px}
.pd-top{display:flex;gap:16px;align-items:center}
.pd-top b{display:block;font-size:1.3rem}.pd-top small{color:var(--text-secondary);font-size:1rem}
.pd-badge{display:inline-block;margin:16px 0 8px;padding:5px 12px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--surface-hover);box-shadow:var(--ring)}
.pd p{margin:0 0 14px;color:var(--text-secondary);line-height:1.5}
.pd-q{display:flex;gap:8px;margin-bottom:14px}
.pd-q input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;background:var(--surface-hover);border:1px solid var(--stroke);font-size:1rem}
.pd-row{display:flex;gap:10px}.pd-row .pbtn{flex:1;align-self:auto;padding:13px;text-align:center}
.pbtn.ghost{background:var(--surface-hover);color:var(--text);box-shadow:var(--ring)}
.pbtn.danger{background:#e5484d;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}

/* ===== FINAL FIXES ===== */
/* One single black border on the composer and the search bars. No blue ring, no glow, no inner rectangle. */
.composer,.composer:focus-within,.composer:focus,
.pg-search,.pg-search:focus-within,
.sidebar-search,.sidebar-search:focus-within{ border:1px solid var(--blk); box-shadow:var(--lift); outline:none; }
.sidebar-search,.sidebar-search:focus-within{ box-shadow:none; }
.composer textarea,.composer textarea:focus,.composer textarea:focus-visible,
.pg-search input,.pg-search input:focus,.pg-search input:focus-visible,
.sidebar-search input,.sidebar-search input:focus,.sidebar-search input:focus-visible,
.form input:focus,.form textarea:focus,.findbar input:focus,
input[type="search"],input[type="search"]:focus{ outline:none !important; box-shadow:none !important; border-color:transparent; }
.form input:focus,.form textarea:focus,.findbar input:focus{ border-color:var(--blk); }
textarea,input{ caret-color:currentColor; }

/* Long text / files show as a PDF document card (like Claude) */
.pdf-ic{ font-style:normal; flex-shrink:0; width:40px; height:44px; border-radius:10px; background:#e5484d; color:#fff; display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:800; letter-spacing:.04em; box-shadow:0 2px 8px rgba(229,72,77,.35); }
.att-file .pdf-ic{ width:38px; height:42px; }
.lb pre{ max-height:56dvh; overflow:auto; }
.lb-doc{ display:flex; align-items:center; gap:12px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--stroke); }
.lb-doc b{ display:block; font-size:.95rem; overflow-wrap:anywhere; }
.lb-doc small{ color:var(--text-muted); font-size:.78rem; }

/* ===== Image Studio ===== */
.is-wrap{padding:4px 16px 190px}
.is-tabs{display:flex;gap:6px;margin:4px 0 16px;overflow-x:auto;scrollbar-width:none}
.is-tabs::-webkit-scrollbar{display:none}
.is-tab{padding:12px 20px;border-radius:999px;font-size:1.05rem;font-weight:600;color:var(--text-muted);white-space:nowrap;background:transparent}
.is-tab.on{background:var(--surface);color:var(--text)}
.is-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.is-card{position:relative;aspect-ratio:3/4;border-radius:26px;overflow:hidden;text-align:left;border:0;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;transition:transform .15s}
.is-card:active{transform:scale(.97)}
.is-card .em{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:3.6rem;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.is-card b{position:relative;font-size:1.02rem;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.is-card::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.is-card b,.is-card small{z-index:1}
.is-thumb{aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--surface);border:0;padding:0}
.is-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.is-empty{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:50px 10px;line-height:1.6}
.is-composer{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--blk,#000);border-radius:28px;padding:14px 14px 10px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:3}
.is-composer textarea{width:100%;min-height:52px;max-height:130px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:1.1rem;line-height:1.4}
.is-composer textarea::placeholder{color:var(--text-muted)}
.is-opts{display:flex;align-items:center;gap:8px;margin-top:8px}
.is-opts select{height:38px;border-radius:999px;border:1px solid var(--border,#3a3a3a);background:var(--bg);color:var(--text);padding:0 12px;font:inherit;font-size:.85rem;max-width:44%;outline:none}
.is-go{margin-left:auto;width:46px;height:46px;border-radius:50%;background:var(--accent,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;border:0;flex-shrink:0}
.is-go svg{width:22px;height:22px}.is-go[disabled]{opacity:.45}
.is-res{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.is-x{align-self:flex-start;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--text);border:0;font-size:1.1rem}
.is-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;margin:10px 0}
.is-stage img{max-width:100%;max-height:100%;border-radius:20px;object-fit:contain;opacity:0;transition:opacity .3s}
.is-stage img.ok{opacity:1}
.is-spin{position:absolute;width:42px;height:42px;border:3px solid var(--border,#3a3a3a);border-top-color:var(--accent,#3b82f6);border-radius:50%;animation:isspin .8s linear infinite}
@keyframes isspin{to{transform:rotate(360deg)}}
.is-cap{color:var(--text-muted);font-size:.88rem;text-align:center;max-height:3.4em;overflow:hidden;margin-bottom:12px}
.is-cap.bad{color:#f0616f}
.is-btns{display:flex;gap:8px}
.is-btns button{flex:1;height:48px;border-radius:14px;border:0;background:var(--surface);color:var(--text);font:inherit;font-weight:600}
.is-btns button[data-a="dl"]{background:var(--accent,#3b82f6);color:#fff}
@media (prefers-reduced-motion:reduce){.is-spin{animation-duration:2s}.is-card{transition:none}}

/* ===== GLASS SKIN + MOTION (frosted glass, pop-in bubbles, shimmer typing status, fading text) ===== */
html[data-theme="dark"]{ --g-bg:linear-gradient(150deg,rgba(255,255,255,.105),rgba(255,255,255,.035)); --g-hi:inset 0 1px 0 rgba(255,255,255,.17),inset 0 -1px 0 rgba(255,255,255,.03); --g-edge:rgba(255,255,255,.09); --g-shadow:0 14px 38px rgba(0,0,0,.5); --g-blur:blur(26px) saturate(175%); }
html[data-theme="light"]{ --g-bg:linear-gradient(150deg,rgba(255,255,255,.78),rgba(255,255,255,.44)); --g-hi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4); --g-edge:rgba(20,30,70,.08); --g-shadow:0 14px 38px rgba(30,40,90,.14); --g-blur:blur(26px) saturate(170%); }
/* soft ambient light behind the glass so the blur has something to refract */
html[data-theme="dark"] body{ background:radial-gradient(900px 620px at 12% -8%,rgba(59,130,246,.17),transparent 62%),radial-gradient(760px 560px at 108% 18%,rgba(139,92,246,.14),transparent 58%),radial-gradient(720px 520px at 38% 112%,rgba(34,211,238,.10),transparent 62%),var(--bg) fixed; }
html[data-theme="light"] body{ background:radial-gradient(900px 620px at 12% -8%,rgba(96,165,250,.28),transparent 62%),radial-gradient(760px 560px at 108% 18%,rgba(167,139,250,.22),transparent 58%),radial-gradient(720px 520px at 38% 112%,rgba(103,232,249,.20),transparent 62%),var(--bg) fixed; }
#app,.main,.chat-scroll{ background:transparent; }

.sidebar,.header,.sheet,.hmenu,.pn-box,.toast,.starter,.msg.user .bubble{
    background:var(--g-bg); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur);
    border:1px solid var(--g-edge); box-shadow:var(--g-hi),var(--g-shadow);
}
.sidebar{ border-width:0 1px 0 0; box-shadow:var(--g-hi); }
.header{ border-width:0 0 1px 0; box-shadow:none; }
.msg.user .bubble{ color:var(--text); }
.starter{ border-radius:20px; }
/* composer: glass fill, but ONE single black border only (no blue, no inner line) */
.composer,.composer:focus-within{ background:var(--g-bg); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur); border:1px solid var(--blk); box-shadow:var(--lift); }

/* your message pops in */
@keyframes glassPop{ 0%{opacity:0;transform:translateY(16px) scale(.84);filter:blur(9px)} 62%{opacity:1;transform:translateY(-2px) scale(1.018);filter:blur(0)} 100%{opacity:1;transform:none;filter:none} }
.msg.user{ animation:none; }
.msg.user .bubble{ transform-origin:100% 100%; animation:glassPop .55s cubic-bezier(.2,.9,.25,1) both; }

/* typing indicator: spinning mark + shimmering status text */
.msg.assistant.is-thinking .bubble{ background:none; border:none; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; padding:6px 2px; }
.think-row{ display:flex; align-items:center; gap:10px; animation:thinkIn .45s var(--ease) both; }
@keyframes thinkIn{ from{opacity:0;transform:translateY(8px) scale(.96);filter:blur(6px)} to{opacity:1;transform:none;filter:none} }
.think-row .think-logo{ width:22px; height:22px; animation:logoSpin 2.2s cubic-bezier(.6,0,.3,1) infinite; filter:drop-shadow(0 0 9px rgba(130,175,255,.5)); }
@keyframes logoSpin{ 0%{transform:rotate(0) scale(.88)} 50%{transform:rotate(180deg) scale(1.1)} 100%{transform:rotate(360deg) scale(.88)} }

}

/* ===== in-chat images + website artifacts ===== */

.st-plan h4{font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}.st-plan .pr{font-size:1.6rem;font-weight:800}.st-plan .pr small{font-size:.8rem;color:var(--text-muted);font-weight:500}
.st-plan ul{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:.9rem;color:var(--text-secondary)}.st-plan li::before{content:"✓ ";color:var(--accent-b);font-weight:800}
.st-bar{height:8px;border-radius:9px;background:var(--surface-hover);overflow:hidden}.st-bar i{display:block;height:100%;background:var(--accent-a);transition:width .4s}
.st-lock{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center}.st-lock[hidden]{display:none}
.st-lock>div{display:flex;flex-direction:column;gap:12px;align-items:center;width:min(300px,86vw)}
.st-lock input{width:100%;text-align:center;letter-spacing:.4em;font-size:1.4rem;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);color:var(--text)}.st-lock small{color:var(--danger)}
html.st-blur #history>*{filter:blur(6px)}html.st-blur #history>*:hover{filter:none}
</style>

<body>

<div class="auth" id="auth" role="dialog" aria-modal="true" aria-label="Log in"><div class="auth-card" id="authCard"></div></div>
<div class="toast-stack" id="toastStack"></div>

<script>
/* Edit these values. api = your server URL. googleClientId = from Google Cloud Console (OAuth client, type Web). terms / usage / privacy = links of your Terms, Usage Policy and Privacy pages (shown in sign-up). */
window.DEEPSINKY_CONFIG = window.DEEPSINKY_CONFIG || { api: "https://deepsinky-server-1.onrender.com", googleClientId: "194612760175-ffbcfq6fmpqqnbq30d6ll26jpnib1e4o.apps.googleusercontent.com", terms: "", usage: "", privacy: "" };
</script>
<script>
(function(){
"use strict";
var CFG=window.DEEPSINKY_CONFIG||{};
var API=String(CFG.api||"").replace(/\/+$/,""), GID=CFG.googleClientId||"";
var TK="deepsinky_token_v1", SESS="deepsinky_session_v1", SKB="deepsinky_state_v1";
var el=document.getElementById("auth"), card=document.getElementById("authCard");
var token=null, sess=null;
try{ token=localStorage.getItem(TK); sess=localStorage.getItem(SESS); }catch(e){}
function clearSession(){ try{ localStorage.removeItem(TK); localStorage.removeItem(SESS); }catch(e){} }
var valid=!!(token&&sess&&sess!=="guest");
window.__auth={
    email: valid?sess:null,
    token: valid?token:null,
    logout:function(){
        clearSession();
        try{ localStorage.setItem("deepsinky_fresh","1"); sessionStorage.removeItem("ds_welcomed"); }catch(e){}
        try{ if(window.google&&google.accounts&&google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}
        location.reload();
    }
};
if(valid){
    var nm=""; try{ nm=localStorage.getItem("deepsinky_name")||""; }catch(e){}
    window.DS_USER={name:nm||sess.split("@")[0],email:sess};
    window.DS_LOGOUT=window.__auth.logout;
    if(el) el.remove();
    /* confirm the session with the server in the background; expired/invalid -> back to login */
    fetch(API+"/auth/me",{headers:{Authorization:"Bearer "+token}}).then(function(r){ if(r.status===401) window.__auth.logout(); }).catch(function(){});
    return;
}
clearSession();

function esc(t){ var d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYEX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4M6.6 6.7A17 17 0 002 12s3.5 7 10 7c1.9 0 3.6-.5 5-1.2M9.9 9.9a3 3 0 004.2 4.2"/></svg>';
var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var LOGO='<img class="auth-logo dslogo" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">';

function head(t,s){ return LOGO+'<h1>'+t+'</h1>'+(s?'<p class="sub">'+s+'</p>':''); }
function pwField(id,ph,auto){ return '<label class="afield"><input id="'+id+'" type="password" placeholder="'+ph+'" autocomplete="'+auto+'"><button type="button" class="eye" data-eye aria-label="Show password">'+EYE+'</button></label>'; }
function show(html,back,focus,landing){
    stopAnim();
    card.className="auth-card"+(landing?" landing":"");
    card.innerHTML=html;
    var st=card.querySelector(".auth-step"); if(st&&back) st.classList.add("back");
    card.querySelectorAll("[data-eye]").forEach(function(b){
        b.onclick=function(){ var i=b.parentNode.querySelector("input"), v=i.type==="password"; i.type=v?"text":"password"; b.innerHTML=v?EYEX:EYE; };
    });
    if(window.__applyLogos) window.__applyLogos();
    if(focus){ var f=card.querySelector("input"); if(f) f.focus(); }
}
function err(msg){ var e=card.querySelector(".aerr"); if(!e) return; e.textContent=msg; e.classList.remove("shake"); void e.offsetWidth; e.classList.add("shake"); }
function hint(msg){ var h=card.querySelector(".ahint"); if(h) h.textContent=msg; }
function busy(btn,on,label){ btn.disabled=on; btn.innerHTML=on?'<span class="aspin"></span>':label; }
function enter(btn,fn){ card.querySelectorAll("input").forEach(function(i){ i.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); fn(); } }); }); btn.onclick=fn; }

/* ---- talk to the server ---- */
function call(path,body){
    var slow=setTimeout(function(){ hint("Waking the server up… this can take up to a minute"); },4000);
    return fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
        .catch(function(){ throw new Error("Couldn't reach the server. Check your connection and try again."); })
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if(r.status===404&&!d.error) throw new Error("Login server isn't set up yet: the /auth routes are missing on "+API.replace(/^https?:\/\//,"")+". Deploy auth.js there first.");
            if(!r.ok) throw new Error(d.error||"Something went wrong ("+r.status+")"); return d; }); })
        .then(function(d){ clearTimeout(slow); hint(""); return d; }, function(e){ clearTimeout(slow); hint(""); throw e; });
}
function finish(d){
    try{
        localStorage.setItem(TK,d.token); localStorage.setItem(SESS,d.user.email);
        localStorage.setItem("deepsinky_onb:"+d.user.email,"1");   /* known account: never show consent/name/plan again */
        localStorage.setItem("deepsinky_fresh","1");               /* after login always open a NEW chat */
        try{ sessionStorage.removeItem("ds_welcomed"); }catch(e){}
        var k=SKB+":"+d.user.email, st={}; try{ st=JSON.parse(localStorage.getItem(k)||"{}"); }catch(e){}
        if(!d.user.name) d.user.name=(st.name&&st.name!=="G")?st.name:(localStorage.getItem("deepsinky_name")||d.user.email.split("@")[0]);
        if(!st.name||st.name==="G") st.name=d.user.name; localStorage.setItem(k,JSON.stringify(st)); localStorage.setItem("deepsinky_name",d.user.name);
    }catch(e){}
    el.classList.add("out");
    setTimeout(function(){ stopAnim(); location.reload(); },320);
}

/* ---- Google sign-in (Google Identity Services; the server verifies the ID token) ---- */
var GSVG='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
var GBTN='<button type="button" class="gbtn" id="gBtn">'+GSVG+'<span>Continue with Google</span></button>';
var gClient=null, gLoading=false;
function initG(){
    try{
        gClient=google.accounts.oauth2.initTokenClient({
            client_id:GID, scope:"openid email profile",

    function hex(r){ x.beginPath(); for(var i=0;i<=6;i++){ var a=(-90+60*i)*Math.PI/180, px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r; if(i===0) x.moveTo(px,py); else x.lineTo(px,py); } }

    ];
    function ribbon(r,t,al){

        for(var pass=0;pass<2;pass++){
            var wm=pass?1:3.6, alp=al*(pass?.8:.13), g=x.createLinearGradient(pts[0][0],pts[0][1],pts[N][0],pts[N][1]);
            g.addColorStop(0,"rgba("+r.c1.join(",")+","+alp.toFixed(3)+")"); g.addColorStop(1,"rgba("+r.c2.join(",")+","+alp.toFixed(3)+")");
            var Lp=[],Rp=[];
            for(var j=0;j<=N;j++){
                var A=pts[Math.max(0,j-1)], B=pts[Math.min(N,j+1)], dx=B[0]-A[0], dy=B[1]-A[1], len=Math.sqrt(dx*dx+dy*dy)||1;

        if(!alive) return;

        var t=(now-t0)/1000, light=document.documentElement.getAttribute("data-theme")==="light";
        if(light!==lastLight){ lastLight=light; lg.style.mixBlendMode=light?"normal":"screen"; }

        x.globalCompositeOperation=light?"source-over":"lighter";

        var oa=1-ease((t-.55)/.5);

            x.lineWidth=2; x.strokeStyle=(light?"rgba(17,17,17,":"rgba(255,255,255,")+(oa*.95).toFixed(3)+")";
            [[.97,0],[.66,.12]].forEach(function(h){ var p2=ease((t-h[1])/.8), r=R*h[0]; hex(r); x.setLineDash([6*r*p2,6*r]); x.stroke(); });
            x.setLineDash([]);
        }
        var ra=ease((t-.5)/.9); if(ra>0) for(var k2=0;k2<RIB.length;k2++) ribbon(RIB[k2],t+k2*.37,ra*(light?1:.95));
        if(t>1.3){ var rp=((t-1.3)%3.2)/.85; if(rp<1){ var e=ease(rp); hex(R*(.98+.75*e)); x.lineWidth=3*(1-e)+.6; x.strokeStyle=(light?"rgba(22,163,74,":"rgba(74,222,128,")+((1-e)*.75).toFixed(3)+")"; x.stroke(); } }
        x.globalCompositeOperation="source-over";

    }
    function stop(){ alive=false; cancelAnimationFrame(raf); window.removeEventListener("resize",size); }

}

function historyItem(chat){
    const row = document.createElement("div");
    row.className = "history-item";
    row.setAttribute("role","button"); row.tabIndex = 0;
    row.dataset.active = (chat.id === activeId) ? "true" : "false";
    const label = document.createElement("span");
    label.textContent = chat.title;
    const more = document.createElement("button");
    more.type = "button"; more.className = "more-btn"; more.setAttribute("aria-label","Chat options");
    more.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
    more.addEventListener("click", (e) => { e.stopPropagation(); openChatMenu(more, chat); });
    row.append(label, more);
    const open = () => {
        activeId = chat.id;
        renderActiveChat();
        renderHistory(searchInput.value);
        if (isMobile()) setSidebar(false);
    };
    row.addEventListener("click", open);
    row.addEventListener("keydown", (e) => { if (e.target === row && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); open(); } });
    return row;
}

function renderHistory(filter){
    filter = (filter || "").toLowerCase().trim();
    historyEl.innerHTML = "";
    const match = c => !filter || c.title.toLowerCase().includes(filter) ||
        c.messages.some(m => !m.error && m.text.toLowerCase().includes(filter));
    const vis = chats.filter(c => !c.archived && match(c));
    if (!vis.length){
        historyEl.innerHTML = '<div class="history-empty"><span></span></div>';
        historyEl.querySelector("span").textContent = filter ? "No chats match your search." : "No chats yet — start one below.";
        return;
    }
    const section = (name, list) => {
        if (!list.length) return;
        const h = document.createElement("div");
        h.className = "section-label"; h.textContent = name;
        historyEl.appendChild(h);
        list.forEach(c => historyEl.appendChild(historyItem(c)));
    };
    section("Pinned", vis.filter(c => c.pinned));
    section("Recents", vis.filter(c => !c.pinned));
}
searchInput.addEventListener("input", () => renderHistory(searchInput.value));

function deleteChat(id){
    chats = chats.filter(c => c.id !== id);
    saveChats();
    if (activeId === id){
        activeId = (chats.find(c => !c.archived) || {}).id || null;
        renderActiveChat();
    }
    renderHistory(searchInput.value);
                    }

/* Share: native share sheet when available, otherwise copy */
function shareText(t){
    if (navigator.share){ navigator.share({ text:t }).catch(() => {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => showToast("Sharing isn't supported here — copied instead"), () => showToast("Sharing isn't supported here"));
    else showToast("Sharing isn't supported here");
}

/* Read aloud: browser text-to-speech, tap again to stop */
let speakingBtn = null;
function stopSpeaking(){
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (speakingBtn){ speakingBtn.innerHTML = ICON.play; speakingBtn.title = "Read aloud"; speakingBtn = null; }
}
function speak(btn, bubble){
    if (!("speechSynthesis" in window)){ showToast("Read aloud isn't supported in this browser"); return; }
    if (speakingBtn === btn){ stopSpeaking(); return; }
    stopSpeaking();
    const text = (bubble.innerText || bubble.textContent || "").trim();
    if (!text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = /[\u0900-\u097F]/.test(text) ? "hi-IN" : (navigator.language || "en-US");
    u.onend = u.onerror = () => { if (speakingBtn === btn) stopSpeaking(); };
    speakingBtn = btn; btn.innerHTML = ICON.stop; btn.title = "Stop reading";
    try{ speechSynthesis.speak(u); }catch(e){ stopSpeaking(); showToast("Couldn't start read aloud"); }
}

function fmtTime(ts){ return ts ? new Date(ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : ""; }
function copyText(t, quiet){
    const ok = () => { if (!quiet) showToast("Copied to clipboard"); };
    const fb = () => {
        try{
            const a = document.createElement("textarea");
            a.value = t; a.style.cssText = "position:fixed;top:0;left:0;opacity:0";
            document.body.appendChild(a); a.select(); a.setSelectionRange(0, 1e7);
            const r = document.execCommand("copy"); a.remove();
            r ? ok() : showToast("Copy failed");
        }catch(e){ showToast("Copy failed"); }
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fb); else fb();
}

    const cmd = s.match(/^\/(?:image|imagine|img|draw)\s+([\s\S]+)/i); if (cmd) return cmd[1].trim();
    if (/\b(website|web ?site|web ?page|landing page|html|css|javascript|source code|script|photoshop|canva|python|kaise|how to|how do|what is|explain)\b/i.test(s)) return null;
    const noun = "(?:image|images|picture|pictures|photo|photos|pic|pics|logo|poster|wallpaper|illustration|artwork|portrait|icon|banner|thumbnail|sticker|avatar|drawing|painting|sketch|tasveer|tasvir|chitra|chhavi|fotu|dp|meme|cartoon|render)";
    const verb = "(?:generate|create|make|draw|design|paint|render|produce|imagine|bana(?:o|do|de|dena|iye|kar|ke)?|banado|bnao|bnado|bnakar|bna\\s?do|bana\\s?kar|dikhao)";
    if (new RegExp("\\b"+verb+"\\b[^.?!\\n]{0,50}\\b"+noun+"\\b","i").test(s) || new RegExp("\\b"+noun+"\\b[^.?!\\n]{0,50}\\b"+verb+"\\b","i").test(s)) return s;
    return null;
}
function stripCmd(s){
    const r = s.replace(/\b(?:please|plz|pls|can you|could you|kindly|mujhe|mere liye|generate|create|make|draw|design|bana(?:o|do|de|dena|iye)?|banado|bnao|bnado|bna\s?do|dikhao)\b/gi," ")
               .replace(/\b(?:an?|the|ek)?\s*(?:image|picture|photo|pic)\s*(?:of|for|ka|ki|ke)?\b/gi," ").replace(/\s+/g," ").trim();
    return r.length > 3 ? r : s;

function ratioFor(s){
    if (/9:16|portrait|story|reel|phone wallpaper|mobile wallpaper|poster|vertical|tall/i.test(s)) return [768,1344];

/* GPT Image 2 runs on YOUR server (/image) so the OpenAI key never reaches the browser. Falls back to Flux if it is not set up. */
let gptOffUntil = 0; const inflight = {};
const gptSize = o => o.w > o.h ? "1536x1024" : o.h > o.w ? "1024x1536" : "1024x1024";
function gptGenerate(o){
    if (inflight[o.id]) return inflight[o.id];
    const job = (async () => {
        let rec = null;
        if (Date.now() > gptOffUntil){
            try{
                const ac = new AbortController(), to = setTimeout(() => ac.abort(), 150000);
                const r = await fetch(API_URL.replace(/\/chat\/?$/, "/image"), { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ prompt:o.o, size:gptSize(o) }), signal:ac.signal });
                clearTimeout(to);
                if (r.ok){ const d = await r.json(); if (d && d.image) rec = { u:d.image, e:d.engine || "GPT Image 2" }; }
                else if ([401,403,404,501].includes(r.status)) gptOffUntil = Date.now() + 10*60000;   /* endpoint missing or key not set: skip for 10 min */
            }catch(e){}
        }
        if (!rec) rec = { pol:1, p:await enhancePrompt(o.o) };
        await idbPut(o.id, rec);
        return rec;
    })();
    inflight[o.id] = job;
    job.finally(() => setTimeout(() => { delete inflight[o.id]; }, 8000));
    return job;
}
